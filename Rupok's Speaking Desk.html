city since I started university."},{"n":666,"bn":"আমি অনেক বছর ধরে এই দিনের অপেক্ষায় ছিলাম।","en":"I've waited years for this day. / I've been waiting years for this day.","note":"","say":"I've waited years for this day.. I've been waiting years for this day."},{"n":667,"bn":"সে জন্ম থেকেই এখানে থাকে।","en":"He has lived here all his life.","note":"","say":"He has lived here all his life."},{"n":668,"bn":"আমাদের পরিচয় অনেক দিনের।","en":"We've known each other for a long time.","note":"","say":"We've known each other for a long time."}]},{"t":"box","k":"warn","h":"The #1 perfect-tense mistake of Bengali speakers: \"<b>I am here for two years<\/b>\" or \"<b>I know him since 2015<\/b>\". Bengali uses present tense (আছি, চিনি), English uses <b>present perfect<\/b>: <i>I <b>have been<\/b> here for two years. I <b>have known<\/b> him since 2015.<\/i>"},{"t":"h2","h":"Present Perfect vs Past Simple"},{"t":"box","k":"key","h":"<b>Past simple<\/b> = finished time, the story, <i>when<\/i> matters. <b>Present perfect<\/b> = no specific time, the <i>result / experience / connection to now<\/i> matters.<br>\"I <b>have lost<\/b> my phone.\" (I don't have it now.) → \"Where <b>did<\/b> you <b>lose<\/b> it?\" \"I <b>lost<\/b> it on the bus <b>yesterday<\/b>.\""},{"t":"tr","rows":[{"n":669,"bn":"আমি আমার ফোন হারিয়ে ফেলেছি। কাল বাসে হারিয়েছি।","en":"I've lost my phone. I lost it on the bus yesterday.","note":"","say":"I've lost my phone. I lost it on the bus yesterday."},{"n":670,"bn":"তুমি কি কখনো জাপানে গিয়েছ? — হ্যাঁ, ২০১৯ সালে গিয়েছিলাম।","en":"Have you ever been to Japan? — Yes, I went there in 2019.","note":"","say":"Have you ever been to Japan? — Yes, I went there in 2019."},{"n":671,"bn":"আমি পেপারটা শেষ করেছি। গতরাতে শেষ করলাম।","en":"I've finished the paper. I finished it last night.","note":"","say":"I've finished the paper. I finished it last night."},{"n":672,"bn":"সে বিদেশে চলে গেছে। গত মাসে গেছে।","en":"She has moved abroad. She moved last month.","note":"","say":"She has moved abroad. She moved last month."},{"n":673,"bn":"আমি দুই বছর আগে এখানে এসেছি।","en":"I came here two years ago.","note":"\"ago\" → past simple","say":"I came here two years ago."},{"n":674,"bn":"আমি দুই বছর ধরে এখানে আছি।","en":"I've been here for two years.","note":"duration up to now → present perfect","say":"I've been here for two years."},{"n":675,"bn":"আমি গতকাল তাকে দেখেছি।","en":"I saw him yesterday.","note":"NOT \"I have seen him yesterday\"","say":"I saw him yesterday."},{"n":676,"bn":"আমি তাকে ইদানীং দেখিনি।","en":"I haven't seen him lately.","note":"","say":"I haven't seen him lately."},{"n":677,"bn":"তুমি কখন এসেছ?","en":"When did you arrive?","note":"\"when\" → past simple","say":"When did you arrive?"},{"n":678,"bn":"তুমি কতক্ষণ ধরে এখানে আছ?","en":"How long have you been here?","note":"","say":"How long have you been here?"},{"n":679,"bn":"আমি ২০২২ সালে মাস্টার্স শেষ করেছি।","en":"I finished my master's in 2022.","note":"","say":"I finished my master's in 2022."},{"n":680,"bn":"আমি মাস্টার্স শেষ করেছি, এখন পিএইচডি করছি।","en":"I've finished my master's, and now I'm doing a PhD.","note":"","say":"I've finished my master's, and now I'm doing a PhD."},{"n":681,"bn":"আমার দাদা দশ বছর আগে মারা গেছেন।","en":"My grandfather died ten years ago.","note":"NOT \"has died ten years ago\"","say":"My grandfather died ten years ago."},{"n":682,"bn":"সে তিনটা উপন্যাস লিখেছে। (সে এখনও লেখক)","en":"She has written three novels.","note":"","say":"She has written three novels."},{"n":683,"bn":"রবীন্দ্রনাথ অনেক গান লিখেছেন।","en":"Tagore wrote many songs.","note":"he's dead → past simple","say":"Tagore wrote many songs."},{"n":684,"bn":"আমি আজ সকালে জিমে গিয়েছিলাম।","en":"I went to the gym this morning.","note":"morning is over","say":"I went to the gym this morning."},{"n":685,"bn":"আমি আজ জিমে গিয়েছি।","en":"I've been to the gym today.","note":"","say":"I've been to the gym today."}]},{"t":"h2","h":"Present Perfect — Mistakes"},{"t":"mx","rows":[["I have seen him yesterday.","I <b>saw<\/b> him yesterday.","finished time → past simple"],["I am living here since 2023.","I <b>have been living<\/b> / <b>have lived<\/b> here since 2023.","since/for → perfect"],["I know her for five years.","I <b>have known<\/b> her for five years.","stative verb, perfect simple"],["How long are you in the US?","How long <b>have<\/b> you <b>been<\/b> in the US?",""],["Since when you are here?","How long have you been here? / Since when have you been here?",""],["Did you ever go to London?","<b>Have<\/b> you ever <b>been<\/b> to London?","\"ever\" + experience → perfect (US English sometimes uses \"Did you ever…\" informally)"],["I have gone to Paris last year.","I <b>went<\/b> to Paris last year.",""],["I didn't finish yet.","I <b>haven't finished<\/b> yet.","\"yet\" → perfect (in UK English; US informal allows past)"],["He has came.","He <b>has come<\/b>.","V3 of come = come"],["She has went home.","She <b>has gone<\/b> home.","V3 of go = gone"],["I have ate.","I <b>have eaten<\/b>.","V3 of eat = eaten"],["I have wrote.","I <b>have written<\/b>.","V3 of write = written"],["Since two years","<b>For<\/b> two years","for + duration"],["For 2020","<b>Since<\/b> 2020","since + starting point"],["It's two years since I don't see her.","It's been two years since I <b>last saw<\/b> her. / I <b>haven't seen<\/b> her for two years.",""]],"say":["I saw him yesterday.","I have been living. have lived here since 2023.","I have known her for five years.","How long have you been in the US?","How long have you been here?. Since when have you been here?","Have you ever been to London?","I went to Paris last year.","I haven't finished yet.","He has come.","She has gone home.","I have eaten.","I have written.","For two years","Since 2020","It's been two years since I last saw her.. I haven't seen her for two years."]}]},{"id":12,"title":"Present Perfect Continuous","blocks":[{"t":"h2","h":"Form and Use"},{"t":"box","k":"rule","h":"have / has + been + verb-ing<br>I<b>'ve been working<\/b> · She<b>'s been working<\/b> · I <b>haven't been working<\/b> · <b>Have<\/b> you <b>been working<\/b>?"},{"t":"p","h":"Use it for:"},{"t":"p","h":"1. An action that <b>started in the past and is still going on<\/b>, with focus on <b>duration<\/b>: <i>I've been studying for three hours.<\/i>"},{"t":"p","h":"2. An action that <b>recently stopped<\/b> and has a visible result: <i>You look tired. Have you been running?<\/i> (You're sweating.)"},{"t":"p","h":"3. Repeated actions over a period up to now: <i>I've been calling you all day!<\/i>"},{"t":"p","h":"Bengali clue: <b>\"…ধরে …ছি\"<\/b> (তিন ঘণ্টা ধরে পড়ছি) → present perfect continuous."},{"t":"h2","h":"Translation Drill"},{"t":"tr","rows":[{"n":686,"bn":"আমি তিন ঘণ্টা ধরে পড়ছি।","en":"I've been studying for three hours.","note":"","say":"I've been studying for three hours."},{"n":687,"bn":"আমি সকাল থেকে কোড ডিবাগ করছি।","en":"I've been debugging the code since this morning.","note":"","say":"I've been debugging the code since this morning."},{"n":688,"bn":"আমি দুই বছর ধরে এই প্রজেক্টে কাজ করছি।","en":"I've been working on this project for two years.","note":"","say":"I've been working on this project for two years."},{"n":689,"bn":"আমরা এক ঘণ্টা ধরে তোমার জন্য অপেক্ষা করছি!","en":"We've been waiting for you for an hour!","note":"","say":"We've been waiting for you for an hour!"},{"n":690,"bn":"সকাল থেকে বৃষ্টি হচ্ছে।","en":"It's been raining since the morning.","note":"","say":"It's been raining since the morning."},{"n":691,"bn":"আমি ছয় মাস ধরে ইংরেজি বলা প্র্যাকটিস করছি।","en":"I've been practising spoken English for six months.","note":"","say":"I've been practising spoken English for six months."},{"n":692,"bn":"তুমি কতদিন ধরে পিএইচডি করছ?","en":"How long have you been doing your PhD?","note":"","say":"How long have you been doing your PhD?"},{"n":693,"bn":"সে কতক্ষণ ধরে ফোনে কথা বলছে?","en":"How long has she been talking on the phone?","note":"","say":"How long has she been ou called.","note":"","say":"I was taking a shower when you called."},{"n":768,"bn":"আমি ক্যাম্পাসে হাঁটছিলাম, তখন হঠাৎ বৃষ্টি শুরু হলো।","en":"I was walking on campus when it suddenly started to rain.","note":"","say":"I was walking on campus when it suddenly started to rain."},{"n":769,"bn":"সে যখন ঘরে ঢুকল, সবাই হাসছিল।","en":"When she came in, everyone was laughing.","note":"","say":"When she came in, everyone was laughing."},{"n":770,"bn":"আমি রান্না করছিলাম আর আমার স্ত্রী কাপড় ভাঁজ করছিল।","en":"I was cooking while my wife was folding the laundry.","note":"","say":"I was cooking while my wife was folding the laundry."},{"n":771,"bn":"লেকচার চলার সময় কেউ একজন ফোনে কথা বলছিল।","en":"Someone was talking on the phone during the lecture.","note":"","say":"Someone was talking on the phone during the lecture."},{"n":772,"bn":"আমি গাড়ি চালাচ্ছিলাম, তাই ফোন ধরতে পারিনি।","en":"I was driving, so I couldn't answer the phone.","note":"","say":"I was driving, so I couldn't answer the phone."},{"n":773,"bn":"তুমি গতকাল এই সময়ে কী করছিলে?","en":"What were you doing at this time yesterday?","note":"","say":"What were you doing at this time yesterday?"},{"n":774,"bn":"আমি কোড লিখছিলাম, তখন ল্যাপটপটা হঠাৎ বন্ধ হয়ে গেল।","en":"I was writing code when my laptop suddenly shut down.","note":"","say":"I was writing code when my laptop suddenly shut down."},{"n":775,"bn":"সূর্য ডুবছিল, পাখিরা ঘরে ফিরছিল।","en":"The sun was setting, and the birds were flying home.","note":"","say":"The sun was setting, and the birds were flying home."},{"n":776,"bn":"আমি যখন ঘুমাচ্ছিলাম, কেউ দরজায় কড়া নাড়ল।","en":"Someone knocked on the door while I was sleeping.","note":"","say":"Someone knocked on the door while I was sleeping."},{"n":777,"bn":"সারা রাত বৃষ্টি হচ্ছিল।","en":"It was raining all night.","note":"","say":"It was raining all night."},{"n":778,"bn":"আমি তোমার কথাই ভাবছিলাম!","en":"I was just thinking about you!","note":"","say":"I was just thinking about you!"},{"n":779,"bn":"আমি n":805,"bn":"আমি ছয় মাস ধরে অপেক্ষা করার পর অবশেষে ভিসা পেলাম।","en":"I finally got my visa after I had waited for six months.","note":"","say":"I finally got my visa after I had waited for six months."}]},{"t":"box","k":"note","h":"If \"before\" or \"after\" makes the order clear, past simple is also fine: <i>I left <b>before<\/b> he arrived.<\/i> But past perfect makes your story clearer and sounds more advanced — a Band 7 feature."}]},{"id":16,"title":"Past Perfect Continuous","blocks":[{"t":"h2","h":"Form and Use"},{"t":"box","k":"rule","h":"had + been + verb-ing<br>I <b>had been working<\/b> · She <b>hadn't been working<\/b> · <b>Had<\/b> you <b>been working<\/b>?"},{"t":"p","h":"Use it for an action that was <b>in progress for a period before another past event<\/b> — focus on duration, often explaining a past result."},{"t":"p","h":"Bengali clue: <b>\"…ধরে …ছিলাম\"<\/b> in a past story (আমি দুই ঘণ্টা ধরে অপেক্ষা করছিলাম যখন সে এলো)."},{"t":"h2","h":"Translation Drill"},{"t":"tr","rows":[{"n":806,"bn":"সে আসার আগে আমি দুই ঘণ্টা ধরে অপেক্ষা করছিলাম।","en":"I had been waiting for two hours before she arrived.","note":"","say":"I had been waiting for two hours before she arrived."},{"n":807,"bn":"আমি পাঁচ বছর ধরে ঢাকায় কাজ করছিলাম, তারপর আমেরিকায় আসি।","en":"I had been working in Dhaka for five years before I came to the US.","note":"","say":"I had been working in Dhaka for five years before I came to the US."},{"n":808,"bn":"সে ক্লান্ত ছিল কারণ সারাদিন কাজ করছিল।","en":"She was tired because she had been working all day.","note":"","say":"She was tired because she had been working all day."},{"n":809,"bn":"রাস্তা ভেজা ছিল, কারণ সারারাত বৃষ্টি হচ্ছিল।","en":"The road was wet because it had been raining all night.","note":"","say":"The road was wet because it had been raining all night."},{"n":810,"bn":"আমি কয়েক মাস ধরে এই বিষয়ে পড়াশোনা করছিলাম, তাই প্রশ্নটা সহজ লেগেছিল।","en":"I had been studying this topic for months, so the question felt easy.","note":"", .","note":"","say":"I'm not going to be late like this ever again."},{"n":841,"bn":"আমার স্ত্রী আগামী মাস থেকে একটা কোর্স শুরু করবে।","en":"My wife is going to start a course next month.","note":"","say":"My wife is going to start a course next month."},{"n":842,"bn":"এই সেমিস্টারটা খুব কঠিন হবে।","en":"This semester is going to be really tough.","note":"","say":"This semester is going to be really tough."}]},{"t":"h2","h":"Present tenses for the future"},{"t":"tr","rows":[{"n":843,"bn":"আমি কাল সকাল দশটায় ডাক্তারের কাছে যাচ্ছি।","en":"I'm seeing the doctor at ten tomorrow morning.","note":"","say":"I'm seeing the doctor at ten tomorrow morning."},{"n":844,"bn":"আমরা শুক্রবার রাতে বন্ধুদের সাথে ডিনার করছি।","en":"We're having dinner with friends on Friday night.","note":"","say":"We're having dinner with friends on Friday night."},{"n":845,"bn":"ফ্লাইট সকাল ছয়টা চল্লিশে ছাড়ে।","en":"The flight leaves at 6:40 a.m.","note":"","say":"The flight leaves at 6:40 a.m."},{"n":846,"bn":"সেমিস্টার আগস্টের ২০ তারিখে শুরু হচ্ছে।","en":"The semester starts on August 20th.","note":"","say":"The semester starts on August 20th."},{"n":847,"bn":"কনফারেন্স কবে শুরু হচ্ছে?","en":"When does the conference start?","note":"","say":"When does the conference start?"},{"n":848,"bn":"আমি যখন বাসায় পৌঁছাব, তোমাকে ফোন করব।","en":"I'll call you when I get home.","note":"NOT \"when I will get home\"","say":"I'll call you when I get home."},{"n":849,"bn":"তুমি না আসা পর্যন্ত আমি অপেক্ষা করব।","en":"I'll wait until you come.","note":"","say":"I'll wait until you come."},{"n":850,"bn":"রেজাল্ট বের হলেই আমি তোমাকে জানাব।","en":"I'll let you know as soon as the results come out.","note":"","say":"I'll let you know as soon as the results come out."},{"n":851,"bn":"আমি শেষ করার আগে তোমাকে দেখাব।","en":"I'll show you before I finish.","note":"","say":"I'll show you before I finish."},{"n":852,"bn":"যদি বৃষ্টি হয়, আমরা বাসায় থাকব।","en":"If it rains, we'll stay home.","note":"","say":"If it rains, 2028), <b>before<\/b>, <b>in<\/b> (in two years' time)."},{"t":"tr","rows":[{"n":861,"bn":"শুক্রবারের মধ্যে আমি রিপোর্টটা শেষ করে ফেলব।","en":"I'll have finished the report by Friday.","note":"","say":"I'll have finished the report by Friday."},{"n":862,"bn":"২০২৮ সালের মধ্যে আমি পিএইচডি শেষ করে ফেলব।","en":"I'll have completed my PhD by 2028.","note":"","say":"I'll have completed my PhD by 2028."},{"n":863,"bn":"তুমি আসার আগেই আমি রান্না শেষ করে ফেলব।","en":"I'll have finished cooking before you arrive.","note":"","say":"I'll have finished cooking before you arrive."},{"n":864,"bn":"সে পৌঁছানোর আগে মিটিং শেষ হয়ে যাবে।","en":"The meeting will have ended by the time she arrives.","note":"","say":"The meeting will have ended by the time she arrives."},{"n":865,"bn":"এই মাসের শেষে আমি দুইশো খাতা দেখে ফেলব।","en":"By the end of this month, I'll have graded two hundred papers.","note":"","say":"By the end of this month, I'll have graded two hundred papers."},{"n":866,"bn":"আগামী জুনে আমাদের বিয়ের পাঁচ বছর পূর্ণ হবে।","en":"Next June, we'll have been married for five years.","note":"","say":"Next June, we'll have been married for five years."},{"n":867,"bn":"সপ্তাহের শেষে সে সব টাকা খরচ করে ফেলবে।","en":"She'll have spent all the money by the end of the week.","note":"","say":"She'll have spent all the money by the end of the week."},{"n":868,"bn":"আমরা পৌঁছাতে পৌঁছাতে সিনেমা শুরু হয়ে যাবে।","en":"The movie will have started by the time we get there.","note":"","say":"The movie will have started by the time we get there."},{"n":869,"bn":"ততদিনে তুমি সবকিছু ভুলে যাবে।","en":"By then, you'll have forgotten everything.","note":"","say":"By then, you'll have forgotten everything."},{"n":870,"bn":"রিভিউয়াররা কি আগস্টের মধ্যে সিদ্ধান্ত জানিয়ে দেবে?","en":"Will the reviewers have made a decision by August?","note":"","say":"Will the reviewers have made a decision by August?"}]},{"t":"h2","h":"Future Perfect Continuous"},{"t":"tr","rows":[{"n":871,"bn":"আগামী মে মাসে আমি এখা র্চের পনেরো তারিখ।","en":"The paper is due on March 15th.","note":"","say":"The paper is due on March 15th."},{"n":880,"bn":"আমি আগামী বছর ডিগ্রি শেষ করার আশা করছি।","en":"I'm hoping to finish my degree next year.","note":"","say":"I'm hoping to finish my degree next year."},{"n":881,"bn":"আমি এই গ্রীষ্মে ইন্টার্নশিপ করার পরিকল্পনা করছি।","en":"I'm planning to do an internship this summer.","note":"","say":"I'm planning to do an internship this summer."},{"n":882,"bn":"আমি পরের মাসে নতুন বাসায় উঠব বলে ভাবছি।","en":"I'm thinking of moving to a new place next month.","note":"","say":"I'm thinking of moving to a new place next month."},{"n":883,"bn":"সে সম্ভবত দেরি করবে।","en":"She's likely to be late.","note":"","say":"She's likely to be late."},{"n":884,"bn":"এটা প্রায় নিশ্চিত যে দাম বাড়বে।","en":"Prices are bound to go up.","note":"","say":"Prices are bound to go up."}]},{"t":"box","k":"try","h":"One minute: \"What are your plans for the next five years?\" Use at least five future forms: <i>I'm going to…, I'll probably…, I'm hoping to…, By 2030 I'll have…, This time next year I'll be…<\/i>"}]},{"id":18,"title":"Perfect Tenses Deep Dive (Your Weak Point)","blocks":[{"t":"p","h":"Bengali speakers make perfect-tense errors for one simple reason: <b>Bengali tense endings don't line up with English tenses.<\/b> আমি খেয়েছি may be \"I have eaten\" or \"I ate\"; আমি দুই বছর ধরে এখানে আছি is present in Bengali but present perfect in English. This chapter trains your choice directly."},{"t":"h2","h":"The 5-Second Decision Tree"},{"t":"box","k":"rule","h":"1. Is there a FINISHED time (yesterday, ago, in 2022, last week, when I was…)? → PAST SIMPLE<br>2. Is there \"for / since / how long\" + still true now? → PRESENT PERFECT (continuous if it is an activity)<br>3. Is it life experience, \"ever/never\", \"so far\", \"yet/already/just\", \"today/this week\" (not finished)? → PRESENT PERFECT<br>4. Two past events, and this one happened FIRST? → PAST PERFECT<br>5. Something will be COMPLETE before a future time (\"by…\")? → FUTURE PERFECT"},{"t":"h2","h":"Bengali Endings → English Tense"},{"t":"tb","head":["Bengali","Context","English"],"rows":[["খেয়েছি","no time / result now","I've eaten. (present perfect)"],["খেয়েছি","গতকাল / দুই ঘণ্টা আগে","I ate (yesterday / two hours ago). (past simple)"],["খেলাম","story / finished time","I ate. (past simple)"],["খেয়েছিলাম","finished time, far past","I ate. (past simple)"],["খেয়েছিলাম","before another past event","I had eaten. (past perfect)"],["… ধরে আছি / করি","duration up to now","I've been… / I've lived… (present perfect)"],["… ধরে করছি","activity up to now","I've been doing… (present perfect continuous)"],["… ধরে করছিলাম","activity before past event","I had been doing… (past perfect continuous)"],["করে ফেলব","before a future time","I'll have done… (future perfect)"]]},{"t":"h2","h":"Contrast Pairs — Say Both Sentences"},{"t":"tr","rows":[{"n":885,"bn":"আমি খেয়েছি, এখন ক্ষুধা নেই।","en":"I've eaten, so I'm not hungry now.","note":"","say":"I've eaten, so I'm not hungry now."},{"n":886,"bn":"আমি এক ঘণ্টা আগে খেয়েছি।","en":"I ate an hour ago.","note":"","say":"I ate an hour ago."},{"n":887,"bn":"সে বাসায় চলে গেছে।","en":"He has gone home.","note":"he's not here now","say":"He has gone home."},{"n":888,"bn":"সে কাল রাতে বাসায় গেছে।","en":"He went home last night.","note":"","say":"He went home last night."},{"n":889,"bn":"আমি পাঁচ বছর ঢাকায় ছিলাম। (এখন থাকি না)","en":"I lived in Dhaka for five years.","note":"finished period → past simple","say":"I lived in Dhaka for five years."},{"n":890,"bn":"আমি পাঁচ বছর ধরে ঢাকায় আছি। (এখনও আছি)","en":"I've lived in Dhaka for five years.","note":"still true → present perfect","say":"I've lived in Dhaka for five years."},{"n":891,"bn":"আমি তাকে আজ দেখিনি। (দিন এখনও শেষ হয়নি)","en":"I haven't seen him today.","note":"","say":"I haven't seen him today."},{"n":892,"bn":"আমি তাকে কাল দেখিনি।","en":"I didn't see him yesterday.","note":"","say":"I didn't see him yesterday."},{"n":893,"bn":"তুমি কি পেপারটা পড়েছ?","en":"Have you read the paper?","note":"","say":"Have you read the paper?"},{"n":894,"bn":"তুমি কি কাল পেপারটা পড়েছিলে?","en":"Did you read the paper yesterday?","note":"","say":"Did you read the paper yesterday?"},{"n":895,"bn":"আমি অনেক দেশ ঘুরেছি।","en":"I've travelled to many countries.","note":"","say":"I've travelled to many countries."},{"n":896,"bn":"আমি ছোটবেলায় অনেক দেশ ঘুরেছিলাম।","en":"I travelled to many countries as a child.","note":"","say":"I travelled to many countries as a child."},{"n":897,"bn":"আমি যখন পৌঁছালাম, সে চলে গেল।","en":"When I arrived, she left.","note":"first I arrived, then she left","say":"When I arrived, she left."},{"n":898,"bn":"আমি যখন পৌঁছালাম, সে চলে গিয়েছিল।","en":"When I arrived, she had left.","note":"she left first","say":"When I arrived, she had left."},{"n":899,"bn":"আমি জানতাম না সে বিয়ে করেছে।","en":"I didn't know he had got married.","note":"","say":"I didn't know he had got married."},{"n":900,"bn":"আমি জানি সে বিয়ে করেছে।","en":"I know he has got married. / I know he's married.","note":"","say":"I know he has got married.. I know he's married."},{"n":901,"bn":"সে ফোন করেছে।","en":"She has called.","note":"news, result now","say":"She has called."},{"n":902,"bn":"সে আমাকে কাল তিনবার ফোন করেছিল।","en":"She called me three times yesterday.","note":"","say":"She called me three times yesterday."},{"n":903,"bn":"সে আজ আমাকে তিনবার ফোন করেছে।","en":"She has called me three times today.","note":"","say":"She has called me three times today."},{"n":904,"bn":"আমি এই সিনেমাটা দেখেছি।","en":"I've seen this movie.","note":"","say":"I've seen this movie."},{"n":905,"bn":"আমি গত সপ্তাহে এই সিনেমাটা দেখেছিলাম।","en":"I saw this movie last week.","note":"","say":"I saw this movie last week."},{"n":906,"bn":"আমি কখনো নিউইয়র্ক যাইনি।","en":"I've never been to New York.","note":"","say":"I've never been to New York."},{"n":907,"bn":"আমি গত বছর নিউইয়র্ক যাইনি।","en":"I didn't go to New York last year.","note":"","say":"I didn't go to New York last year."},{"n":908,"bn":"আমি চার ঘণ্টা ধরে পড়ছি।","en":"I've been studying for four hours.","note":"","say":"I've been studying for four hours."},{"n":909,"bn":"আমি গতকাল চার ঘণ্টা পড়েছিলাম।","en":"I studied for four hours yesterday.","note":"","say":"I studied for four hours yesterday."},{"n":910,"bn":"আমার মোবাইল নষ্ট হয়ে গেছে।","en":"My phone has broken.","note":"","say":"My phone has broken."},{"n":911,"bn":"আমার মোবাইল গত সপ্তাহে নষ্ট হয়ে গিয়েছিল।","en":"My phone broke last week.","note":"","say":"My phone broke last week."},{"n":912,"bn":"আমি ইতিমধ্যে টিকিট কিনে ফেলেছি।","en":"I've already bought the tickets.","note":"","say":"I've already bought the tickets."},{"n":913,"bn":"আমি তিন দিন আগে টিকিট কিনেছি।","en":"I bought the tickets three days ago.","note":"","say":"I bought the tickets three days ago."}]},{"t":"h2","h":"\"How long\" Questions — Always Practise These"},{"t":"tr","rows":[{"n":914,"bn":"তুমি কতদিন ধরে আমেরিকায় আছ?","en":"How long have you been in the US?","note":"","say":"How long have you been in the US?"},{"n":915,"bn":"তুমি কতদিন ধরে এই ল্যাবে কাজ করছ?","en":"How long have you been working in this lab?","note":"","say":"How long have you been working in this lab?"},{"n":916,"bn":"তুমি কতদিন ধরে বিবাহিত?","en":"How long have you been married?","note":"","say":"How long have you been married?"},{"n":917,"bn":"তুমি কতদিন ধরে টিএ হিসেবে কাজ করছ?","en":"How long have you been working as a TA?","note":"","say":"How long have you been working as a TA?"},{"n":918,"bn":"তুমি কতদিন ধরে ইংরেজি শিখছ?","en":"How long have you been learning English?","note":"","say":"How long have you been learning English?"},{"n":919,"bn":"তুমি কতদিন ধরে তোমার সুপারভাইজারকে চেনো?","en":"How long have you known your supervisor?","note":"","say":"How long have you known your supervisor?"},{"n":920,"bn":"তুমি কতক্ষণ ধরে অপেক্ষা করছ?","en":"How long have you been waiting?","note":"","say":"How long have you been waiting?"},{"n":921,"bn":"এই সমস্যাটা কতদিন ধরে হচ্ছে?","en":"How long has this problem been happening?","note":"","say":"How long has this problem been happening?"},{"n":922,"bn":"তোমার এই ব্যথাটা কতদিন ধরে?","en":"How long have you had this pain?","note":"","say":"How long have you had this pain?"},{"n":923,"bn":"তুমি কতদিন ধরে এই শহরে আছ?","en":"How long have you lived in this city?","note":"","say":"How long have you lived in this city?"},{"n":924,"bn":"তুমি এখানে কবে এসেছ?","en":"When did you come here?","note":"compare: \"when\" → past simple","say":"When did you come here?"},{"n":925,"bn":"তুমি এখানে কতদিন থাকবে?","en":"How long are you going to stay here? / How long will you be here?","note":"","say":"How long are you going to stay here?. How long will you be here?"},{"n":926,"bn":"তুমি এখানে কতদিন ছিলে? (এখন চলে যাচ্ছ)","en":"How long were you here?","note":"finished","say":"How long were you here?"}]},{"t":"h2","h":"Present Perfect in IELTS-Style Answers"},{"t":"p","h":"Examiners love the present perfect because it shows you can connect past and present. Learn these \"frames\" and use them in every speaking test."},{"t":"tb","head":["Frame","Example"],"rows":[["I've always + V3 …","I've always been interested in security."],["Ever since I was …, I've …","Ever since I was a teenager, I've loved solving puzzles."],["I've been + -ing for …","I've been working on side-channel attacks for about a year."],["So far, I've …","So far, I've published two papers."],["I haven't … yet, but …","I haven't been to Europe yet, but I'm planning to."],["It's the best … I've ever …","It's the best meal I've ever had."],["Over the last few years, … has + V3","Over the last few years, technology has changed the way we study."],["Recently, I've started …","Recently, I've started cooking more at home."],["I've never really …","I've never really been a morning person."],["This is the first time I've …","This is the first time I've taught a lab section. (\"first time\" + present perfect!)"],["It's been … since …","It's been two years since I last visited my parents."]]},{"t":"tr","rows":[{"n":927,"bn":"আমি সবসময়ই নিরাপত্তা বিষয়ে আগ্রহী ছিলাম।","en":"I've always been interested in security.","note":"","say":"I've always been interested in security."},{"n":928,"bn":"ছোটবেলা থেকেই আমি ধাঁধা সমাধান করতে ভালোবাসি।","en":"Ever since I was a child, I've loved solving puzzles.","note":"","say":"Ever since I was a child, I've loved solving puzzles."},{"n":929,"bn":"গত কয়েক বছরে প্রযুক্তি আমাদের পড়াশোনার ধরন বদলে দিয়েছে।","en":"Over the last few years, technology has changed the way we study.","note":"","say":"Over the last few years, technology has changed the way we study."},{"n":930,"bn":"এই প্রথম আমি কোনো ল্যাব সেকশন পড়াচ্ছি।","en":"This is the first time I've taught a lab section.","note":"","say":"This is the first time I've taught a lab section."},{"n":931,"bn":"এই প্রথম আমি বরফ দেখলাম।","en":"It's the first time I've seen snow.","note":"","say":"It's the first time I've seen snow."},{"n":932,"bn":"শেষবার বাবা-মাকে দেখার পর দুই বছর হয়ে গেছে।","en":"It's been two years since I last saw my parents.","note":"","say":"It's been two years since I last saw my parents."},{"n":933,"bn":"ইদানীং আমি বাসায় বেশি রান্না শুরু করেছি।","en":"Recently, I've started cooking more at home.","note":"","say":"Recently, I've started cooking more at home."},{"n":934,"bn":"আমি কখনোই সকালের মানুষ ছিলাম না।","en":"I've never really been a morning person.","note":"","say":"I've never really been a morning person."},{"n":935,"bn":"সম্প্রতি আমার শহর অনেক বদলে গেছে।","en":"My city has changed a lot recently.","note":"","say":"My city has changed a lot recently."},{"n":936,"bn":"সোশ্যাল মিডিয়া মানুষের যোগাযোগের ধরন বদলে দিয়েছে।","en":"Social media has changed the way people communicate.","note":"","say":"Social media has changed the way people communicate."},{"n":937,"bn":"গত দশকে অনলাইন শিক্ষা অনেক জনপ্রিয় হয়েছে।","en":"Online education has becom ুশীলন করিনি।","en":"I had made the slides the night before, but I hadn't practised saying them aloud.","note":"","say":"I had made the slides the night before, but I hadn't practised saying them aloud."},{"n":944,"bn":"একজন ছাত্র এমন একটা প্রশ্ন করল যা আমি আশা করিনি।","en":"A student asked a question I hadn't expected.","note":"","say":"A student asked a question I hadn't expected."},{"n":945,"bn":"পরে আমি বুঝলাম আমি সেই এক ঘণ্টায় অনেক কিছু শিখেছি।","en":"Later, I realised I had learned a lot in that one hour.","note":"","say":"Later, I realised I had learned a lot in that one hour."},{"n":946,"bn":"আমি বিমানবন্দরে পৌঁছে দেখি আমার ফ্লাইট বাতিল হয়ে গেছে।","en":"When I got to the airport, I found out my flight had been cancelled.","note":"","say":"When I got to the airport, I found out my flight had been cancelled."},{"n":947,"bn":"আমরা দেখা করার আগে অনেক মাস ধরে ইমেইলে কথা বলছিলাম।","en":"We had been emailing for months before we met in person.","note":"","say":"We had been emailing for months before we met in person."},{"n":948,"bn":"সে স্বীকার করল যে সে ভুল করেছিল।","en":"He admitted that he had made a mistake.","note":"","say":"He admitted that he had made a mistake."},{"n":949,"bn":"আমার মনে পড়ল আমি চুলা বন্ধ করিনি।","en":"I remembered that I hadn't turned off the stove.","note":"","say":"I remembered that I hadn't turned off the stove."},{"n":950,"bn":"আমি এর আগে কখনো এত মানুষের সামনে কথা বলিনি।","en":"I had never spoken in front of so many people before.","note":"","say":"I had never spoken in front of so many people before."},{"n":951,"bn":"অনুষ্ঠান শেষ হওয়ার পর আমরা সবাই একসাথে খেতে গেলাম।","en":"After the event had finished, we all went out to eat together.","note":"","say":"After the event had finished, we all went out to eat together."}]},{"t":"h2","h":"Mixed Perfect Drill — Choose the Tense Yourself"},{"t":"p","h":"Cover the right side and decide: present perfect, present perfect continuous, past simple, past perfect, or future perfect?"},{"t":"tr","r subject — <i>Our paper was rejected (by the reviewers).<\/i>"},{"t":"p","h":"Use the passive when the doer is <b>unknown, obvious, unimportant, or you want to sound polite/academic<\/b>: <i>My bike was stolen. The results were analysed. Mistakes were made.<\/i> In speaking, the passive is also useful for describing processes (<i>First, the data is collected…<\/i>) and news (<i>A new policy has been introduced<\/i>)."},{"t":"box","k":"rule","h":"PASSIVE = be (in the right tense) + V3<br>The tense lives in \"be\": is made / was made / has been made / will be made / is being made…"},{"t":"h2","h":"Passive in Every Tense"},{"t":"tb","head":["Tense","Active","Passive"],"rows":[["Present simple","They clean the lab every day.","The lab <b>is cleaned<\/b> every day."],["Present continuous","They are cleaning the lab.","The lab <b>is being cleaned<\/b>."],["Present perfect","They have cleaned the lab.","The lab <b>has been cleaned<\/b>."],["Past simple","They cleaned the lab.","The lab <b>was cleaned<\/b>."],["Past continuous","They were cleaning the lab.","The lab <b>was being cleaned<\/b>."],["Past perfect","They had cleaned the lab.","The lab <b>had been cleaned<\/b>."],["Future simple","They will clean the lab.","The lab <b>will be cleaned<\/b>."],["be going to","They are going to clean the lab.","The lab <b>is going to be cleaned<\/b>."],["Future perfect","They will have cleaned the lab.","The lab <b>will have been cleaned<\/b>."],["Modal","They must clean the lab.","The lab <b>must be cleaned<\/b>."],["Modal perfect","They should have cleaned the lab.","The lab <b>should have been cleaned<\/b>."]]},{"t":"box","k":"note","h":"Perfect continuous tenses (has been being cleaned) are very rare in passive — avoid them."},{"t":"h2","h":"Translation Drill: Passive in All Tenses"},{"t":"tr","rows":[{"n":992,"bn":"এই বিশ্ববিদ্যালয়টা ১৮৩১ সালে প্রতিষ্ঠিত হয়েছিল।","en":"This university was founded in 1831.","note":"","say":"This university was founded in 1831."},{"n":993,"bn":"  go<\/b> / suggested <b>going<\/b>.",""],["I enjoy to cook.","I enjoy <b>cooking<\/b>.",""],["I want that you come.","I want <b>you to come<\/b>.",""],["He avoided to answer.","He avoided <b>answering<\/b>.",""],["I am interested to learn.","I'm interested <b>in learning<\/b>.","(interested to know/hear is also OK)"],["I'm used to work late.","I'm used to <b>working<\/b> late.",""],["It's worth to see.","It's worth <b>seeing<\/b>.",""],["Let me to explain.","Let me <b>explain<\/b>.","let + V1"],["He made me to wait.","He made me <b>wait<\/b>.","make + V1"],["Thanks for to help.","Thanks for <b>helping<\/b>.",""],["I prefer to stay home than going out.","I prefer <b>staying<\/b> home <b>to going<\/b> out. / I'd rather stay home than go out.",""]],"say":["I came here to study.","I'm looking forward to meeting you.","She suggested that I go. suggested going.","I enjoy cooking.","I want you to come.","He avoided answering.","I'm interested in learning.","I'm used to working late.","It's worth seeing.","Let me explain.","He made me wait.","Thanks for helping.","I prefer staying home to going out.. I'd rather stay home than go out."]}]},{"id":21,"title":"Prepositions","blocks":[{"t":"p","h":"Bengali uses case endings and postpositions (-এ, -তে, -র, থেকে, দিয়ে, সাথে) where English uses prepositions <i>before<\/i> the noun. One Bengali ending (-এ) can become <b>in, at, on, to, by<\/b>. So you must learn prepositions as <b>chunks<\/b>, not rules."},{"t":"h2","h":"Time: at / on / in"},{"t":"box","k":"rule","h":"<b>AT<\/b> + exact time and short points: at 5 p.m., at noon, at night, at the weekend (UK), at the moment, at the end of<br><b>ON<\/b> + days and dates: on Monday, on 5 May, on my birthday, on the weekend (US), on Christmas Day<br><b>IN<\/b> + longer periods: in May, in 2026, in summer, in the morning/afternoon/evening, in the 1990s, in two weeks (= after two weeks)"},{"t":"tr","rows":[{"n":1171,"bn":"ক্লাস সকাল নয়টায়।","en":"Class is at nine a.m.","note":"","say":"Class is at nine a.m."},{"n":1172,"bn":"আমি রাতে কাজ করি।","en":"I work at night.","note":"but \"in the morning / in the evening\"","say":"I work at night."},{"n":1173,"bn":"আমি সকালে দৌড়াই।","en":"I run in the morning.","note":"","say":"I run in the morning."},{"n":1174,"bn":"আমার জন্ম ১৯৯৬ সালে।","en":"I was born in 1996.","note":"","say":"I was born in 1996."},{"n":1175,"bn":"আমার জন্ম মার্চ মাসে।","en":"I was born in March.","note":"","say":"I was born in March."},{"n":1176,"bn":"আমার জন্ম ১৫ মার্চ।","en":"I was born on March 15th. / I was born on the 15th of March.","note":"","say":"I was born on March 15th.. I was born on the 15th of March."},{"n":1177,"bn":"শুক্রবার মিটিং আছে।","en":"There's a meeting on Friday.","note":"","say":"There's a meeting on Friday."},{"n":1178,"bn":"শুক্রবার সকালে মিটিং আছে।","en":"There's a meeting on Friday morning.","note":"specific day + part → on","say":"There's a meeting on Friday morning."},{"n":1179,"bn":"আমি সপ্তাহান্তে বিশ্রাম নিই।","en":"I relax on the weekend. (US) / at the weekend. (UK)","note":"","say":"I relax on the weekend.. at the weekend."},{"n":1180,"bn":"শীতকালে এখানে বরফ পড়ে।","en":"It snows here in winter.","note":"","say":"It snows here in winter."},{"n":1181,"bn":"দুই সপ্তাহের মধ্যে ফলাফল আসবে।","en":"The results will come out in two weeks.","note":"","say":"The results will come out in two weeks."},{"n":1182,"bn":"এই মুহূর্তে আমি ব্যস্ত।","en":"I'm busy at the moment.","note":"","say":"I'm busy at the moment."},{"n":1183,"bn":"সেমিস্টারের শেষে পরীক্ষা।","en":"The exam is at the end of the semester.","note":"","say":"The exam is at the end of the semester."},{"n":1184,"bn":"শেষ পর্যন্ত আমরা জিতলাম।","en":"In the end, we won.","note":"in the end = finally; at the end of = at the final part of","say":"In the end, we won."},{"n":1185,"bn":"ট্রেন একদম সময়মতো এসেছে।","en":"The train arrived on time.","note":"on time = punctual","say":"The train arrived on time."},{"n":1186,"bn":"আমরা ক্লাসের আগে সময়মতো পৌঁছে গেলাম।","en":"We arrived in time for the class.","note":"in time = early enough","say":"We arrived in time for the class."},{"n":1187,"bn":"আমি তিন দিনের জন্য বাইরে যাচ্ছি।","en":"I'm going away for three days.","note":"","say":"I'm going away for three days."},{"n":1188,"bn":"আমি সোমবার থেকে অসুস্থ।","en":"I've been sick since Monday.","note":"","say":"I've been sick since Monday."},{"n":1189,"bn":"আমি সকাল ৯টা থেকে বিকেল ৫টা পর্যন্ত কাজ করি।","en":"I work from 9 a.m. to 5 p.m. / from 9 till 5.","note":"","say":"I work from 9 a.m. to 5 p.m.. from 9 till 5."},{"n":1190,"bn":"শুক্রবারের মধ্যে রিপোর্টটা জমা দাও।","en":"Submit the report by Friday.","note":"by = not later than","say":"Submit the report by Friday."},{"n":1191,"bn":"আমি শুক্রবার পর্যন্ত এখানে থাকব।","en":"I'll be here until Friday.","note":"until = continuously up to","say":"I'll be here until Friday."},{"n":1192,"bn":"ছুটির সময় আমি দেশে যাব।","en":"I'll go home during the break.","note":"","say":"I'll go home during the break."},{"n":1193,"bn":"তিন বছরের মধ্যে অনেক কিছু বদলে গেছে।","en":"A lot has changed within three years. / over the past three years.","note":"","say":"A lot has changed within three years.. over the past three years."},{"n":1194,"bn":"খাওয়ার আগে হাত ধোও।","en":"Wash your hands before eating.","note":"","say":"Wash your hands before eating."},{"n":1195,"bn":"ক্লাসের পর আমার সাথে দেখা কোরো।","en":"See me after class.","note":"","say":"See me after class."}]},{"t":"box","k":"warn","h":"No preposition with <b>this, next, last, every, today, tomorrow, yesterday<\/b>: <s>on next Monday<\/s> → next Monday; <s>in this week<\/s> → this week; <s>at tomorrow<\/s> → tomorrow."},{"t":"h2","h":"Place: at / on / in"},{"t":"box","k":"rule","h":"<b>AT<\/b> = a point: at the bus stop, at the door, at home, at work, at university, at the airport, at the conference<br><b>ON<\/b> = a surface or line: on the table, on the wall, on the floor, on the second floor, on the screen, on the road, on the left<b ":"tr","rows":[{"n":1578,"bn":"আমি জানি না।","en":"I don't know.","note":"","say":"I don't know."},{"n":1579,"bn":"আমি নিশ্চিত না।","en":"I'm not sure.","note":"","say":"I'm not sure."},{"n":1580,"bn":"আমি এটা আশা করিনি।","en":"I didn't expect that.","note":"","say":"I didn't expect that."},{"n":1581,"bn":"আমার কোনো সমস্যা নেই।","en":"I don't have any problems. / I have no problems.","note":"","say":"I don't have any problems.. I have no problems."},{"n":1582,"bn":"কেউ আসেনি।","en":"Nobody came.","note":"NOT \"Nobody didn't come\" (no double negative)","say":"Nobody came."},{"n":1583,"bn":"আমি কিছুই দেখিনি।","en":"I didn't see anything. / I saw nothing.","note":"","say":"I didn't see anything.. I saw nothing."},{"n":1584,"bn":"আমি আর কখনো ওখানে যাব না।","en":"I'll never go there again.","note":"","say":"I'll never go there again."},{"n":1585,"bn":"আমি আর ধূমপান করি না।","en":"I don't smoke anymore.","note":"","say":"I don't smoke anymore."},{"n":1586,"bn":"সে মোটেও খুশি না।","en":"She isn't happy at all.","note":"","say":"She isn't happy at all."},{"n":1587,"bn":"আমার মনে হয় না সে আসবে।","en":"I don't think he'll come.","note":"NOT \"I think he will not come\"","say":"I don't think he'll come."},{"n":1588,"bn":"আমার বিশ্বাস হয় না।","en":"I can't believe it.","note":"","say":"I can't believe it."},{"n":1589,"bn":"আমি না জেনে এটা করেছি।","en":"I did it without knowing.","note":"","say":"I did it without knowing."},{"n":1590,"bn":"এখনও না।","en":"Not yet.","note":"","say":"Not yet."},{"n":1591,"bn":"আমিও না।","en":"Me neither. / Neither do I. / Nor do I.","note":"","say":"Me neither.. Neither do I.. Nor do I."},{"n":1592,"bn":"আমিও।","en":"Me too. / So do I. / So am I.","note":"","say":"Me too.. So do I.. So am I."},{"n":1593,"bn":"সে আসছে না, আমিও না।","en":"She isn't coming, and neither am I.","note":"","say":"She isn't coming, and neither am I."}]},{"t":"h2","h":"Imperatives and Suggestions"},{"t":"tr","rows":[{"n":1594,"bn":"দরজাটা বন্ধ করো।","en":"Close the door n":"সে কত লম্বা!","en":"He's so tall!","note":"","say":"He's so tall!"},{"n":1614,"bn":"তুমি কত বড় হয়ে গেছ!","en":"You've grown so much!","note":"","say":"You've grown so much!"},{"n":1615,"bn":"কী বাজে আবহাওয়া!","en":"What terrible weather!","note":"","say":"What terrible weather!"},{"n":1616,"bn":"কী মজার!","en":"How funny! / That's hilarious!","note":"","say":"How funny!. That's hilarious!"}]}]},{"id":24,"title":"Conditionals and Wishes","blocks":[{"t":"p","h":"Conditionals show logical thinking — they are a strong Band 7 feature. Examiners notice \"If I had…, I would have…\" immediately."},{"t":"h2","h":"The Five Conditionals"},{"t":"tb","head":["Type","Use","If-clause","Main clause","Example"],"rows":[["Zero","facts, always true","present","present","If you heat ice, it melts."],["First","real future possibility","present","will + V1","If it rains, I'll stay home."],["Second","unreal / imaginary present or future","past","would + V1","If I had more time, I'd learn French."],["Third","unreal past (regret)","had + V3","would have + V3","If I had studied, I would have passed."],["Mixed","past condition → present result","had + V3","would + V1","If I had taken that job, I'd be in Canada now."]]},{"t":"h2","h":"Zero Conditional"},{"t":"tr","rows":[{"n":1617,"bn":"পানি গরম করলে ফোটে।","en":"If you heat water, it boils.","note":"","say":"If you heat water, it boils."},{"n":1618,"bn":"আমি বেশি কফি খেলে ঘুমাতে পারি না।","en":"If I drink too much coffee, I can't sleep.","note":"","say":"If I drink too much coffee, I can't sleep."},{"n":1619,"bn":"বৃষ্টি হলে রাস্তা পিচ্ছিল হয়ে যায়।","en":"When it rains, the roads get slippery.","note":"","say":"When it rains, the roads get slippery."},{"n":1620,"bn":"আমি নার্ভাস হলে দ্রুত কথা বলি।","en":"When I'm nervous, I speak too fast.","note":"","say":"When I'm nervous, I speak too fast."},{"n":1621,"bn":"তুমি অনুশীলন না করলে ভুলে যাও।","en":"If you don't practise, you forget.","note":"","say":"If you don't practise, you forget."},{"n":1622,"bn":"ডেটা খারাপ হলে মডেলও খারাপ হয়।","en":"If the data is bad, the model is bad too.","note":"\"garbage in, garbage out\"","say":"If the data is bad, the model is bad too."}]},{"t":"h2","h":"First Conditional"},{"t":"tr","rows":[{"n":1623,"bn":"বৃষ্টি হলে আমি বাসায় থাকব।","en":"If it rains, I'll stay home.","note":"","say":"If it rains, I'll stay home."},{"n":1624,"bn":"তুমি তাড়াতাড়ি না করলে ট্রেন মিস করবে।","en":"If you don't hurry, you'll miss the train.","note":"","say":"If you don't hurry, you'll miss the train."},{"n":1625,"bn":"আমার পেপার অ্যাকসেপ্ট হলে আমি জাপানে যাব।","en":"If my paper gets accepted, I'll go to Japan.","note":"","say":"If my paper gets accepted, I'll go to Japan."},{"n":1626,"bn":"সময় পেলে আমি তোমাকে ফোন করব।","en":"If I have time, I'll call you.","note":"","say":"If I have time, I'll call you."},{"n":1627,"bn":"তুমি পড়াশোনা করলে পাস করবে।","en":"If you study, you'll pass.","note":"","say":"If you study, you'll pass."},{"n":1628,"bn":"তুমি না আসলে আমি খুব মন খারাপ করব।","en":"If you don't come, I'll be really upset.","note":"","say":"If you don't come, I'll be really upset."},{"n":1629,"bn":"কোনো প্রশ্ন থাকলে আমাকে ইমেইল কোরো।","en":"If you have any questions, email me.","note":"imperative in main clause","say":"If you have any questions, email me."},{"n":1630,"bn":"তুমি চাইলে আমি তোমাকে নামিয়ে দিতে পারি।","en":"If you want, I can drop you off.","note":"","say":"If you want, I can drop you off."},{"n":1631,"bn":"আমার প্রফেসর রাজি হলে আমি ইন্টার্নশিপ করব।","en":"If my professor agrees, I'll do an internship.","note":"","say":"If my professor agrees, I'll do an internship."},{"n":1632,"bn":"তুমি না বললে আমি জানব কিভাবে?","en":"How will I know if you don't tell me?","note":"","say":"How will I know if you don't tell me?"},{"n":1633,"bn":"যদি না তুমি অনুশীলন করো, তুমি উন্নতি করবে না।","en":"Unless you practise, you won't improve.","note":"unless = if not","say":"Unless you practise, you won't improve."},{"n":1634,"bn":"যতক্ষণ তুমি সৎ থাকবে, আমি তোমাকে সাহায্য করব।","en":"As long as you're honest, I'll help you.","note":"","say":"As long as you're honest, I'll help you."},{"n":1635,"bn":"সে আসুক বা না আসুক, আমরা শুরু করব।","en":"Whether he comes or not, we'll start.","note":"","say":"Whether he comes or not, we'll start."},{"n":1636,"bn":"ছাতা নিয়ে যাও, যদি বৃষ্টি হয়।","en":"Take an umbrella in case it rains.","note":"in case = as a precaution","say":"Take an umbrella in case it rains."},{"n":1637,"bn":"আমি তোমাকে টাকা দিতে পারি, তবে শর্ত হলো তুমি ফেরত দেবে।","en":"I can lend you money, provided that you pay it back.","note":"","say":"I can lend you money, provided that you pay it back."}]},{"t":"h2","h":"Second Conditional"},{"t":"box","k":"note","h":"In the if-clause, use <b>were<\/b> for all persons in formal English: \"If I <b>were<\/b> you…\", \"If she <b>were<\/b> here…\". \"If I was\" is common in casual speech."},{"t":"tr","rows":[{"n":1638,"bn":"আমার কাছে বেশি টাকা থাকলে আমি একটা বাড়ি কিনতাম।","en":"If I had more money, I'd buy a house.","note":"","say":"If I had more money, I'd buy a house."},{"n":1639,"bn":"আমি তোমার জায়গায় থাকলে চাকরিটা নিতাম।","en":"If I were you, I'd take the job.","note":"","say":"If I were you, I'd take the job."},{"n":1640,"bn":"আমার সময় থাকলে আমি ফরাসি শিখতাম।","en":"If I had time, I'd learn French.","note":"","say":"If I had time, I'd learn French."},{"n":1641,"bn":"আমি যদি প্রেসিডেন্ট হতাম, শিক্ষাকে বিনামূল্যে করতাম।","en":"If I were the president, I'd make education free.","note":"","say":"If I were the president, I'd make education free."},{"n":1642,"bn":"আমি যদি উড়তে পারতাম, প্রতিদিন দেশে যেতাম।","en":"If I could fly, I'd visit home every day.","note":"","say":"If I could fly, I'd visit home every day."},{"n":1643,"bn":"সে যদি আরো মনোযোগী হতো, ভালো করত।","en":"If he were more focused, he'd do better.","note":"","say":"If he were more focused, he'd do better."},{"n":1644,"bn":"তুমি লটারি জিতলে কী করতে?","en":"What would you do if you won the lottery?","note":"","say":"What would you do if you won the lottery?"},{"n":1645,"bn":"যদি একদিনের জন্য অদৃশ্য হতে পারতে, কী করতে?","en":"What would you do if you could be invisible for a day?","note":"","say":"What would you do if you could be invisible for a day?"},{"n":1646,"bn":"আমার গাড়ি থাকলে তোমাকে এয়ারপোর্টে নিয়ে যেতাম।","en":"If I had a car, I'd take you to the airport.","note":"","say":"If I had a car, I'd take you to the airport."},{"n":1647,"bn":"আমি যদি বাংলাদেশে থাকতাম, এখন বাবা-মার সাথে থাকতাম।","en":"If I lived in Bangladesh, I'd be living with my parents now.","note":"","say":"If I lived in Bangladesh, I'd be living with my parents now."},{"n":1648,"bn":"এটা অনেক সহজ হতো যদি ডকুমেন্টেশন ভালো হতো।","en":"It would be much easier if the documentation were better.","note":"","say":"It would be much easier if the documentation were better."},{"n":1649,"bn":"তুমি কিছু মনে না করলে আমি একটা প্রশ্ন করতাম।","en":"If you don't mind, I'd like to ask a question.","note":"","say":"If you don't mind, I'd like to ask a question."},{"n":1650,"bn":"সে যদি আমাকে জিজ্ঞেস করত, আমি সাহায্য করতাম।","en":"If she asked me, I'd help her.","note":"","say":"If she asked me, I'd help her."},{"n":1651,"bn":"আমি যদি আরো সাবলীলভাবে ইংরেজি বলতে পারতাম, আরো আত্মবিশ্বাসী হতাম।","en":"If I could speak English more fluently, I'd feel more confident.","note":"","say":"If I could speak English more fluently, I'd feel more confident."},{"n":1652,"bn":"আমার যদি বাগান থাকত, আমি সবজি চাষ করতাম।","en":"If I had a garden, I'd grow vegetables.","note":"","say":"If I had a garden, I'd grow vegetables."}]},{"t":"h2","h":"Third Conditional"},{"t":"tr","rows":[{"n":1653,"bn":"আমি যদি পড়তাম, তাহলে পাস করতাম।","en":"If I had studied, I would have passed.","note":"","say":"If I had studied, I would have passed."},{"n":1654,"bn":"তুমি আগে বললে আমি সাহায্য করতাম।","en":"If you had told me earlier, I would have helped.","note":"","say":"If you had told me earlier, I would have helped."},{"n":1655,"bn":"আমরা আগে বের হলে ট্রেন মিস করতাম না।","en":"If we had left earlier, we wouldn't have missed the train.","note":"","say":"If we had left earlier, we wouldn't have missed the train."},{"n":1656,"bn":"আমি যদি জানতাম, আসতাম।","en":"If I had known, I would have come.","note":"","say":"If I had known, I would have come."},{"n":1657,"bn":"আমি যদি ওই চাকরিটা নিতাম, আমেরিকায় আসতাম না।","en":"If I had taken that job, I wouldn't have come to the US.","note":"","say":"If I had taken that job, I wouldn't have come to the US."},{"n":1658,"bn":"সে যদি সাবধান থাকত, দুর্ঘটনা হতো না।","en":"If he had been careful, the accident wouldn't have happened.","note":"","say":"If he had been careful, the accident wouldn't have happened."},{"n":1659,"bn":"রিভিউয়াররা যদি আরো সময় দিতেন, আমরা আরো এক্সপেরিমেন্ট করতে পারতাম।","en":"If the reviewers had given us more time, we could have run more experiments.","note":"","say":"If the reviewers had given us more time, we could have run more experiments."},{"n":1660,"bn":"আমি যদি অ্যালার্ম দিতাম, দেরি হতো না।","en":"If I had set an alarm, I wouldn't have been late.","note":"","say":"If I had set an alarm, I wouldn't have been late."},{"n":1661,"bn":"তোমার সাহায্য না থাকলে আমি পারতাম না।","en":"If it hadn't been for your help, I couldn't have done it. / Without your help, I couldn't have done it.","note":"","say":"If it hadn't been for your help, I couldn't have done it.. Without your help, I couldn't have done it."},{"n":1662,"bn":"আমি যদি আগে আবেদন করতাম, স্কলারশিপ পেতাম।","en":"If I had applied earlier, I might have got the scholarship.","note":"","say":"If I had applied earlier, I might have got the scholarship."},{"n":1663,"bn":"আমার স্ত্রী মনে না করিয়ে দিলে আমি ভুলে যেতাম।","en":"If my wife hadn't reminded me, I would have forgotten.","note":"","say":"If my wife hadn't reminded me, I would have forgotten."},{"n":1664,"bn":"সে আমাকে না থামালে আমি ভুল বাসে উঠতাম।","en":"If she hadn't stopped me, I would have got on the wrong bus.","note":"","say":"If she hadn't stopped me, I would have got on the wrong bus."}]},{"t":"h2","h":"Mixed Conditionals"},{"t":"tr","rows":[{"n":1665,"bn":"আমি যদি ওই সময় ইংরেজি ভালো করে শিখতাম, এখন সাবলীলভাবে বলতে পারতাম।","en":"If I had learned English properly back then, I'd be fluent now.","note":"","say":"If I had learned English properly back then, I'd be fluent now."},{"n":1666,"bn":"আমি যদি কাল রাতে না জাগতাম, এখন ক্লান্ত লাগত না।","en":"If I hadn't stayed up last night, I wouldn't be tired now.","note":"","say":"If I hadn't stayed up last night, I wouldn't be tired now."},{"n":1667,"bn":"সে যদি চাকরিটা নিত, এখন কানাডায় থাকত।","en":"If she had taken the job, she'd be living in Canada now.","note":"","say":"If she had taken the job, she'd be living in Canada now."},{"n":1668,"bn":"আমি যদি এত অলস না হতাম, অনেক আগেই শেষ করে ফেলতাম।","en":"If I weren't so lazy, I would have finished long ago.","note":"","say":"If I weren't so lazy, I would have finished long ago."},{"n":1669,"bn":"আমি যদি কম্পিউটার সায়েন্স না পড়তাম, এখন হয়তো ডাক্তার হতাম।","en":"If I hadn't studied computer science, I might be a doctor now.","note":"","say":"If I hadn't studied computer science, I might be a doctor now."}]},{"t":"h2","h":"Wish and If Only"},{"t":"tb","head":["Wish about","Structure","Example"],"rows":[["present (unreal now)","wish + past","I wish I <b>had<\/b> more time."],["past (regret)","wish + had + V3","I wish I <b>had studied<\/b> harder."],["someone's annoying behaviour / future change","wish + would","I wish you <b>would stop<\/b> interrupting."],["ability","wish + could","I wish I <b>could<\/b> speak French."]]},{"t":"tr","rows":[{"n":1670,"bn":"আমার যদি আরো সময় থাকত!","en":"I wish I had more time.","note":"","say":"I wish I had more time."},{"n":1671,"bn":"আমি যদি আরো লম্বা হতাম!","en":"I wish I were taller.","note":"","say":"I wish I were taller."},{"n":1672,"bn":"আমি যদি ভালো রান্না করতে পারতাম!","en":"I wish I could cook better.","note":"","say":"I wish I could cook better."},{"n":1673,"bn":"আমি যদি স্কুলে থাকতে আরো মনোযোগ দিতাম!","en":"I wish I had paid more attention at school.","note":"","say":"I wish I had paid more attention at school."},{"n":1674,"bn":"আমি যদি এটা না বলতাম!","en":"I wish I hadn't said that.","note":"","say":"I wish I hadn't said that."},{"n":1675,"bn":"যদি সে আমার কথা শুনত!","en":"If only she had listened to me!","note":"","say":"If only she had listened to me!"},{"n":1676,"bn":"আমার ইচ্ছে বৃষ্টি থামুক।","en":"I wish it would stop raining.","note":"","say":"I wish it would stop raining."},{"n":1677,"bn":"আমি চাই তুমি আমার কথার মাঝে কথা না বলো।","en":"I wish you wouldn't interrupt me.","note":"","say":"I wish you wouldn't interrupt me."},{"n":1678,"bn":"আমি চাই আমার বাবা-মা এখানে থাকুক।","en":"I wish my parents were here.","note":"","say":"I wish my parents were here."},{"n":1679,"bn":"যদি আমি সময়টা ফিরিয়ে আনতে পারতাম!","en":"If only I could turn back time!","note":"","say":"If only I could turn back time!"},{"n":1680,"bn":"আমার আফসোস, আমি তাকে কখনো ধন্যবাদ দিইনি।","en":"I wish I had thanked him. / I regret never thanking him.","note":"","say":"I wish I had thanked him.. I regret never thanking him."},{"n":1681,"bn":"এখন যদি দেশে থাকতাম!","en":"I wish I were back home now.","note":"","say":"I wish I were back home now."}]},{"t":"h2","h":"Other Unreal Structures"},{"t":"tr","rows":[{"n":1682,"bn":"এখন সময় হয়েছে আমাদের যাওয়ার।","en":"It's time we left. / It's time for us to leave.","note":"","say":"It's time we left.. It's time for us to leave."},{"n":1683,"bn":"আমি বরং বাসায় থাকব।","en":"I'd rather stay home.","note":"","say":"I'd rather stay home."},{"n":1684,"bn":"আমি চাই তুমি আজ না যাও।","en":"I'd rather you didn't go today.","note":"","say":"I'd rather you didn't go today."},{"n":1685,"bn":"সে এমনভাবে কথা বলে যেন সবকিছু জানে।","en":"He talks as if he knows everything. / …as if he knew everything.","note":"","say":"He talks as if he knows everything.. ...as if he knew everything."},{"n":1686,"bn":"ধরো তুমি লটারি জিতলে, কী করতে?","en":"Suppose you won the lottery — what would you do?","note":"","say":"Suppose you won the lottery — what would you do?"},{"n":1687,"bn":"কল্পনা করো আমরা চাঁদে থাকি।","en":"Imagine we lived on the moon.","note":"","say":"Imagine we lived on the moon."}]},{"t":"box","k":"try","h":"One minute: \"If you could change one thing about your PhD life, what would it be and why?\" Use second and third conditionals and at least one \"I wish\"."}]},{"id":25,"title":"Direct and Indirect Speech (Narration)","blocks":[{"t":"p","h":"You report what people said all the time: what your professor said in a meeting, what a student asked, what your wife told you. Accurate reported speech shows control of tenses."},{"t":"h2","h":"Tense Backshift"},{"t":"box","k":"rule","h":"When the reporting verb is past (said, told, asked), move tenses one step back:<br>am/is → was · are → were · do → did · did → had done · have done → had done · will → would · can → could · may → might · must → had to"},{"t":"tb","head":["Direct","Indirect"],"rows":[["\"I <b>am<\/b> tired.\"","She said (that) she <b>was<\/b> tired."],["\"I <b>work<\/b> at Google.\"","He said he <b>worked<\/b> at Google."],["\"I'<b>m working<\/b> on it.\"","He said he <b>was working<\/b> on it."],["\"I <b>finished<\/b> it.\"","She said she <b>had finished<\/b> it."],["\"I'<b>ve<\/b> never <b>been<\/b> to Paris.\"","He said he <b>had<\/b> never <b>been<\/b> to Paris."],["\"I'<b>ll<\/b> call you.\"","She said she <b>would<\/b> call me."],["\"I <b>can<\/b> help.\"","He said he <b>could<\/b> help."],["\"You <b>must<\/b> submit by Friday.\"","She said we <b>had to<\/b> submit by Friday."]]},{"t":"tb","head":["Time / place words","change to"],"rows":[["now","then"],["today","that day"],["tonight","that night"],["yesterday","the day before / the previous day"],["tomorrow","the next day / the following day"],["last week","the week before / the previous week"],["next week","the following week"],["ago","before"],["here","there"],["this","that"]]},{"t":"box","k":"note","h":"If the statement is <b>still true<\/b> or you report it immediately, you don't need to backshift: \"My advisor <b>said<\/b> the deadline <b>is<\/b> Friday.\" (It still is.)"},{"t":"h2","h":"Statements"},{"t":"tr","rows":[{"n":1688,"bn":"সে বলল, \"আমি ক্লান্ত।\" → সে বলল যে সে ক্লান্ত।","en":"She said, \"I'm tired.\" → She said (that) she was tired.","note":"","say":"She said, \"I'm tired.\" → She said (that) she was tired."},{"n":1689,"bn":"প্রফেসর বললেন, \"তোমার কাজ ভালো হয়েছে।\"","en":"The professor said that my work was good.","note":"","say":"The professor said that my work was good."},{"n":1690,"bn":"সে আমাকে বলল যে সে আগামীকাল আসবে।","en":"He told me that he would come the next day.","note":"","say":"He told me that he would come the next day."},{"n":1691,"bn":"আমার স্ত্রী বলল সে রাতের খাবার বানিয়ে ফেলেছে।","en":"My wife said she had already made dinner.","note":"","say":"My wife said she had already made dinner."},{"n":1692,"bn":"ছাত্রটা বলল সে অসুস্থ ছিল।","en":"The student said he had been sick.","note":"","say":"The student said he had been sick."},{"n":1693,"bn":"সে বলল সে কখনো বিমানে চড়েনি।","en":"She said she had never been on a plane.","note":"","say":"She said she had never been on a plane."},{"n":1694,"bn":"তিনি বললেন আমরা পরের সপ্তাহে মিটিং করব।","en":"He said we would have a meeting the following week.","note":"","say":"He said we would have a meeting the following week."},{"n":1695,"bn":"সে বলল সে সাঁতার কাটতে পারে না।","en":"She said she couldn't swim.","note":"","say":"She said she couldn't swim."},{"n":1696,"bn":"আমার সুপারভাইজার বললেন আমাকে আরো এক্সপেরিমেন্ট করতে হবে।","en":"My supervisor said I had to run more experiments.","note":"","say":"My supervisor said I had to run more experiments."},{"n":1697,"bn":"সে বলল সে আমাকে ভালোবাসে।","en":"She said she loved me.","note":"","say":"She said she loved me."}]},{"t":"box","k":"warn","h":"<b>say vs tell<\/b>: <i>say (something) (to someone)<\/i> / <i>tell someone (something)<\/i>. ✅ He <b>said<\/b> that… ✅ He <b>told me<\/b> that… ❌ He said me… ❌ He told that…"},{"t":"h2","h":"Questions"},{"t":"box","k":"rule","h":"Reported questions use NORMAL word order (subject + verb), no question mark, no do/did.<br>Yes/No → asked <b>if/whether<\/b> · Wh- → asked + <b>wh-word<\/b>"},{"t":"tr","rows":[{"n":1698,"bn":"সে জিজ্ঞেস করল, \"তুমি কি ব্যস্ত?\" → সে জিজ্ঞেস করল আমি ব্যস্ত কিনা।","en":"She asked, \"Are you busy?\" → She asked if I was busy.","note":"","say":"She asked, \"Are you busy?\" → She asked if I was busy."},{"n":1699,"bn":"প্রফেসর জিজ্ঞেস করলেন আমি পেপারটা শেষ করেছি কিনা।","en":"The professor asked whether I had finished the paper.","note":"","say":"The professor asked whether I had finished the paper."},{"n":1700,"bn":"ছাত্রটা জিজ্ঞেস করল পরীক্ষা কবে হবে।","en":"The student asked when the exam would be.","note":"","say":"The student asked when the exam would be."},{"n":1701,"bn":"সে জানতে চাইল আমি কোথায় থাকি।","en":"She wanted to know where I lived.","note":"NOT \"where did I live\"","say":"She wanted to know where I lived."},{"n":1702,"bn":"ভিসা অফিসার জিজ্ঞেস করলেন আমি কেন আমেরিকায় যেতে চাই।","en":"The visa officer asked why I wanted to go to the US.","note":"","say":"The visa officer asked why I wanted to go to the US."},{"n":1703,"bn":"সে আমাকে জিজ্ঞেস করল আমি কতদিন ধরে এখানে আছি।","en":"He asked me how long I had been there.","note":"","say":"He asked me how long I had been there."},{"n":1704,"bn":"আমার মা জিজ্ঞেস করলেন আমি ঠিকমতো খাচ্ছি কিনা।","en":"My mother asked if I was eating properly.","note":"","say":"My mother asked if I was eating properly."},{"n":1705,"bn":"সে জিজ্ঞেস করল আমি তাকে সাহায্য করতে পারব কিনা।","en":"She asked if I could help her.","note":"","say":"She asked if I could help her."}]},{"t":"h2","h":"Commands, Requests, and Advice"},{"t":"box","k":"rule","h":"told / asked / advised / warned / reminded + person + (not) to + V1"},{"t":"tr","rows":[{"n":1706,"bn":"তিনি বললেন, \"দরজা বন্ধ করো।\" → তিনি আমাকে দরজা বন্ধ করতে বললেন।","en":"He said, \"Close the door.\" → He told me to close the door.","note":"","say":"He said, \"Close the door.\" → He told me to close the door."},{"n":1707,"bn":"প্রফেসর আমাদের দেরি না করতে বললেন।","en":"The professor told us not to be late.","note":"","say":"The professor told us not to be late."},{"n":1708,"bn":"সে আমাকে তাকে ফোন করতে অনুরোধ করল।","en":"She asked me to call her.","note":"","say":"She asked me to call her."},{"n":1709,"bn":"ডাক্তার আমাকে বেশি পানি খেতে পরামর্শ দিলেন।","en":"The doctor advised me to drink more water.","note":"","say":"The doctor advised me to drink more water."},{"n":1710,"bn":"আমার স্ত্রী আমাকে দুধ আনতে মনে করিয়ে দিল।","en":"My wife reminded me to bring milk.","note":"","say":"My wife reminded me to bring milk."},{"n":1711,"bn":"তিনি আমাদের সতর্ক করলেন যেন আমরা নকল না করি।","en":"He warned us not to cheat.","note":"","say":"He warned us not to cheat."}]},{"t":"h2","h":"Reporting Verbs (more advanced than \"said\")"},{"t":"tb","head":["Verb","Pattern","Example"],"rows":[["explain","explain that…","She explained that the server was down."],["mention","mention that…","He mentioned that he was moving."],["admit","admit (to) + -ing / that","He admitted making a mistake."],["deny","deny + -ing / that","She denied taking the money."],["agree","agree to + V1 / that","He agreed to help."],["refuse","refuse to + V1","She refused to answer."],["promise","promise to + V1 / that","He promised to send it."],["offer","offer to + V1","She offered to drive me."],["suggest","suggest + -ing / that someone (should) do","He suggested meeting on Monday."],["recommend","recommend + -ing / that","She recommended reading the paper first."],["complain","complain that / about","They complained about the noise."],["apologise","apologise for + -ing","He apologised for being late."],["insist","insist on + -ing / that","She insisted on paying."],["encourage","encourage someone to","My advisor encouraged me to submit."],["claim","claim that / to","He claimed to be an expert."],["point out","point out that","She pointed out that the data was incomplete."]]},{"t":"tr","rows":[{"n":1712,"bn":"সে স্বীকার করল যে সে ভুল করেছে।","en":"He admitted that he had made a mistake. / He admitted making a mistake.","note":"","say":"He admitted that he had made a mistake.. He admitted making a mistake."},{"n":1713,"bn":"সে টাকা নেওয়ার কথা অস্বীকার করল।","en":"She denied taking the money.","note":"","say":"She denied taking the money."},{"n":1714,"bn":"সে আমাকে সাহায্য করতে রাজি হলো।","en":"He agreed to help me.","note":"","say":"He agreed to help me."},{"n":1715,"bn":"সে উত্তর দিতে অস্বীকার করল।","en":"She refused to answer.","note":"","say":"She refused to answer."},{"n":1716,"bn":"সে আমাকে স্টেশনে নিয়ে যাওয়ার প্রস্তাব দিল।","en":"She offered to drive me to the station.","note":"","say":"She offered to drive me to the station."},{"n":1717,"bn":"সে সোমবার দেখা করার প্রস্তাব দিল।","en":"He suggested meeting on Monday.","note":"","say":"He suggested meeting on Monday."},{"n":1718,"bn":"তিনি দেরি করার জন্য ক্ষমা চাইলেন।","en":"He apologised for being late.","note":"","say":"He apologised for being late."},{"n":1719,"bn":"আমার সুপারভাইজার আমাকে পেপারটা জমা দিতে উৎসাহ দিলেন।","en":"My supervisor encouraged me to submit the paper.","note":"","say":"My supervisor encouraged me to submit the paper."},{"n":1720,"bn":"তিনি দেখালেন যে ডেটায় কিছু ঘাটতি আছে।","en":"She pointed out that the data was incomplete.","note":"","say":"She pointed out that the data was incomplete."},{"n":1721,"bn":"সে দাবি করল যে সে একজন বিশেষজ্ঞ।","en":"He claimed to be an expert.","note":"","say":"He claimed to be an expert."}]},{"t":"box","k":"try","h":"Tell a friend (in one minute) what happened in your last meeting with your supervisor. Use: <i>She said…, She asked me whether…, She suggested…, She pointed out that…, She told me to…<\/i>"}]},{"id":26,"title":"Relative Clauses, Comparisons, and Inversion","blocks":[{"t":"h2","h":"Relative Clauses (who, which, that, whose, where, when)"},{"t":"tb","head":["Pronoun","For","Example"],"rows":[["who","people","The student <b>who<\/b> asked the question is smart."],["which","things (and whole ideas)","The laptop <b>which<\/b> I bought is fast. He passed, <b>which<\/b> surprised everyone."],["that","people or things (defining only)","The paper <b>that<\/b> I submitted got accepted."],["whose","possession","The professor <b>whose<\/b> class I'm TA-ing is very kind."],["where","place","This is the café <b>where<\/b> we first met."],["when","time","I remember the day <b>when<\/b> I arrived."],["why","reason","That's the reason <b>why<\/b> I came."],["what","\"the thing that\"","<b>What<\/b> I need is more time."]]},{"t":"box","k":"rule","h":"Defining clause (needed to identify) → no commas, \"that\" is OK.<br>Non-defining clause (extra information) → commas, NO \"that\": \"My supervisor, <b>who<\/b> has years of experience, is very supportive.\""},{"t":"tr","rows":[{"n":1722,"bn":"যে ছাত্রটা প্রশ্ন করেছিল সে খুব বুদ্ধিমান।","en":"The student who asked the question is very smart.","note":"","say":"The student who asked the question is very smart."},{"n":1723,"bn":"আমি যে ল্যাপটপটা কিনেছি সেটা খুব দ্রুত।","en":"The laptop I bought is very fast. / The laptop that I bought…","note":"","say":"The laptop I bought is very fast.. The laptop that I bought..."},{"n":1724,"bn":"আমি যে পেপারটা জমা দিয়েছিলাম সেটা অ্যাকসেপ্ট হয়েছে।","en":"The paper that I submitted has been accepted.","note":"","say":"The paper that I submitted has been accepted."},{"n":1725,"bn":"এটা সেই ক্যাফে যেখানে আমাদের প্রথম দেখা হয়েছিল।","en":"This is the café where we first met.","note":"","say":"This is the café where we first met."},{"n":1726,"bn":"আমার মনে আছে যেদিন আমি প্রথম এখানে আসি।","en":"I remember the day when I first arrived here.","note":"","say":"I remember the day when I first arrived here."},{"n":1727,"bn":"এই কারণেই আমি এখানে এসেছি।","en":"That's the reason why I came here. / That's why I came here.","note":"","say":"That's the reason why I came here.. That's why I came here."},{"n":1728,"bn":"আমার দরকার আরো সময়।","en":"What I need is more time.","note":"","say":"What I need is more time."},{"n":1729,"bn":"তুমি যা বলেছ তা আমি বুঝেছি।","en":"I understand what you said.","note":"","say":"I understand what you said."},{"n":1730,"bn":"আমার সুপারভাইজার, যিনি খুব অভিজ্ঞ, অনেক সহায়ক।","en":"My supervisor, who is very experienced, is really supportive.","note":"","say":"My supervisor, who is very experienced, is really supportive."},{"n":1731,"bn":"আমার স্ত্রী, যে একজন শিক্ষক, খুব ধৈর্যশীল।","en":"My wife, who is a teacher, is very patient.","note":"","say":"My wife, who is a teacher, is very patient."},{"n":1732,"bn":"যে প্রফেসরের ক্লাসে আমি টিএ, তিনি খুব ভালো মানুষ।","en":"The professor whose class I'm a TA for is very kind.","note":"","say":"The professor whose class I'm a TA for is very kind."},{"n":1733,"bn":"যে মেয়েটার বাবা ডাক্তার, সে আমার ক্লাসে পড়ে।","en":"The girl whose father is a doctor is in my class.","note":"","say":"The girl whose father is a doctor is in my class."},{"n":1734,"bn":"সে পরীক্ষায় পাস করেছে, যেটা সবাইকে অবাক করেছে।","en":"He passed the exam, which surprised everyone.","note":"","say":"He passed the exam, which surprised everyone."},{"n":1735,"bn":"আমি যাদের সাথে কাজ করি তারা সবাই খুব সাহায্যকারী।","en":"The people I work with are all very helpful.","note":"","say":"The people I work with are all very helpful."},{"n":1736,"bn":"আমার এমন একজন বন্ধু আছে যে পাঁচটা ভাষা জানে।","en":"I have a friend who speaks five languages.","note":"","say":"I have a friend who speaks five languages."},{"n":1737,"bn":"এটাই সেই বই যেটার কথা বলছিলাম।","en":"This is the book I was talking about.","note":"","say":"This is the book I was talking about."},{"n":1738,"bn":"আমি যে শহরে বড় হয়েছি সেটা খুব ছোট।","en":"The town where I grew up is very small. / The town I grew up in…","note":"","say":"The town where I grew up is very small.. The town I grew up in..."},{"n":1739,"bn":"এমন কেউ কি আছে যে আমাকে সাহায্য করতে পারবে?","en":"Is there anyone who can help me?","note":"","say":"Is there anyone who can help me?"},{"n":1740,"bn":"তুমিই একমাত্র যে আমাকে বোঝো।","en":"You're the only one who understands me.","note":"","say":"You're the only one who understands me."},{"n":1741,"bn":"আমার যা কিছু আছে সব আমার বাবা-মার জন্য।","en":"Everything I have is because of my parents.","note":"","say":"Everything I have is because of my parents."}]},{"t":"h2","h":"Comparison Structures"},{"t":"tr","rows":[{"n":1742,"bn":"যত তাড়াতাড়ি সম্ভব","en":"as soon as possible","note":"","say":"as soon as possible"},{"n":1743,"bn":"সে আমার মতোই লম্বা।","en":"He's as tall as I am. / He's as tall as me.","note":"","say":"He's as tall as I am.. He's as tall as me."},{"n":1744,"bn":"এটা আগের মতো কঠিন না।","en":"It's not as hard as before.","note":"","say":"It's not as hard as before."},{"n":1745,"bn":"আমি যত বেশি পড়ি, তত বেশি বুঝি।","en":"The more I read, the more I understand.","note":"","say":"The more I read, the more I understand."},{"n":1746,"bn":"যত তাড়াতাড়ি, তত ভালো।","en":"The sooner, the better.","note":"","say":"The sooner, the better."},{"n":1747,"bn":"এটা আগের চেয়ে দ্বিগুণ দ্রুত।","en":"It's twice as fast as before.","note":"","say":"It's twice as fast as before."},{"n":1748,"bn":"এটা ওইটার চেয়ে তিনগুণ বড়।","en":"It's three times bigger than that one. / three times as big as…","note":"","say":"It's three times bigger than that one.. three times as big as..."},{"n":1749,"bn":"এটা একই রকম।","en":"It's the same as the previous one.","note":"","say":"It's the same as the previous one."},{"n":1750,"bn":"এটা অনেকটা ওইটার মতো।","en":"It's similar to that one.","note":"","say":"It's similar to that one."},{"n":1751,"bn":"এটা পুরোপুরি আলাদা।","en":"It's completely different from that one.","note":"","say":"It's completely different from that one."},{"n":1752,"bn":"আমি যতটা ভেবেছিলাম তার চেয়ে অনেক ভালো।","en":"It's much better than I expected.","note":"","say":"It's much better than I expected."},{"n":1753,"bn":"এটা মোটেও ততটা খারাপ না।","en":"It's not nearly as bad as I thought.","note":"","say":"It's not nearly as bad as I thought."},{"n":1754,"bn":"দিন দিন আমার ইংরেজি ভালো হচ্ছে।","en":"My English is getting better and better.","note":"","say":"My English is getting better and better."},{"n":1755,"bn":"শহরটা আরো বেশি জনবহুল হয়ে উঠছে।","en":"The city is becoming more and more crowded.","note":"","say":"The city is becoming more and more crowded."},{"n":1756,"bn":"তিনি আমার দেখা সবচেয়ে ধৈর্যশীল শিক্ষক।","en":"She's the most patient teacher I've ever had.","note":"","say":"She's the most patient teacher I've ever had."}]},{"t":"h2","h":"Inversion and Emphasis (advanced, Band 7–8)"},{"t":"p","h":"These structures make you sound polished in presentations and IELTS Part 3."},{"t":"tb","head":["Structure","Example"],"rows":[["Not only … but also","<b>Not only<\/b> does this method reduce cost, <b>but<\/b> it <b>also<\/b> improves accuracy."],["Never / Rarely / Seldom + auxiliary + subject","<b>Never have I seen<\/b> such a beautiful place."],["Hardly / No sooner … when / than","<b>No sooner had I arrived than<\/b> it started raining."],["Only after / Only when / Only then","<b>Only after<\/b> I moved abroad <b>did I realise<\/b> how much I missed home."],["Little did I know","<b>Little did I know<\/b> that this would change my life."],["Under no circumstances","<b>Under no circumstances should<\/b> you share your password."],["Cleft: It is/was … that","<b>It was<\/b> my supervisor <b>who<\/b> encouraged me."],["Cleft: What … is","<b>What I really enjoy is<\/b> teaching."],["The thing is / The point is","<b>The thing is,<\/b> I don't have enough time."]]},{"t":"tr","rows":[{"n":1757,"bn":"আমি এত সুন্দর জায়গা আর কখনো দেখিনি।","en":"Never have I seen such a beautiful place.","note":"","say":"Never have I seen such a beautiful place."},{"n":1758,"bn":"আমি পৌঁছাতে
