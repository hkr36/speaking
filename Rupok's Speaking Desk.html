s a bit of rest.","note":"","say":"What I need is a bit of rest."},{"n":1769,"bn":"আমি যেখানে সমস্যায় পড়ি সেটা হলো উচ্চারণ।","en":"Where I struggle is pronunciation.","note":"","say":"Where I struggle is pronunciation."}]},{"t":"box","k":"try","h":"In IELTS Part 3, start one answer with \"<b>What I find interesting is…<\/b>\" and another with \"<b>Not only… but also…<\/b>\". Record and check your word order."}]},{"id":27,"title":"Connectors and Linking Words (Your Weak Point)","blocks":[{"t":"p","h":"Connectors are the <b>glue<\/b> of fluent speech. They tell the listener how your ideas relate: adding, contrasting, giving a reason, a result, an example, a sequence. They also give your brain a moment to think. At Band 6, speakers repeat <i>and, but, so, because<\/i>. At Band 7, speakers use a <b>range<\/b> of connectors <b>naturally<\/b> — and, very importantly, they use them to <b>stay on one line of thought<\/b> instead of jumping."},{"t":"box","k":"key","h":"A connector is a promise. If you say \"<b>For example<\/b>\", the next sentence must be an example of what you just said. If you say \"<b>On the other hand<\/b>\", the next sentence must contrast with it. Using connectors honestly is the cure for jumping between ideas."},{"t":"h2","h":"The Connector Map"},{"t":"tb","head":["Function","Spoken (natural)","More formal / academic"],"rows":[["Adding","and, also, too, as well, plus, on top of that, what's more, not only… but also","in addition, furthermore, moreover, additionally"],["Contrast","but, though, although, even though, while, whereas, still, however","nevertheless, nonetheless, on the contrary, in contrast, conversely"],["Concession","I know… but, admittedly, it's true that… but, even so","despite, in spite of, notwithstanding, granted"],["Reason","because, since, as, because of, that's why, the reason is","due to, owing to, on account of, given that"],["Result","so, so that's why, which means, that's why, as a result","therefore, consequently, thus, hence, accordingly"],["Purpose","to, so that, so as to, in order to","with the aim of, for the purpose of"],["Example","for example, for instance, like, such as, say, take… for example","to illustrate, namely, in particular, particularly"],["Clarifying","I mean, in other words, what I mean is, basically, to put it simply","that is (to say), i.e., to clarify"],["Emphasis","actually, in fact, really, especially, above all, the main thing is","indeed, notably, significantly, crucially"],["Sequence","first, then, next, after that, finally, in the end","firstly, secondly, subsequently, ultimately, lastly"],["Time","when, while, as soon as, before, after, until, since, meanwhile, by the time","prior to, following, simultaneously"],["Condition","if, unless, as long as, in case, otherwise, provided that","on condition that, assuming that"],["Comparison","similarly, in the same way, likewise, just like","correspondingly, equally"],["Generalising","generally, usually, in general, on the whole, most of the time","broadly speaking, by and large, as a rule"],["Summarising","so basically, all in all, overall, to sum up, in short","in conclusion, to summarise, in brief"],["Returning to topic","anyway, as I was saying, getting back to…","to return to the main point"],["Giving opinion","I think, I feel, in my view, personally, to be honest","in my opinion, from my perspective, it seems to me that"]]},{"t":"h2","h":"Adding Ideas"},{"t":"tr","rows":[{"n":1770,"bn":"আমি পড়াই, আর গবেষণাও করি।","en":"I teach, and I also do research.","note":"","say":"I teach, and I also do research."},{"n":1771,"bn":"এই শহরটা নিরাপদ, তাছাড়া খুব সস্তাও।","en":"This city is safe, and on top of that, it's quite cheap.","note":"","say":"This city is safe, and on top of that, it's quite cheap."},{"n":1772,"bn":"সে বুদ্ধিমান, আর তার চেয়েও বড় কথা, সে পরিশ্রমী।","en":"She's smart, and what's more, she's hard-working.","note":"","say":"She's smart, and what's more, she's hard-working."},{"n":1773,"bn":"আমি শুধু পড়াই না, ছাত্রদের প্রজেক্টও দেখি।","en":"I don't only teach; I also supervise student projects. / Not only do I teach, but I also supervise projects.","note":"","say":"I don't only teach; I also supervise student projects.. Not only do I teach, but I also supervise projects."},{"n":1774,"bn":"এই অ্যাপটা ফ্রি, আবার ব্যবহার করাও সহজ।","en":"This app is free, plus it's easy to use.","note":"","say":"This app is free, plus it's easy to use."},{"n":1775,"bn":"আমিও তোমার সাথে যাব।","en":"I'll come with you as well. / I'll come with you too.","note":"","say":"I'll come with you as well.. I'll come with you too."},{"n":1776,"bn":"এছাড়াও, আমাদের আরো ডেটা দরকার।","en":"In addition, we need more data.","note":"","say":"In addition, we need more data."},{"n":1777,"bn":"তাছাড়া, এটা পরিবেশের জন্যও ভালো।","en":"Besides, it's good for the environment too.","note":"","say":"Besides, it's good for the environment too."},{"n":1778,"bn":"খাবারটা খুব ঝাল ছিল, তার উপর ঠান্ডাও হয়ে গিয়েছিল।","en":"The food was very spicy, and on top of that, it had gone cold.","note":"","say":"The food was very spicy, and on top of that, it had gone cold."},{"n":1779,"bn":"এই পদ্ধতি দ্রুত, আর আরো নির্ভুলও।","en":"This method is faster, and moreover, it's more accurate.","note":"","say":"This method is faster, and moreover, it's more accurate."}]},{"t":"h2","h":"Contrast and Concession"},{"t":"box","k":"warn","h":"<b>although / though / even though<\/b> + clause (subject + verb). <b>despite / in spite of<\/b> + noun or -ing. <b>however<\/b> starts a new sentence (followed by a comma). Don't say \"Although… <b>but<\/b>…\" — use only one: <s>Although it was raining, but we went.<\/s> → Although it was raining, we went."},{"t":"tr","rows":[{"n":1780,"bn":"বৃষ্টি হচ্ছিল, তবুও আমরা বের হলাম।","en":"It was raining, but we still went out.","note":"","say":"It was raining, but we still went out."},{"n":1781,"bn":"যদিও বৃষ্টি হচ্ছিল, আমরা বের হলাম।","en":"Although it was raining, we went out.","note":"NOT \"Although…, but…\"","say":"Although it was raining, we went out."},{"n":1782,"bn":"বৃষ্টি সত্ত্বেও আমরা বের হলাম।","en":"Despite the rain, we went out.","note":"","say":"Despite the rain, we went out."},{"n":1783,"bn":"ক্লান্ত থাকা সত্ত্বেও সে কাজ চালিয়ে গেল।","en":"Despite being tired, she kept working. / In spite of being tired…","note":"","say":"Despite being tired, she kept working.. In spite of being tired..."},{"n":1784,"bn":"আমি তাকে পছন্দ করি, তবে সে মাঝে মাঝে বিরক্তিকর।","en":"I like him, though he can be annoying sometimes.","note":"","say":"I like him, though he can be annoying sometimes."},{"n":1785,"bn":"আমার ভাই খুব শান্ত, অথচ আমি খুব কথা বলি।","en":"My brother is very quiet, whereas I talk a lot.","note":"","say":"My brother is very quiet, whereas I talk a lot."},{"n":1786,"bn":"কেউ কেউ শহর পছন্দ করে, আবার কেউ কেউ গ্রাম।","en":"Some people prefer cities, while others prefer the countryside.","note":"","say":"Some people prefer cities, while others prefer the countryside."},{"n":1787,"bn":"পরিকল্পনাটা ভালো ছিল। তবে আমরা সময় পাইনি।","en":"The plan was good. However, we didn't have time.","note":"","say":"The plan was good. However, we didn't have time."},{"n":1788,"bn":"এটা ব্যয়বহুল, তবুও আমি এটা কিনব।","en":"It's expensive. Even so, I'm going to buy it.","note":"","say":"It's expensive. Even so, I'm going to buy it."},{"n":1789,"bn":"আমি জানি এটা কঠিন, কিন্তু অসম্ভব না।","en":"I know it's hard, but it's not impossible.","note":"","say":"I know it's hard, but it's not impossible."},{"n":1790,"bn":"এটা সত্যি যে টাকা গুরুত্বপূর্ণ, কিন্তু সব কিছু না।","en":"It's true that money is important, but it's not everything.","note":"","say":"It's true that money is important, but it's not everything."},{"n":1791,"bn":"স্বীকার করছি, আমি পুরোপুরি প্রস্তুত ছিলাম না।","en":"Admittedly, I wasn't fully prepared.","note":"","say":"Admittedly, I wasn't fully prepared."},{"n":1792,"bn":"সে ধনী, কিন্তু তবুও সুখী না।","en":"He's rich, but he still isn't happy.","note":"","say":"He's rich, but he still isn't happy."},{"n":1793,"bn":"উল্টো, এটা আসলে আরো ভালো।","en":"On the contrary, it's actually better.","note":"","say":"On the contrary, it's actually better."},{"n":1794,"bn":"একদিকে শহরে সুযোগ বেশি; অন্যদিকে খরচও বেশি।","en":"On the one hand, cities have more opportunities; on the other hand, they're more expensive.","note":"","say":"On the one hand, cities have more opportunities; on the other hand, they're more expensive."},{"n":1795,"bn":"অনেক কাজ থাকা সত্ত্বেও আমি প্রতিদিন ব্যায়াম করি।","en":"Even though I have a lot of work, I exercise every day.","note":"","say":"Even though I have a lot of work, I exercise every day."},{"n":1796,"bn":"আমার কাছে টাকা থাকলেও আমি এটা কিনতাম না।","en":"Even if I had the money, I wouldn't buy it.","note":"","say":"Even if I had the money, I wouldn't buy it."}]},{"t":"box","k":"note","h":"<b>on the other hand<\/b> is for two sides of the SAME topic. Don't use it to mean \"in addition\". <b>On the contrary<\/b> means \"No, the opposite is true\" — it is not the same as \"on the other hand\"."},{"t":"h2","h":"Reason (Cause)"},{"t":"tr","rows":[{"n":1797,"bn":"আমি দেরি করেছি কারণ বাস দেরিতে এসেছে।","en":"I was late because the bus came late.","note":"","say":"I was late because the bus came late."},{"n":1798,"bn":"বাস দেরিতে আসায় আমি দেরি করেছি।","en":"I was late because of the late bus. / due to the bus delay.","note":"","say":"I was late because of the late bus.. due to the bus delay."},{"n":1799,"bn":"যেহেতু আজ ছুটি, চলো বাইরে খাই।","en":"Since it's a holiday, let's eat out.","note":"","say":"Since it's a holiday, let's eat out."},{"n":1800,"bn":"যেহেতু তুমি এখানে আছ, একটু সাহায্য করো।","en":"As you're here, could you give me a hand?","note":"","say":"As you're here, could you give me a hand?"},{"n":1801,"bn":"আমি এই বিষয়টা বেছে নিয়েছি, কারণ এটা নিয়ে কম গবেষণা হয়েছে।","en":"I chose this topic because it hasn't been studied much.","note":"","say":"I chose this topic because it hasn't been studied much."},{"n":1802,"bn":"এর মূল কারণ হলো ফান্ডিংয়ের অভাব।","en":"The main reason is the lack of funding.","note":"","say":"The main reason is the lack of funding."},{"n":1803,"bn":"খারাপ আবহাওয়ার কারণে ফ্লাইট বাতিল হয়েছে।","en":"The flight was cancelled due to bad weather.","note":"","say":"The flight was cancelled due to bad weather."},{"n":1804,"bn":"এ কারণেই আমি আমেরিকায় এসেছি।","en":"That's why I came to the US.","note":"","say":"That's why I came to the US."},{"n":1805,"bn":"আমি এটা বলছি কারণ আমি তোমার ভালো চাই।","en":"I'm saying this because I care about you.","note":"","say":"I'm saying this because I care about you."},{"n":1806,"bn":"সময়ের অভাবে আমরা সব কিছু পরীক্ষা করতে পারিনি।","en":"Owing to a lack of time, we couldn't test everything.","note":"","say":"Owing to a lack of time, we couldn't test everything."},{"n":1807,"bn":"আমাদের সীমিত বাজেটের কথা বিবেচনা করে, এটাই সেরা বিকল্প।","en":"Given our limited budget, this is the best option.","note":"","say":"Given our limited budget, this is the best option."}]},{"t":"h2","h":"Result (Effect)"},{"t":"tr","rows":[{"n":1808,"bn":"আমি ক্লান্ত ছিলাম, তাই তাড়াতাড়ি ঘুমালাম।","en":"I was tired, so I went to bed early.","note":"","say":"I was tired, so I went to bed early."},{"n":1809,"bn":"সে কঠোর পরিশ্রম করেছে, ফলে সে সফল হয়েছে।","en":"She worked hard; as a result, she succeeded.","note":"","say":"She worked hard; as a result, she succeeded."},{"n":1810,"bn":"ডেটা অসম্পূর্ণ ছিল, তাই ফলাফল নির্ভরযোগ্য না।","en":"The data was incomplete; therefore, the results aren't reliable.","note":"","say":"The data was incomplete; therefore, the results aren't reliable."},{"n":1811,"bn":"বৃষ্টি হচ্ছিল, যার মানে খেলা বাতিল।","en":"It was raining, which meant the match was cancelled.","note":"","say":"It was raining, which meant the match was cancelled."},{"n":1812,"bn":"আমি অ্যালার্ম শুনিনি, ফলে বাস মিস করলাম।","en":"I didn't hear the alarm, so I missed the bus.","note":"","say":"I didn't hear the alarm, so I missed the bus."},{"n":1813,"bn":"এই কারণে আমাদের আরো সময় দরকার।","en":"For this reason, we need more time.","note":"","say":"For this reason, we need more time."},{"n":1814,"bn":"এটা এত ঠান্ডা ছিল যে আমরা বাইরে যেতে পারিনি।","en":"It was so cold that we couldn't go out.","note":"","say":"It was so cold that we couldn't go out."},{"n":1815,"bn":"এটা এত ভালো সিনেমা ছিল যে আমি দুবার দেখেছি।","en":"It was such a good movie that I watched it twice.","note":"","say":"It was such a good movie that I watched it twice."},{"n":1816,"bn":"আমি অনেক টাকা খরচ করে ফেলেছি, ফলে এখন বাজেটে টান পড়েছে।","en":"I've spent a lot of money, so now my budget is tight.","note":"","say":"I've spent a lot of money, so now my budget is tight."},{"n":1817,"bn":"দাম বেড়েছে; ফলস্বরূপ মানুষ কম কিনছে।","en":"Prices have gone up; consequently, people are buying less.","note":"","say":"Prices have gone up; consequently, people are buying less."}]},{"t":"h2","h":"Purpose"},{"t":"tr","rows":[{"n":1818,"bn":"আমি এখানে পড়াশোনা করতে এসেছি।","en":"I came here to study.","note":"","say":"I came here to study."},{"n":1819,"bn":"টাকা বাঁচানোর জন্য আমি বাসায় রান্না করি।","en":"I cook at home to save money. / …in order to save money.","note":"","say":"I cook at home to save money.. ...in order to save money."},{"n":1820,"bn":"আমি জোরে বললাম যাতে সবাই শুনতে পায়।","en":"I spoke loudly so that everyone could hear.","note":"","say":"I spoke loudly so that everyone could hear."},{"n":1821,"bn":"আমি নোট নিই যাতে ভুলে না যাই।","en":"I take notes so that I don't forget. / …so as not to forget.","note":"","say":"I take notes so that I don't forget.. ...so as not to forget."},{"n":1822,"bn":"ছাতা নিয়ে যাও, যদি বৃষ্টি হয়।","en":"Take an umbrella in case it rains.","note":"","say":"Take an umbrella in case it rains."},{"n":1823,"bn":"আমি তাড়াতাড়ি বের হলাম যাতে জ্যামে না পড়ি।","en":"I left early to avoid the traffic.","note":"","say":"I left early to avoid the traffic."}]},{"t":"h2","h":"Examples and Clarifying"},{"t":"tr","rows":[{"n":1824,"bn":"আমি ঝাল খাবার পছন্দ করি, যেমন বিরিয়ানি আর কাচ্চি।","en":"I like spicy food, such as biryani and kacchi.","note":"","say":"I like spicy food, such as biryani and kacchi."},{"n":1825,"bn":"উদাহরণস্বরূপ, আমাদের ল্যাবে দশটা জিপিইউ আছে।","en":"For example, our lab has ten GPUs.","note":"","say":"For example, our lab has ten GPUs."},{"n":1826,"bn":"ধরো, তুমি একটা ফোন কিনতে চাও।","en":"Say you want to buy a phone. / Let's say you want to buy a phone.","note":"","say":"Say you want to buy a phone.. Let's say you want to buy a phone."},{"n":1827,"bn":"আমার শহরের কথাই ধরো।","en":"Take my hometown, for example.","note":"","say":"Take my hometown, for example."},{"n":1828,"bn":"বিশেষ করে, আমি হার্ডওয়্যার নিরাপত্তায় আগ্রহী।","en":"In particular, I'm interested in hardware security.","note":"","say":"In particular, I'm interested in hardware security."},{"n":1829,"bn":"আমি বলতে চাইছি, এটা কাজ করবে না।","en":"I mean, it won't work.","note":"","say":"I mean, it won't work."},{"n":1830,"bn":"অন্যভাবে বললে, আমাদের আরো সময় দরকার।","en":"In other words, we need more time.","note":"","say":"In other words, we need more time."},{"n":1831,"bn":"সহজ করে বললে, মডেলটা বিদ্যুৎ খরচ দেখে চাবি অনুমান করে।","en":"To put it simply, the model guesses the key by looking at power consumption.","note":"","say":"To put it simply, the model guesses the key by looking at power consumption."},{"n":1832,"bn":"আসলে ব্যাপারটা হলো...","en":"Basically, the thing is…","note":"","say":"Basically, the thing is..."},{"n":1833,"bn":"মূলত দুটো সমস্যা আছে, যথা খরচ আর সময়।","en":"There are basically two problems, namely cost and time.","note":"","say":"There are basically two problems, namely cost and time."},{"n":1834,"bn":"যেমন ধরো, গতকাল আমি দশ ঘণ্টা কাজ করেছি।","en":"For instance, yesterday I worked for ten hours.","note":"","say":"For instance, yesterday I worked for ten hours."},{"n":1835,"bn":"ছোট শহরগুলো, যেমন টাসকালুসা, অনেক শান্ত।","en":"Smaller cities, like Tuscaloosa, are much qui on a difficult concept, my lab mates can explain it in a different way. <b>So<\/b> I'd say it depends on the task: for deep work, alone; for brainstorming, <b>definitely<\/b> a group.\""},{"t":"box","k":"note","h":"<b>Question:<\/b> How has technology changed the way people communicate?<br><b>Band 7+ style:<\/b> \"<b>Well<\/b>, I'd say it's changed things <b>dramatically<\/b>. <b>To begin with<\/b>, we can now talk to anyone, anywhere, instantly — <b>for example<\/b>, I video-call my parents in Bangladesh almost every day. <b>On the other hand<\/b>, <b>some people argue that<\/b> face-to-face conversation has suffered, <b>because<\/b> people spend more time on their phones. <b>Personally<\/b>, I think it's <b>a bit of both<\/b>: technology has made communication easier, <b>but<\/b> it's up to us how we use it.\""},{"t":"tr","rows":[{"n":1876,"bn":"সাধারণভাবে, আমি একা পড়তে পছন্দ করি, মূলত কারণ এতে মনোযোগ দিতে পারি।","en":"Generally speaking, I prefer studying alone, mainly because I can concentrate better.","note":"","say":"Generally speaking, I prefer studying alone, mainly because I can concentrate better."},{"n":1877,"bn":"তবে গ্রুপে পড়ারও কিছু সুবিধা আছে।","en":"That said, group study has its advantages.","note":"","say":"That said, group study has its advantages."},{"n":1878,"bn":"যেমন, কোনো কঠিন বিষয়ে আটকে গেলে বন্ধুরা অন্যভাবে বুঝিয়ে দিতে পারে।","en":"For instance, when I'm stuck on something difficult, my friends can explain it differently.","note":"","say":"For instance, when I'm stuck on something difficult, my friends can explain it differently."},{"n":1879,"bn":"তাই আমি বলব, এটা কাজের উপর নির্ভর করে।","en":"So I'd say it depends on the task.","note":"","say":"So I'd say it depends on the task."},{"n":1880,"bn":"প্রথমত, এখন যেকোনো জায়গা থেকে যে কারো সাথে কথা বলা যায়।","en":"To begin with, we can now talk to anyone from anywhere.","note":"","say":"To begin with, we can now talk to anyone from anywhere."},{"n":1881,"bn":"অন্যদিকে, অনেকে মনে করেন সামনাসামনি কথা বলা কমে গেছে।","en":"On the other hand, some people feel that face-to-face conversation has declined.","note":"","say":"On the other hand, some people feel that face-to-face conversation has declined."},{"n":1882,"bn":"ব্যক্তিগতভাবে, আমার মনে হয় দুটোই সত্যি।","en":"Personally, I think it's a bit of both.","note":"","say":"Personally, I think it's a bit of both."}]},{"t":"h2","h":"Signposting: Telling the Listener Where You Are Going"},{"t":"p","h":"Signposting phrases are connectors at the level of the <b>whole answer<\/b>. They are the strongest tool to stop jumping."},{"t":"tb","head":["Purpose","Phrases"],"rows":[["Announce structure","There are two main reasons. / I'd like to talk about three things. / Let me break this down."],["Start point 1","The first thing is… / To start with… / My first point is…"],["Move to next","Moving on to… / Another thing is… / The second reason is… / On top of that…"],["Give an example","Let me give you an example. / A good example of this is…"],["Return to main point","Anyway, going back to the question… / So, coming back to what I said…"],["Notice you are jumping","Sorry, let me go back a step. / Actually, let me put that another way."],["Conclude","So, overall… / So, to sum up… / That's basically why… / So that's how I see it."]]},{"t":"tr","rows":[{"n":1883,"bn":"এর দুটো প্রধান কারণ আছে।","en":"There are two main reasons for this.","note":"","say":"There are two main reasons for this."},{"n":1884,"bn":"আমি তিনটা জিনিস নিয়ে বলতে চাই।","en":"I'd like to talk about three things.","note":"","say":"I'd like to talk about three things."},{"n":1885,"bn":"প্রথম কারণ হলো খরচ।","en":"The first reason is cost.","note":"","say":"The first reason is cost."},{"n":1886,"bn":"এবার দ্বিতীয় কারণে আসি।","en":"Moving on to the second reason…","note":"","say":"Moving on to the second reason..."},{"n":1887,"bn":"এর একটা ভালো উদাহরণ হলো আমার নিজের ল্যাব।","en":"A good example of this is my own lab.","note":"","say":"A good example of this is my own lab."},{"n":1888,"bn":"যাই হোক, প্রশ্নে ফিরে আসি।","en":"Anyway, going back to the question…","note":"","say":"Anyway, going back to the question..."},{"n":1889,"bn":"দুঃখিত, এক ধাপ পেছনে যাই।","en":"Sorry, let me go back a step.","note":"","say":"Sorry, let me go back a step."},{"n":1890,"bn":"আসলে, আমি এটা অন্যভাবে বলি।","en":"Actually, let me put that another way.","note":"","say":"Actually, let me put that another way."},{"n":1891,"bn":"তো সব মিলিয়ে, এই কারণেই আমি এখানে পড়তে এসেছি।","en":"So, overall, that's why I came here to study.","note":"","say":"So, overall, that's why I came here to study."}]},{"t":"h2","h":"Common Connector Mistakes"},{"t":"mx","rows":[["Although it was late, but I went.","Although it was late, I went. / It was late, but I went.","only one connector"],["Despite it was raining…","Despite <b>the rain<\/b>… / <b>Although<\/b> it was raining…","despite + noun"],["Despite of the rain","Despite the rain / In spite <b>of<\/b> the rain","no \"of\" after despite"],["Because of I was sick","Because I was sick / Because of <b>my illness<\/b>","because + clause; because of + noun"],["However, but…","However, …","don't double"],["Inspite","in spite (two words)",""],["Even I tried, I failed.","<b>Even though<\/b> I tried, I failed.",""],["So that I came here for study.","<b>That's why<\/b> I came here <b>to study<\/b>.",""],["On the other hand, I also like… (adding)","<b>Also<\/b>, I like… / <b>On top of that<\/b>…","\"on the other hand\" = contrast"],["At last, I want to say…","<b>Finally<\/b> / <b>Lastly<\/b>, I'd like to say…","\"at last\" = after long waiting"],["Firstly… Secondly… Thirdly… Fourthly… (in speech)","The first thing is… Another thing is… And finally…","sounds more natural in speech"],["Moreover (in casual chat)","Plus / Also / On top of that","\"moreover\" is formal"],["Besides of that","<b>Besides that<\/b> / <b>Apart from that<\/b>",""],["As a conclusion","<b>In conclusion<\/b> / <b>To sum up<\/b>",""],["According to me","<b>In my opinion<\/b> / <b>I think<\/b> / <b>From my point of view<\/b>","\"according to\" is for other sources"]],"say":["Although it was late, I went.. It was late, but I went.","Despite the rain.... Although it was raining...","Despite the rain. In spite of the rain","Because I was sick. Because of my illness","However, ...","in spite (two words)","Even though I tried, I failed.","That's why I came here to study.","Also, I like.... On top of that...","Finally. Lastly, I'd like to say...","The first thing is... Another thing is... And finally...","Plus. Also. On top of that","Besides that. Apart from that","In conclusion. To sum up","In my opinion. I think. From my point of view"]},{"t":"h2","h":"Drill: Join the Ideas with a Connector"},{"t":"tr","rows":[{"n":1892,"bn":"ক্লান্ত ছিলাম + কাজ শেষ করলাম (contrast)","en":"I was tired, but I finished the work. / Although I was tired, I finished the work.","note":"","say":"I was tired, but I finished the work.. Although I was tired, I finished the work."},{"n":1893,"bn":"পেপার রিজেক্ট হয়েছে + আমরা আবার জমা দেব (result)","en":"The paper was rejected, so we're going to resubmit it.","note":"","say":"The paper was rejected, so we're going to resubmit it."},{"n":1894,"bn":"পড়াতে ভালো লাগে + ছাত্রদের কাছ থেকে শিখি (reason)","en":"I enjoy teaching because I learn from my students.","note":"","say":"I enjoy teaching because I learn from my students."},{"n":1895,"bn":"আমি রান্না করি + আমার স্ত্রী বাসন ধোয় (contrast/sharing)","en":"I do the cooking, while my wife does the dishes.","note":"","say":"I do the cooking, while my wife does the dishes."},{"n":1896,"bn":"শহরটা ছোট + এখানে সবকিছু আছে (concession)","en":"The city is small. Even so, it has everything I need.","note":"","say":"The city is small. Even so, it has everything I need."},{"n":1897,"bn":"বাজেট কম + আমরা পুরনো যন্ত্র ব্যবহার করি (cause)","en":"Due to the limited budget, we use old equipment.","note":"","say":"Due to the limited budget, we use old equipment."},{"n":1898,"bn":"আমি প্রতিদিন অনুশীলন করি + সাবলীল হতে চাই (purpose)","en":"I practise every day so that I can become fluent.","note":"","say":"I practise every day so that I can become fluent."},{"n":1899,"bn":"আমার অনেক কাজ + আমি পার্টিতে যাব (concession)","en":"Even though I have a lot of work, I'm going to the party.","note":"","say":"Even though I have a lot of work, I'm going to the party."},{"n":1900,"bn":"সে খুব দ্রুত শেখে + খুব পরিশ্রমী (adding)","en":"She learns very quickly, and on top of that, she's very hard-working.","note":"","say":"She learns very quickly, and on top of that, she's very hard-working."},{"n":1901,"bn":"কোডটা চলছে না + লাইব্রেরি আপডেট হয়নি (reason)","en":"The code isn't running because the library hasn't been updated.","note":"","say":"The code isn't running because the library hasn't been updated."},{"n":1902,"bn":"আমি তাড়াতাড়ি বের হলাম + জ্যাম এড়াতে (purpose)","en":"I left early to avoid the traffic.","note":"","say":"I left early to avoid the traffic."},{"n":1903,"bn":"সে আসেনি + আমরা শুরু করলাম (result/time)","en":"She didn't come, so we started without her.","note":"","say":"She didn't come, so we started without her."},{"n":1904,"bn":"বিদেশে জীবন কঠিন + অনেক শেখা যায় (concession)","en":"Life abroad is hard; having said that, you learn a lot.","note":"","say":"Life abroad is hard; having said that, you learn a lot."},{"n":1905,"bn":"আমার প্রফেসর ব্যস্ত + সবসময় সময় দেন (contrast)","en":"My professor is busy; however, she always makes time for us.","note":"","say":"My professor is busy; however, she always makes time for us."},{"n":1906,"bn":"আমি টিএ + আমি পিএইচডি ছাত্র (adding)","en":"I'm a PhD student, and I also work as a TA.","note":"","say":"I'm a PhD student, and I also work as a TA."}]},{"t":"box","k":"try","h":"The \"Connector Challenge\": choose any topic (e.g., \"your hometown\"). Speak for one minute using <b>one connector from each row<\/b> of the Connector Map — adding, contrast, reason, result, example, sequence, summary. Record and tick each one you used."}]}]},{"title":"Part B","sub":"Vocabulary and Phrases — say what you really mean, naturally","chapters":[{"id":28,"title":"Everyday Bengali Expressions in Natural English","blocks":[{"t":"p","h":"Many things we say in Bengali every day don't translate word by word. These are the sentences that make you sound natural in daily conversation."},{"t":"h2","h":"Greetings, Small Talk, and Checking In"},{"t":"tr","rows":[{"n":1907,"bn":"কেমন আছ?","en":"How are you? / How's it going? / How are you doing?","note":"","say":"How are you?. How's it going?. How are you doing?"},{"n":1908,"bn":"ভালো আছি, তুমি?","en":"I'm good, thanks. And you? / Pretty good, you?","note":"","say":"I'm good, thanks. And you?. Pretty good, you?"},{"n":1909,"bn":"এই তো চলছে।","en":"Not bad. / Can't complain. / Same old, same old.","note":"","say":"Not bad.. Can't complain.. Same old, same old."},{"n":1910,"bn":"অনেকদিন পর দেখা!","en":"Long time no see! / It's been ages!","note":"","say":"Long time no see!. It's been ages!"},{"n":1911,"bn":"কী খবর?","en":"What's up? / What's new?","note":"","say":"What's up?. What's new?"},{"n":1912,"bn":"তেমন কিছু না।","en":"Not much. / Nothing much.","note":"","say":"Not much.. Nothing much."},{"n":1913,"bn":"দিন কেমন গেল?","en":"How was your day?","note":"","say":"How was your day?"},{"n":1914,"bn":"সপ্তাহান্ত কেমন কাটল?","en":"How was your weekend?","note":"","say":"How was your weekend?"},{"n":1915,"bn":"সব ঠিকঠাক?","en":"Is everything okay? / All good?","note":"","say":"Is everything okay?. All good?"},{"n":1916,"bn":"তোমাকে দেখে ভালো লাগল।","en":"It's good to see you.","note":"","say":"It's good to see you."},{"n":1917,"bn":"তোমার সাথে কথা বলে ভালো লাগল।","en":"It was nice talking to you.","note":"","say":"It was nice talking to you."},{"n":1918,"bn":"আবার দেখা হবে।","en":"See you around. / Catch you later.","note":"","say":"See you around.. Catch you later."},{"n":1919,"bn":"ভালো থেকো।","en":"Take care.","note":"","say":"Take care."},{"n":1920,"bn":"বাসায় সবাই কেমন আছে?","en":"How's your family? / How's everyone at home?","note":"","say":"How's your family?. How's everyone at home?"},{"n":1921,"bn":"শুভ সকাল!","en":"Good morning!","note":"","say":"Good morning!"},{"n":1922,"bn":"শুভ রাত্রি।","en":"Good night.","note":"","say":"Good night."},{"n":1923,"bn":"তোমার সপ্তাহান্ত ভালো কাটুক!","en":"Have a good weekend!","note":"","say":"Have a good weekend!"},{"n":1924,"bn":"তোমার দিনটা ভালো কাটুক।","en":"Have a nice day.","note":"","say":"Have a nice day."},{"n":1925,"bn":"ইদানীং কী করছ?","en":"What have you been up to?","note":"","say":"What have you been up to?"},{"n":1926,"bn":"কাজ কেমন চলছে?","en":"How's work going?","note":"","say":"How's work going?"},{"n":1927,"bn":"পড়াশোনা কেমন চলছে?","en":"How are your studies going?","note":"","say":"How are your studies going?"},{"n":1928,"bn":"তোমার গবেষণা কেমন এগোচ্ছে?","en":"How's your research coming along?","note":"","say":"How's your research coming along?"}]},{"t":"h2","h":"Agreeing, Disagreeing, and Reacting"},{"t":"tr","rows":[{"n":1929,"bn":"একদম ঠিক।","en":"Exactly. / Absolutely. / That's right.","note":"","say":"Exactly.. Absolutely.. That's right."},{"n":1930,"bn":"আমিও তাই মনে করি।","en":"I think so too. / I feel the same way.","note":"","say":"I think so too.. I feel the same way."},{"n":1931,"bn":"তুমি ঠিকই বলেছ।","en":"You've got a point. / Fair enough.","note":"","say":"You've got a point.. Fair enough."},{"n":1932,"bn":"আমি পুরোপুরি একমত।","en":"I couldn't agree more.","note":"","say":"I couldn't agree more."},{"n":1933,"bn":"হয়তো।","en":"Maybe. / Possibly. / Could be.","note":"","say":"Maybe.. Possibly.. Could be."},{"n":1934,"bn":"আমি নিশ্চিত না।","en":"I'm not so sure about that.","note":"","say":"I'm not so sure about that."},{"n":1935,"bn":"আমি একমত না।","en":"I don't really agree. / I see it a bit differently.","note":"","say":"I don't really agree.. I see it a bit differently."},{"n":1936,"bn":"তা ঠিক, কিন্তু. s of attacks.","note":"","say":"Our goal is to protect devices from these kinds of attacks."},{"n":2190,"bn":"আমরা মেশিন লার্নিং ব্যবহার করে সিগন্যালের প্যাটার্ন খুঁজি।","en":"We use machine learning to find patterns in the signals.","note":"","say":"We use machine learning to find patterns in the signals."},{"n":2191,"bn":"এর বাস্তব প্রয়োগ আছে, যেমন ক্রেডিট কার্ড আর স্মার্টফোনের নিরাপত্তা।","en":"It has real-world applications, such as credit card and smartphone security.","note":"","say":"It has real-world applications, such as credit card and smartphone security."}]},{"t":"h2","h":"Food, Cooking, and Kitchen"},{"t":"tb","head":["English","বাংলা","English","বাংলা"],"rows":[["chop","কুচি করে কাটা","slice","পাতলা করে কাটা"],["dice","ছোট টুকরো করে কাটা","grate","কোরানো / ঘষে কাটা"],["peel","খোসা ছাড়ানো","crush (garlic)","থেঁতো করা"],["marinate","মশলা মাখিয়ে রাখা","stir","নাড়া"],["fry / deep-fry","ভাজা / ডুবো তেলে ভাজা","sauté","হালকা ভাজা"],["boil","সেদ্ধ করা / ফোটানো","simmer","কম আঁচে ফোটানো"],["steam","ভাপে রান্না","bake","ওভেনে বেক করা"],["roast","ঝলসানো","grill","গ্রিল করা"],["season","লবণ-মশলা দেওয়া","garnish","উপরে সাজানো"],["low / medium / high heat","কম / মাঝারি / বেশি আঁচ","lid","ঢাকনা"],["pan / frying pan","কড়াই / ফ্রাইপ্যান","pot / saucepan","হাঁড়ি"],["cutting board","কাটার বোর্ড","ladle","হাতা"],["turmeric","হলুদ","cumin","জিরা"],["coriander","ধনে","chilli powder","মরিচ গুঁড়া"],["lentils","ডাল","ginger paste","আদা বাটা"]]},{"t":"h2","h":"Travel and Transport"},{"t":"tb","head":["English","বাংলা","Example"],"rows":[["boarding pass","বোর্ডিং পাস","Here's my boarding pass."],["check in / check-in counter","চেক ইন","Where's the check-in counter?"],["carry-on / checked bag","হাতের ব্যাগ / জমা দেওয়া ব্যাগ","I only have a carry-on."],["layover / connecting flight","ট্রানজিট","I have a four-hour layover in Doha."],["delayed / cancelled","দেরি / বাতিল","My flight has been delayed."],["gate","গেট","Which gate is it?"],["customs / immigration","কাস্টমস / ইমিগ্রেশন","We went through immigration."],["round trip / one-way","যাওয়া-আসা / একমুখী","A round-trip ticket, please."],["fare","ভাড়া","How much is the fare?"],["rental car","ভাড়া গাড়ি","We rented a car."],["itinerary","ভ্রমণসূচি","Here's our itinerary."],["reservation / booking","সংরক্ষণ","I have a reservation under Rupok."]]}]},{"id":31,"title":"Fillers, Hedging, and Buying Time","blocks":[{"t":"p","h":"When you need a second to think, silence or \"ummm… aaa…\" sounds like hesitation. <b>Natural fillers<\/b> sound like thinking. They are one of the quickest fixes for the fluency score — but don't overuse them. One filler at the start of an answer, and maybe one in the middle, is enough."},{"t":"h2","h":"Buying Time at the Start of an Answer"},{"t":"tb","head":["Situation","Natural phrases"],"rows":[["A simple question","Well, … / Oh, … / Sure, …"],["A hard question","That's a good question. / Hmm, let me think about that for a second. / That's an interesting one."],["Never thought about it","I've never really thought about that, but I'd say… / To be honest, that's not something I think about much, but…"],["Two sides","It's hard to say, really. / It depends, I guess. / There are a few ways to look at it."],["Personal example coming","Speaking from my own experience… / Well, in my case…"]]},{"t":"tr","rows":[{"n":2192,"bn":"এটা ভালো প্রশ্ন, একটু ভেবে বলি।","en":"That's a good question — let me think for a second.","note":"","say":"That's a good question — let me think for a second."},{"n":2193,"bn":"সত্যি বলতে, এটা নিয়ে আমি কখনো তেমন ভাবিনি, তবে আমার মনে হয়...","en":"To be honest, I've never really thought about that, but I'd say…","note":"","say":"To be honest, I've never really thought about that, but I'd say..."},{"n":2194,"bn":"বলা কঠিন, তবে...","en":"It's hard to say, but…","note":"","say":"It's hard to say, but..."},{"n":2195,"bn":"এটা নির্ভর করে, আসলে।","en":"It depends, really.","note":"","say":"It depends, really."},{"n":2196,"bn":"আমার ক্ষেত্রে বলতে গেলে...","en":"Well, in my case…","note":"","say":"Well, in my case..."},{"n":2197,"bn":"এটা দেখার কয়েকটা দৃষ্টিভঙ্গি আছে।","en":"There are a couple of ways to look at it.","note":"","say":"There are a couple of ways to look at it."},{"n":2198,"bn":"সহজ উত্তর হলো হ্যাঁ, কিন্তু...","en":"The short answer is yes, but…","note":"","say":"The short answer is yes, but..."}]},{"t":"h2","h":"Fillers in the Middle (instead of \"aaa\", \"ummm\")"},{"t":"tb","head":["Filler","When to use"],"rows":[["you know","to connect with the listener (don't overuse)"],["I mean","to clarify or correct"],["kind of / sort of","to soften a description"],["let's say","before an example or number"],["how can I put it…","when searching for a word"],["what's the word…","when a word is on the tip of your tongue"],["the thing is…","before the main point"],["basically","before a simple summary"],["actually","to add a correction or surprise"],["well","to start, pause, or soften"]]},{"t":"h2","h":"Paraphrasing When You Don't Know a Word"},{"t":"p","h":"Band 7 speakers don't stop when they forget a word — they <b>describe it<\/b>."},{"t":"tb","head":["Strategy","Phrase","Example"],"rows":[["Describe the use","It's a thing you use to…","\"It's a thing you use to open bottles.\" (bottle opener)"],["Describe the type","It's a kind of… / It's a type of…","\"It's a kind of spicy rice dish.\" (biryani)"],["Describe looks","It looks like… / It's similar to…","\"It looks like a big spoon.\" (ladle)"],["Describe the person","It's someone who…","\"It's someone who checks your bags at the airport.\""],["Describe the place","It's a place where…","\"It's a place where you can borrow books.\""],["Opposite","It's the opposite of…","\"It's the opposite of generous.\" (stingy)"],["Ask","What do you call it… the thing that…","\"What do you call it — the thing that measures temperature?\""]]},{"t":"tr","rows":[{"n":2199,"bn":"এটা একটা জিনিস যেটা দিয়ে নারকেল কোরানো হয়।","en":"It's a tool you use to grate coconut.","note":"","say":"It's a tool you use to grate coconut."},{"n":2200,"bn":"এটা একধরনের মিষ্টি, দুধ দিয়ে বানানো।","en":"It's a kind of sweet made with milk.","note":"","say":"It's a kind of sweet made with milk."},{"n":2201,"bn":"এটা এমন একজন যে বিয়েতে ছবি তোলে।","en":"It's someone who takes photos at weddings.","note":"","say":"It's someone who takes photos at weddings."},{"n":2202,"bn":"এটা এমন জায়গা যেখানে পুরনো জিনিস বিক্রি হয়।","en":"It's a place where they sell second-hand things.","note":"","say":"It's a place where they sell second-hand things."},{"n":2203,"bn":"আমি শব্দটা ভুলে গেছি, তবে এটা অনেকটা...","en":"I can't think of the word, but it's similar to…","note":"","say":"I can't think of the word, but it's similar to..."},{"n":2204,"bn":"বাংলায় আমরা একে বলি \"পিঠা\" — এক ধরনের পিঠা বা কেক।","en":"In Bengali we call it \"pitha\" — it's a kind of rice cake.","note":"","say":"In Bengali we call it \"pitha\" — it's a kind of rice cake."}]},{"t":"h2","h":"Hedging: Sounding Careful and Academic"},{"t":"p","h":"Hedging means not sounding too absolute. It's essential for academic discussion and IELTS Part 3."},{"t":"tb","head":["Too strong","Hedged (more natural, more academic)"],"rows":[["All people use phones.","Most people seem to use smartphones these days."],["This method is the best.","This method appears to perform better in most cases."],["AI will destroy jobs.","AI is likely to replace some types of jobs."],["It is wrong.","I'm not sure that's entirely right."],["Students are lazy.","Some students tend to leave things until the last minute."],["This proves it.","This suggests that… / This seems to indicate that…"]]},{"t":"tr","rows":[{"n":2205,"bn":"মনে হচ্ছে ফলাফলটা ঠিক আছে।","en":"It seems that the results are correct.","note":"","say":"It seems that the results are correct."},{"n":2206,"bn":"সম্ভবত এটা ডেটার কারণে।","en":"This is probably because of the data.","note":"","say":"This is probably because of the data."},{"n":2207,"bn":"আমি যতটুকু জানি, এটা ঠি u 10 negative questions (\"Didn't you…?\", \"Don't you…?\", \"Haven't you…?\"). Answer with the full form \"Yes, I did / No, I didn't\". This trains the English logic."}]},{"id":34,"title":"Spelling Traps","blocks":[{"t":"p","h":"You asked for words that are often misspelled. These appear in emails, papers, and slides — and many are also mispronounced because of their spelling."},{"t":"h2","h":"Commonly Misspelled Words"},{"t":"tb","head":["❌ Wrong","✅ Right","Memory trick"],"rows":[["accomodation","accommodation","two Cs, two Ms — big enough to accommodate both"],["acheive","achieve","i before e, except after c"],["adress","address","double d, double s"],["agressive","aggressive","double g, double s"],["apparantly","apparently","parent in the middle"],["arguement","argument","lose the e of argue"],["begining","beginning","double n"],["beleive","believe","never believe a lie"],["calender","calendar","ends with -ar"],["cemetary","cemetery","three e's"],["collegue","colleague","col-league"],["comming","coming","one m"],["commitee","committee","double m, double t, double e"],["concious","conscious","con-sci-ous"],["definately","definitely","finite in the middle"],["dilemna","dilemma","two m's"],["disapoint","disappoint","dis + appoint"],["embarass","embarrass","double r, double s"],["enviroment","environment","iron in the middle"],["existance","existence","ends -ence"],["experiance","experience",""],["foriegn","foreign",""],["fourty","forty","no u"],["freind","friend","fri-END: friends to the end"],["goverment","government","govern + ment"],["grammer","grammar","ends -ar"],["guarentee","guarantee",""],["harrass","harass","one r"],["hight","height",""],["immediatly","immediately","immediate + ly"],["independant","independent","ends -ent"],["knowlege","knowledge","know + ledge"],["liason","liaison","i on both sides of a"],["libary","library","two r's"],["maintainance","maintenance",""],["millenium","millennium","double l, double n"],["mischievious","mischievous","no extra i"],["neccessary","necessary","one collar (c), two sleeves (ss)"],["noticable","noticeable","keep the e"],["occassion","occasion","double c, single s"],["occured","occurred","double r"],["occurence","occurrence","double c, double r, -ence"],["persue","pursue",""],["posession","possession","double s twice"],["preferrence","preference","one r"],["privelege","privilege",""],["pronounciation","pronunciation","pronounce → pronunciation (no \"o\")"],["publically","publicly",""],["recieve","receive","e before i after c"],["recomend","recommend","one c, double m"],["refered","referred","double r"],["relevent","relevant","ends -ant"],["rythm","rhythm","rhythm helps your two hips move"],["seperate","separate","there's \"a rat\" in separate"],["sucessful","successful","double c, double s"],["supercede","supersede",""],["suprise","surprise","sur-prise"],["tommorow","tomorrow","one m, double r"],["truely","truly","no e"],["untill","until","one l"],["wierd","weird","weird is weird (e before i)"],["writting","writing","one t (but \"written\")"]]},{"t":"h2","h":"Computer Science and Academic Spelling"},{"t":"tb","head":["❌ Wrong","✅ Right"],"rows":[["algorithem / algorythm","algorithm"],["analyse (UK) / analyze (US)","both correct — be consistent"],["artifical","artificial"],["authentification","authentication"],["cryptograpy","cryptography"],["efficency","efficiency"],["evalution","evaluation"],["experiement","experiment"],["heirarchy","hierarchy"],["implemention","implementation"],["infomation","information"],["paramter / parametre","parameter"],["performace","performance"],["perceptoin","perception"],["proffesor / professer","professor"],["reseach / reasearch","research"],["secuirty","security"],["signiture","signature"],["specificaly","specifically"],["sucessfully","successfully"],["thershold","threshold"],["vulnerablity","vulnerability"]]},{"t":"h2","h":"Confusing Words (Homophones and Near-Homophones)"},{"t":"tb","head":["Pair","Meaning","Example"],"rows":[["affect / effect","affect = verb (influence); effect = noun (result)","Stress affects sleep. The effect was huge."],["accept / except","accept = take; except = but not","I accept. Everyone except me."],["advice / advise","advice = noun <span class=\"ipa\">/ədˈvaɪs/<\/span>; advise = verb <span class=\"ipa\">/ədˈvaɪz/<\/span>","Good advice. I advise you to rest."],["practice / practise","US: practice (both); UK: practice (noun), practise (verb)","I need practice. I practise daily."],["lose / loose","lose = misplace <span class=\"ipa\">/luːz/<\/span>; loose = not tight <span class=\"ipa\">/luːs/<\/span>","Don't lose it. Loose shirt."],["than / then","than = comparison; then = time","Bigger than. Then we left."],["its / it's","its = possessive; it's = it is","Its tail. It's raining."],["your / you're","your = possessive; you're = you are","Your laptop. You're right."],["their / there / they're","possessive / place / they are","Their lab. Over there. They're late."],["whose / who's","possessive / who is","Whose bag? Who's coming?"],["quite / quiet","quite = fairly; quiet = silent","Quite good. Be quiet."],["desert / dessert","desert = sand <span class=\"ipa\">/ˈdezət/<\/span>; dessert = sweet <span class=\"ipa\">/dɪˈzɜːt/<\/span>",""],["principal / principle","principal = head / main; principle = rule",""],["stationary / stationery","not moving / paper and pens",""],["complement / compliment","completes / praise",""],["weather / whether","climate / if",""],["lead / led","lead (present) <span class=\"ipa\">/liːd/<\/span>; led (past) /led/",""],["breath / breathe","noun <span class=\"ipa\">/breθ/<\/span>; verb <span class=\"ipa\">/briːð/<\/span>","Take a breath. Breathe deeply."],["cloth / clothes","fabric <span class=\"ipa\">/klɒθ/<\/span>; things you wear <span class=\"ipa\">/kləʊðz/<\/span>",""],["live (verb) / live (adj)","<span class=\"ipa\">/lɪv/<\/span> (I live) / <span class=\"ipa\">/laɪv/<\/span> (live music)",""]]}]},{"id":35,"title":"Commonly Mispronounced Words (IPA + বাংলা)","blocks":[{"t":"p","h":"These are words Bengali speakers often say incorrectly. Many are everyday words; some are academic. The stressed syllable is in <b>CAPITALS<\/b> in the tip column. Practise each word three times, then put it in a sentence."},{"t":"h2","h":"Silent Letters and Spelling Traps"},{"t":"pr","rows":[{"w":"comfortable","ipa":"/ˈkʌmftəbl/","bn":"কাম্‌ফ্‌টাবল্‌","tip":"3 syllables: KUMF-tuh-bl; not \"com-for-table\"","say":"comfortable","q":"comfortable"},{"w":"vegetable","ipa":"/ˈvedʒtəbl/","bn":"ভেজ্‌টাবল্‌","tip":"3 syllables: VEJ-tuh-bl","say":"vegetable","q":"vegetable"},{"w":"chocolate","ipa":"/ˈtʃɒklət/","bn":"চক্‌লেট্‌","tip":"2 syllables","say":"chocolate","q":"chocolate"},{"w":"interesting","ipa":"/ˈɪntrəstɪŋ/","bn":"ইন্‌ট্রেস্টিং","tip":"3 syllables: IN-tres-ting","say":"interesting","q":"interesting"},{"w":"different","ipa":"/ˈdɪfrənt/","bn":"ডিফ্‌রেন্ট্‌","tip":"2–3 syllables: DIF-rent","say":"different","q":"different"},{"w":"every","ipa":"/ˈevri/","bn":"এভ্‌রি","tip":"2 syllables","say":"every","q":"every"},{"w":"family","ipa":"/ˈfæməli/","bn":"ফ্যামিলি","tip":"<span class=\"ipa\">/æ/<\/span> not /e/","say":"family","q":"family"},{"w":"temperature","ipa":"/ˈtemprətʃə/","bn":"টেম্‌প্রাচা(র্‌)","tip":"TEM-pruh-chuh","say":"temperature","q":"temperature"},{"w":"restaurant","ipa":"/ˈrestrɒnt/","bn":"রেস্‌ট্রন্ট্‌","tip":"2–3 syllables","say":"restaurant","q":"restaurant"},{"w":"Wednesday","ipa":"/ˈwenzdeɪ/","bn":"ওয়েন্‌জ্‌ডে","tip":"the first d is silent","say":"Wednesday","q":"Wednesday"},{"w":"February","ipa":"/ˈfebruəri/","bn":"ফেব্রুয়ারি","tip":"","say":"February","q":"February"},{"w":"island","ipa":"/ˈaɪlənd/","bn":"আইল্যান্ড্‌","tip":"s is silent","say":"island","q":"island"},{"w":"listen","ipa":"/ˈlɪsn/","bn":"লিস্‌ন্‌","tip":"t is silent","say":"listen","q":"listen"},{"w":"often","ipa":"/ˈɒfn/","bn":"অফ্‌ন্‌","tip":"t usually silent","say":"often","q":"often"},{"w":"castle","ipa":"/ˈkɑːsl/","bn":"কাস্‌ল্‌","tip":"t silent","say":"castle","q":"castle"},{"w":"debt","ipa":"/det/","bn":"ডেট্‌","tip":"b silent","say":"debt","q":"debt"},{"w":"doubt","ipa":"/daʊt/","bn":"ডাউট্‌","tip":"b silent","say":"doubt","q":"doubt"},{"w":"subtle","ipa":"/ˈsʌtl/","bn":"সাট্‌ল্‌","tip":"b silent","say":"subtle","q":"subtle"},{"w":"receipt","ipa":"/rɪˈsiːt/","bn":"রিসিট্‌","tip":"p silent","say":"receipt","q":"receipt"},{"w":"psychology","ipa":"/saɪˈkɒlədʒi/","bn":"সাইকলজি","tip":"p silent","say":"psychology","q":"psychology"},{"w":"pneumonia","ipa":"/njuːˈməʊniə/","bn":"নিউমোনিয়া","tip":"p silent","say":"pneumonia","q":"pneumonia"},{"w":"honest","ipa":"/ˈɒnɪst/","bn":"অনিস্ট্‌","tip":"h silent","say":"honest","q":"honest"},{"w":"hour","ipa":"/ˈaʊə/","bn":"আওয়া(র্‌)","tip":"h silent","say":"hour","q":"hour"},{"w":"know / knowledge","ipa":"/nəʊ/ /ˈnɒlɪdʒ/","bn":"নোউ / নলিজ্‌","tip":"k silent","say":"know, knowledge","q":"know"},{"w":"write / wrong","ipa":"/raɪt/ /rɒŋ/","bn":"রাইট্‌ / রং","tip":"w silent","say":"write, wrong","q":"write"},{"w":"calm","ipa":"/kɑːm/","bn":"কাম্‌","tip":"l silent","say":"calm","q":"calm"},{"w":"walk / talk","ipa":"/wɔːk/ /tɔːk/","bn":"ওয়াক্‌ / টক্‌","tip":"l silent","say":"walk, talk","q":"walk"},{"w":"half","ipa":"/hɑːf/","bn":"হাফ্‌","tip":"l silent","say":"half","q":"half"},{"w":"salmon","ipa":"/ˈsæmən/","bn":"স্যামন্‌","tip":"l silent","say":"salmon","q":"salmon"},{"w":"almond","ipa":"/ˈɑːmənd/","bn":"আমন্ড্‌","tip":"l often silent","say":"almond","q":"almond"},{"w":"foreign","ipa":"/ˈfɒrən/","bn":"ফরেন্‌","tip":"g silent","say":"foreign","q":"foreign"},{"w":"sign / design","ipa":"/saɪn/ /dɪˈzaɪn/","bn":"সাইন্‌ / ডিজাইন্‌","tip":"g silent; de-ZINE","say":"sign, design","q":"sign"},{"w":"answer","ipa":"/ˈɑːnsə/","bn":"আন্‌সা(র্‌)","tip":"w silent","say":"answer","q":"answer"},{"w":"sword","ipa":"/sɔːd/","bn":"সোর্ড্‌","tip":"w silent","say":"sword","q":"sword"},{"w":"Christmas","ipa":"/ˈkrɪsməs/","bn":"ক্রিস্‌মাস্‌","tip":"t silent","say":"Christmas","q":"Christmas"}]},{"t":"h2 schievous","q":"mischievous"},{"w":"nuclear","ipa":"/ˈnjuːkliə/","bn":"নিউক্লিয়া(র্‌)","tip":"not \"nucular\"","say":"nuclear","q":"nuclear"},{"w":"library","ipa":"/ˈlaɪbrəri/","bn":"লাইব্রারি","tip":"","say":"library","q":"library"},{"w":"February","ipa":"/ˈfebruəri/","bn":"ফেব্রুয়ারি","tip":"","say":"February","q":"February"},{"w":"pronunciation","ipa":"/prəˌnʌnsiˈeɪʃn/","bn":"প্রানান্‌সিএইশন্‌","tip":"\"nun\", not \"noun\"","say":"pronunciation","q":"pronunciation"},{"w":"fruit","ipa":"/fruːt/","bn":"ফ্রূট্‌","tip":"not \"fru-it\"","say":"fruit","q":"fruit"},{"w":"suit","ipa":"/suːt/","bn":"সূট্‌","tip":"","say":"suit","q":"suit"},{"w":"juice","ipa":"/dʒuːs/","bn":"জূস্‌","tip":"","say":"juice","q":"juice"},{"w":"cupboard","ipa":"/ˈkʌbəd/","bn":"কাবাড্‌","tip":"p silent","say":"cupboard","q":"cupboard"},{"w":"clothes","ipa":"/kləʊðz/","bn":"ক্লোউদ্‌জ়্‌","tip":"1 syllable","say":"clothes","q":"clothes"},{"w":"months","ipa":"/mʌnθs/","bn":"মান্‌থ্‌স্‌","tip":"","say":"months","q":"months"},{"w":"sixth","ipa":"/sɪksθ/","bn":"সিক্‌স্‌থ্‌","tip":"","say":"sixth","q":"sixth"},{"w":"derivative","ipa":"/dɪˈrɪvətɪv/","bn":"ডিরিভাটিভ্‌","tip":"","say":"derivative","q":"derivative"},{"w":"schedule","ipa":"/ˈʃedjuːl/ UK, /ˈskedʒuːl/ US","bn":"শেডিউল্‌ / স্কেজুল্‌","tip":"both are correct","say":"schedule","q":"schedule"},{"w":"tomato","ipa":"/təˈmɑːtəʊ/ UK, /təˈmeɪtoʊ/ US","bn":"টামাটোউ / টামেইটোউ","tip":"","say":"tomato","q":"tomato"},{"w":"data","ipa":"/ˈdeɪtə/ or /ˈdɑːtə/","bn":"ডেইটা / ডাটা","tip":"both fine","say":"data","q":"data"},{"w":"route","ipa":"/ruːt/ or /raʊt/ (US)","bn":"রূট্‌ / রাউট্‌","tip":"","say":"route","q":"route"},{"w":"either","ipa":"/ˈaɪðə/ or /ˈiːðə/","bn":"আইদা(র্‌) / ঈদা(র্‌)","tip":"both fine","say":"either","q":"either"},{"w":"Tuscaloosa","ipa":"/ˌtʌskəˈluːsə/","bn":"টাস্‌কালূসা","tip":"tus-ka-LOO-sa","say":"Tuscaloosa","q":"Tuscaloosa"},{"w":"Alabama","ipa":"/ˌæləˈbæmə/","bn":"অ্যালাব্যামা","tip":"a-la-BAM-a","say":"Alabama","q":"Alabama"},{"w":"Arkansas","ipa":"/ˈɑːkənsɔː/","bn":"আর্কানসো","tip":"s silent!","say":"Arkansas","q":"Arkansas"},{"w":"Illinois","ipa":"/ˌɪləˈnɔɪ/","bn":"ইলানয়","tip":"s silent","say":"Illinois","q":"Illinois"},{"w":"Chicago","ipa":"/ʃɪˈkɑːɡəʊ/","bn":"শিকাগোউ","tip":"","say":"Chicago","q":"Chicago"}]},{"t":"box","k":"try","h":"Pick 10 words from this chapter that you got wrong. Record yourself saying each one in a sentence. Then use an online dictionary's audio (Cambridge or Oxford Learner's) to compare."}]}]},{"title":"Part D","sub":"Real-Life Speaking — organise your ideas, then speak for one minute","chapters":[{"id":36,"title":"How to Speak for One Minute Without Jumping","blocks":[{"t":"p","h":"You told me one of your weaknesses is <b>\"jumping too much\"<\/b> — starting one idea, switching to another, then coming back. The listener gets lost, and you lose fluency because you keep searching for where you are. The cure is simple: <b>choose a frame before you speak<\/b>. A frame is a map with 3–4 stops. You speak each stop in order and use a connector to move to the next."},{"t":"h2","h":"Why We Jump"},{"t":"ul","items":["We start speaking before we know our main point.","A new memory appears in the middle of a sentence, and we follow it.","We translate from Bengali sentence by sentence, without an overall plan.","We feel silence is bad, so we say anything to fill it."]},{"t":"box","k":"key","h":"Spend the first <b>3–5 seconds<\/b> choosing your frame and your main point. Then say your main point <b>in the first sentence<\/b>. Everything after that must support it."},{"t":"h2","h":"Frame 1 — PREP (for opinions)"},{"t":"tb","head":["Step","What to say","Connector"],"rows":[["<b>P<\/b>oint","Your answer in one sentence","Personally, I think… / I'd say…"],["<b>R<\/b>eason","Why","mainly because… / The main reason is…"],["<b>E<\/b>xample","A real example from your life","For example, … / Take… for instance."],["<b>P<\/b>oint again","Repeat your answer in different words","So that's why… / So overall…"]]},{"t":"box","k":"note","h":"<b>Question:<\/b> Is it better to live in a big city or a small town?<br><b>P:<\/b> \"Personally, I'd say a small town suits me better, at least at this stage of my life.\"<br><b>R:<\/b> \"The main reason is that I can focus. There's less traffic, less noise, and everything is close by, so I don't waste hours commuting.\"<br><b>E:<\/b> \"For example, here in Tuscaloosa, it takes me ten minutes to get to the lab. Back home in Bangladesh, the same distance could take an hour in traffic.\"<br><b>P:<\/b> \"So for a PhD student who needs long hours of concentration, a smaller place is a big advantage. That said, I might feel differently later in my career.\""},{"t":"h2","h":"Frame 2 — Past → Present → Future (for \"describe\" or \"how has it changed\")"},{"t":"tb","head":["Step","What to say","Tense"],"rows":[["Past","how it was before","used to / past simple"],["Present","how it is now","present simple / present perfect"],["Change / reason","what caused the change","present perfect / because"],["Future","what you expect or plan","will / going to / I hope to"]]},{"t":"box","k":"note","h":"<b>Question:<\/b> How has your cooking changed since you came to the US?<br>\"Back in Bangladesh, I <b>used to<\/b> rely on my mother for almost everything — I <b>could<\/b> barely make tea. Since I moved here, I<b>'ve learned<\/b> to cook a lot of dishes, mainly because eating out every day is too expensive. Now my wife and I <b>cook<\/b> together most evenings, and I<b>'ve<\/b> actually <b>started<\/b> to enjoy it. In the future, I<b>'d like to<\/b> learn how to make proper biryani — that's my next challenge.\""},{"t":"h2","h":"Frame 3 — STAR (for stories and experiences)"},{"t":"tb","head":["Step","What to say","Connector"],"rows":[["<b>S<\/b>ituation","Where, when, who","It happened last semester, when I was…"],["<b>T<\/b>ask","What the problem or goal was","I had to… / The problem was…"],["<b>A<\/b>ction","What you did, step by step","So first, I… Then I… After that…"],["<b>R<\/b>esult","What happened and what you learned","In the end… / Looking back, I learned that…"]]},{"t":"box","k":"note","h":"<b>Question:<\/b> Describe a time you solved a problem.<br><b>S:<\/b> \"Last spring, a few days before a conference deadline, our experiment suddenly started giving strange results.\"<br><b>T:<\/b> \"I had to find the bug and rerun everything in less than three days.\"<br><b>A:<\/b> \"First, I compared the new outputs with an older version. Then I noticed that a library had been updated, which had changed the default settings. After that, I fixed the version and reran the experiments overnight.\"<br><b>R:<\/b> \"In the end, we submitted on time. Looking back, I learned to always record the exact library versions.\""},{"t":"h2","h":"Frame 4 — Three Points (for \"talk about\" topics)"},{"t":"box","k":"rule","h":"\"There are <b>three<\/b> things I'd like to mention: A, B, and C.\" → \"<b>First<\/b>, A… (1 example)\" → \"<b>Second<\/b>, B…\" → \"<b>And finally<\/b>, C…\" → \"<b>So overall<\/b>, …\""},{"t":"box","k":"note","h":"<b>Question:<\/b> Talk about your daily routine.<br>\"My weekdays usually have <b>three<\/b> parts: research, teaching, and family time. <b>In the morning<\/b>, I focus on research — that's when my mind is fresh, so I do coding or reading. <b>In the afternoon<\/b>, I switch to my TA work: office hours, grading, or a lab section. <b>And in the evening<\/b>, I try to leave work behind — my wife and I cook dinner together and call our families back home. <b>So overall<\/b>, it's a busy routine, but having a clear structure helps me stay balanced.\""},{"t":"h2","h":"Frame 5 — Advantages and Disadvantages (for IELTS Part 3)"},{"t":"box","k":"rule","h":"Opinion in one line → \"On the positive side…\" (1 reason + example) → \"On the downside…\" (1 reason + example) → \"So on balance, I think…\""},{"t":"h2","h":"Anti-Jumping Rules"},{"t":"ul","items":["<b>One idea, then one example.<\/b> Don't give three ideas with no examples.","<b>Finish your sentence before starting a new idea.<\/b> If a new idea pops up, hold it until the next stop of your frame.","<b>Use a connector at every stop.<\/b> Connectors keep you on the map.","<b>If you jump, repair it smoothly<\/b>: \"Sorry, let me go back to my main point…\" / \"Anyway, coming back to what I was saying…\"","<b>Don't add a new topic in the last 10 seconds.<\/b> The last 10 seconds is only for the summary sentence.","<b>Pause between stops, not inside phrases.<\/b> (See the chapter on pauses.)"]},{"t":"h2","h":"Planning Grid (Use for Each Scenario)"},{"t":"tb","head":["Frame","Main point (1 sentence)","Support 1","Support 2 / example","Closing sentence"],"rows":[["_______","_______________________","_______________","_______________","_______________"],["_______","_______________________","_______________","_______________","_______________"],["_______","_______________________","_______________","_______________","_______________"]]},{"t":"box","k":"tip","h":"In the IELTS Part 2, you get one minute to prepare. Write <b>only keywords<\/b> in the frame (not sentences): \"S: lab, spring — T: bug, 3 days — A: compare, library, rerun — R: on time, versions\". Then speak from the keywords."},{"t":"h2","h":"Useful Opening and Closing Lines"},{"t":"tr","rows":[{"n":2378,"bn":"আমি একটা নির্দিষ্ট ঘটনার কথা বলতে চাই।","en":"I'd like to talk about one particular experience.","note":"","say":"I'd like to talk about one particular experience."},{"n":2379,"bn":"এর পেছনে মূলত দুটো কারণ আছে।","en":"There are mainly two reasons behind this.","note":"","say":"There are mainly two reasons behind this."},{"n":2380,"bn":"আমি এটা তিনটা ভাগে বলব।","en":"I'll break this down into three parts.","note":"","say":"I'll break this down into three parts."},{"n":2381,"bn":"প্রথমে একটু প্রেক্ষাপট দিই।","en":"Let me give you a bit of background first.","note":"","say":"Let me give you a bit of background first."},{"n":2382,"bn":"আমার মূল কথা হলো...","en":"My main point is that…","note":"","say":"My main point is that..."},{"n":2383,"bn":"তো এটাই ছিল পুরো ঘটনা।","en":"So that's the whole story.","note":"","say":"So that's the whole story."},{"n":2384,"bn":"পেছনে ফিরে তাকালে, আমি বুঝি যে...","en":"Looking back, I realise that…","note":"","say":"Looking back, I realise that..."},{"n":2385,"bn":"এই অভিজ্ঞতা আমাকে শিখিয়েছে যে...","en":"This experience taught me that…","note":"","say":"This experience taught me that..."},{"n":2386,"bn":"তো সংক্ষেপে বললে...","en":"So, in a nutshell…","note":"","say":"So, in a nutshell..."},{"n":2387,"bn":"এজন্যই এটা আমার কাছে গুরুত্বপূর্ণ।","en":"That's why it matters so much to me.","note":"","say":"That's why it matters so much to me."}]}]},{"id":37,"title":"Speaking Scenarios: PhD Life, Professors, and Research","blocks":[{"t":"p","h":"For every scenario: (1) read the situation, (2) read the useful phrases aloud, (3) choose a frame (PREP, STAR, Past→Present→Future, Three Points), (4) record yourself for <b>one minute<\/b>, (5) score yourself with the self-evaluation sheet at the end of Part D."},{"t":"h2","h":"Your PhD Journey"},{"t":"scen","num":1,"h":"Introduce yourself at a department welcome event","title":"Introduce yourself at a department welcome event"},{"t":"p","h":"<b>Situation:<\/b> You meet new faculty and students over coffee. Someone says, \"So, tell me about yourself.\""},{"t":"box","k":"try","h":"Speak for 1 minute: who you are, where you're from, what you study, what you do outside research. (Frame: Three Points)"},{"t":"tr","rows":[{"n":2388,"bn":"আমি রূপক, কম্পিউটার সায়েন্সে পিএইচডি করছি।","en":"I'm Rupok — I'm a PhD student in computer science.","note":"","say":"I'm Rupok — I'm a PhD student in computer science."},{"n":2389,"bn":"আমি মূলত হার্ডওয়্যার নিরাপত্তা আর সাইড-চ্যানেল আক্রমণ নিয়ে কাজ করি।","en":"I mainly work on hardware security and side-channel attacks.","note":"","say":"I mainly work on hardware security and side-channel attacks."},{"n":2390,"bn":"আমি বাংলাদেশ থেকে এসেছি।","en":"I'm originally from Bangladesh.","note":"","say":"I'm originally from Bangladesh."},{"n":2391,"bn":"আমি এখানে প্রায় দুই বছর ধরে আছি।","en":"I've been here for about two years.","note":"","say":"I've been here for about two years."},{"n":2392,"bn":"আমি একজন টিএ হিসেবেও কাজ করি।","en":"I also work as a teaching assistant.","note":"","say":"I also work as a teaching assistant."},{"n":2393,"bn":"অবসরে আমি রান্না করতে আর হাঁটতে পছন্দ করি।","en":"In my free time, I like cooking and going for walks.","note":"","say":"In my free time, I like cooking and going for walks."},{"n":2394,"bn":"আপনার সাথে পরিচিত হয়ে ভালো লাগল। আপনি কোন বিষয়ে কাজ করেন?","en":"It's great to meet you. What do you work on?","note":"","say":"It's great to meet you. What do you work on?"}]},{"t":"scen","num":2,"h":"Explain your research to a non-expert (the \"elevator pitch\")","title":"Explain your research to a non-expert (the \"elevator pitch\")"},{"t":"p","h":"<b>Situation:<\/b> At a party, a friend's wife asks, \"What exactly do you research?\" She is not in computer science."},{"t":"box","k":"try","h":"1 minute. Avoid jargon. Use an analogy. (Frame: Point → Analogy → Why it matters → Where you are now)"},{"t":"tr","rows":[{"n":2395,"bn":"সহজভাবে বললে, আমি দেখি হ্যাকাররা কিভাবে কোড না ভেঙেই ডিভাইস থেকে গোপন তথ্য চুরি করতে পারে।","en":"Put simply, I study how hackers can steal secrets from devices without breaking the code itself.","note":"","say":"Put simply, I study how hackers can steal secrets from devices without breaking the code itself."},{"n":2396,"bn":"ধরুন, কেউ আপনার পাসওয়ার্ড অনুমান করছে শুধু আপনার কিবোর্ডের শব্দ শুনে।","en":"Imagine someone guessing your password just by listening to your keyboard.","note":"","say":"Imagine someone guessing your password just by listening to your keyboard."},{"n":2397,"bn":"আমরা ডিভাইসের বিদ্যুৎ খরচ বা সংকেত মাপি, তারপর মেশিন লার্নিং দিয়ে প্যাটার্ন খুঁজি।","en":"We measure a device's power consumption or signals, and then use machine learning to find patterns.","note":"","say":"We measure a device's power consumption or signals, and then use machine learning to find patterns."},{"n":2398,"bn":"এটা গুরুত্বপূর্ণ কারণ এই ডিভাইসগুলো আমাদের ব্যাংক কার্ড আর ফোনে আছে।","en":"It matters because these chips are in our bank cards and phones.","note":"","say":"It matters because these chips are in our bank cards and phones."},{"n":2399,"bn":"শেষ লক্ষ্য হলো আরো নিরাপদ ডিভাইস বানানো।","en":"The end goal is to build safer devices.","note":"","say":"The end goal is to build safer devices."},{"n":2400,"bn":"এখন আমি একটা নতুন পেপার নিয়ে কাজ করছি।","en":"Right now, I'm working on a new paper.","note":"","say":"Right now, I'm working on a new paper."}]},{"t":"scen","num":3,"h":"Talk about why you chose a PhD","title":"Talk about why you chose a PhD"},{"t":"p","h":"<b>Situation:<\/b> IELTS-style question, or a new friend asks, \"Why did you decide to do a PhD?\""},{"t":"box","k":"try","h":"1 minute. (Frame: Past → Present → Future)"},{"t":"tr","rows":[{"n":2401,"bn":"আমি সবসময়ই সমস্যা সমাধান করতে ভালোবেসেছি।","en":"I've always loved solving problems.","note":"","say":"I've always loved solving problems."},{"n":2402,"bn":"মাস্টার্স করার সময় গবেষণার প্রতি আমার আগ্রহ জন্মায়।","en":"During my master's, I became interested in research.","note":"","say":"During my master's, I became interested in research."},{"n":2403,"bn":"আমি বুঝলাম যে আমি নতুন কিছু আবিষ্কার করতে চাই, শুধু ব্যবহার না।","en":"I realised I wanted to create new knowledge, not just use existing tools.","note":"","say":"I realised I wanted to create new knowledge, not just use existing tools."},{"n":2404,"bn":"আমার লক্ষ্য হলো অর্থায়নসহ একজন সাইবার নিরাপত্তা গবেষক হওয়া।","en":"My goal is to become a funded cybersecurity researcher.","note":"","say":"My goal is to become a funded cybersecurity researcher."},{"n":2405,"bn":"পিএইচডি কঠিন, কিন্তু আমি প্রতিদিন কিছু না কিছু শিখছি।","en":"A PhD is tough, but I'm learning
