tyle Discussion Questions (practise PREP)"},{"t":"ul","items":["Should university education be free for everyone?","How will AI change the way students learn?","Is it better to work for a big company or a small startup?","Do people today have a better work–life balance than in the past?","Should children learn coding at school?","What are the advantages and disadvantages of studying abroad?","Is online privacy still possible today?","How has social media changed family relationships?","Should governments spend more on scientific research?","Are men and women sharing household work more equally than before?","What makes a good teacher?","Why do some people find it hard to speak a foreign language?"]}]},{"id":39,"title":"Record, Listen, and Score Yourself","blocks":[{"t":"p","h":"Recording is uncomfortable at first — everyone dislikes their recorded voice. But it is the single most effective way to improve, because you hear what the examiner hears."},{"t":"h2","h":"The Recording Routine"},{"t":"ul","items":["<b>Use your phone's voice recorder.<\/b> Name each file with the date and scenario number (e.g., 2026-10-10_S09.m4a).","<b>Speak for exactly one minute<\/b> (use a timer). If you finish early, keep adding examples. If you're still talking at 1:00, finish your sentence and stop.","<b>Listen once for content<\/b>: Did I answer the question? Did I follow my frame? Did I jump?","<b>Listen a second time for language<\/b>: tenses, -s endings, articles, connectors, pronunciation, pauses.","<b>Transcribe 20 seconds<\/b> (write exactly what you said, including \"umm\"). This shows you the real errors.","<b>Rewrite<\/b> those 20 seconds correctly, then record the same topic again."]},{"t":"h2","h":"Self-Evaluation Rubric (based on IELTS band descriptors)"},{"t":"tb","head":["Criterion","Band 6 (where you are)","Band 7 (target)","Check yourself"],"rows":[["Fluency &amp; Coherence","willing to speak at length, but some repetition, self-correction, hesitation; connectors not always appropriate","speaks at length without noticeable effort; some language-related hesitation; uses a range of connectors flexibly","How many \"umm/aaa\"? Did I jump? How many different connectors?"],["Lexical Resource","enough vocabulary to discuss topics; some inappropriate word choice; paraphrases with some success","uses vocabulary flexibly; some less common words and idioms; aware of collocation; paraphrases effectively","Any collocations? Any idiom? Did I repeat the same words?"],["Grammatical Range &amp; Accuracy","mix of simple and complex sentences, limited flexibility; frequent errors in complex structures","range of complex structures with some flexibility; frequently error-free sentences","Perfect tenses correct? Conditionals? Relative clauses? Agreement -s?"],["Pronunciation","generally understood; mispronunciation of individual words or sounds reduces clarity at times","shows all positive features of Band 6 and some of Band 8: effective use of stress, intonation, chunking","Sounds v/w/z/θ? Word stress? Did I pause in the right places?"]]},{"t":"h2","h":"One-Minute Scorecard (copy this for every recording)"},{"t":"tb","head":["Item","Score (0–2)","Notes"],"rows":[["Answered the question in the first sentence","",""],["Followed a frame (no jumping)","",""],["Used 5+ different connectors","",""],["Used at least one present perfect correctly","",""],["No missing -s (plurals, he/she verbs)","",""],["Articles (a/an/the) mostly correct","",""],["One collocation or idiom used naturally","",""],["Fewer than 3 \"umm/aaa\" fillers","",""],["Pauses at phrase boundaries (not mid-phrase)","",""],["Difficult sounds (v, w, z, θ, ð, s/ʃ) clear","",""],["Word stress correct on long words","",""],["Ended with a summary sentence","",""],["<b>Total (out of 24)<\/b>","","18+ ≈ Band 7 control"]]},{"t":"h2","h":"Error Log"},{"t":"p","h":"Keep a running list of your repeated errors. After two weeks, you'll see your top 5 patterns — focus on those."},{"t":"tb","head":["Date","What I said","Correct version","Type (tense / -s / article / prep / pronunciation / connector)"],"rows":[["","I am here since two years","I've been here for two years","tense"],["","discuss about the plan","discuss the plan","preposition"],["","","",""],["","","",""],["","","",""],["","","",""]]},{"t":"h2","h":"Fluency Measurements"},{"t":"p","h":"Track these numbers weekly:"},{"t":"ul","items":["<b>Words per minute (wpm):<\/b> count the words in your 1-minute transcript. Band 6 speakers often produce 90–110 wpm with many pauses; aim for a comfortable <b>120–150 wpm<\/b> with clean pauses. Faster is <i>not<\/i> always better — clarity first.","<b>Filler count:<\/b> number of \"umm/aaa/like\" per minute. Target: under 3.","<b>Self-corrections:<\/b> number of times you restarted a sentence. Target: under 2.","<b>Longest smooth stretch:<\/b> the longest time you spoke without an unplanned pause. Target: 15+ seconds."]},{"t":"box","k":"tip","h":"You can use speech-to-text (for example, the dictation feature on your phone or laptop) to get a rough transcript. If it writes the wrong word, that's useful information — it often means your pronunciation of that word was unclear."},{"t":"h2","h":"Get Outside Feedback"},{"t":"ul","items":["Ask a colleague or friend to listen to one recording a week and tell you <b>one thing that was hard to understand<\/b>.","Join a conversation group or Toastmasters club on campus — regular speaking in front of people builds fluency fast.","In IELTS practice, ask a teacher to score you with the official band descriptors once a month."]}]}]},{"title":"Part E","sub":"Pronunciation, Pauses, and Fluency — sound clear, calm, and natural","chapters":[{"id":40,"title":"The Sounds of English for Bengali Speakers","blocks":[{"t":"p","h":"Your goal is not a perfect American or British accent. Your goal is <b>clarity<\/b>: the listener should understand you without effort. A few specific sounds and stress patterns cause most of the misunderstanding for Bengali speakers. Fix these and your pronunciation score improves quickly."},{"t":"h2","h":"The Big Seven Problem Sounds"},{"t":"h3","h":"1. /v/ vs /w/ vs /b/ vs /bh/"},{"t":"p","h":"Bengali has ভ (bh, aspirated) and ব (b), but no true /v/ or /w/. So \"very\" often becomes \"bheri\" and \"wine\" becomes \"bhine\"."},{"t":"box","k":"rule","h":"<b>/v/<\/b> — touch your <b>top teeth<\/b> to your <b>lower lip<\/b> and <b>buzz<\/b>. Feel the vibration on your lip.<br><b>/w/<\/b> — <b>round your lips<\/b> like a small \"o\" (like blowing out a candle), no teeth contact, then open.<br><b>/b/<\/b> — both lips together, then release. No puff of air (not ভ)."},{"t":"pr","rows":[{"w":"very / wary / berry","ipa":"/ˈveri/ /ˈweəri/ /ˈberi/","bn":"ভেরি / ওয়েয়ারি / বেরি","tip":"3 different sounds","say":"very, wary, berry","q":"very"},{"w":"vest / west / best","ipa":"/vest/ /west/ /best/","bn":"ভেস্ট্‌ / ওয়েস্ট্‌ / বেস্ট্‌","tip":"","say":"vest, west, best","q":"vest"},{"w":"vine / wine","ipa":"/vaɪn/ /waɪn/","bn":"ভাইন্‌ / ওয়াইন্‌","tip":"","say":"vine, wine","q":"vine"},{"w":"veil / whale / bale","ipa":"/veɪl/ /weɪl/ /beɪl/","bn":"ভেইল্‌ / ওয়েইল্‌ / বেইল্‌","tip":"","say":"veil, whale, bale","q":"veil"},{"w":"vote / boat","ipa":"/vəʊt/ /bəʊt/","bn":"ভোউট্‌ / বোউট্‌","tip":"","say":"vote, boat","q":"vote"},{"w":"vowel","ipa":"/ˈvaʊəl/","bn":"ভাউয়াল্‌","tip":"starts with /v/","say":"vowel","q":"vowel"},{"w":"work / walk","ipa":"/wɜːk/ /wɔːk/","bn":"ওয়ার্ক্‌ / ওয়াক্‌","tip":"round lips for /w/","say":"work, walk","q":"work"},{"w":"we / view","ipa":"/wiː/ /vjuː/","bn":"উই / ভিউ","tip":"","say":"we, view","q":"we"}]},{"t":"p","h":"Quick practice (more in the tongue-twister chapter):"},{"t":"ul","items":["<i>Very well, we will vote for Victor.<\/i>","<i>Vivian wore a violet vest on a wet Wednesday.<\/i>"]},{"t":"h3","h":"2. /z/ vs <span class=\"ipa\">/dʒ/<\/span> (জ)"},{"t":"p","h":"Bengali speakers often say \"zoo\" like \"joo\" and \"zero\" like \"jero\". English /z/ is just /s/ with voice — a buzzing bee."},{"t":"box","k":"rule","h":"Start with a long \"sssss\", then add your voice (hum) without moving your tongue: \"zzzzz\". The tongue doesn't touch the roof of your mouth (that's <span class=\"ipa\">/dʒ/<\/span>)."},{"t":"pr","rows":[{"w":"zoo / Jew","ipa":"/zuː/ /dʒuː/","bn":"জ়ু / জু","tip":"","say":"zoo, Jew","q":"zoo"},{"w":"zero","ipa":"/ˈzɪərəʊ/","bn":"জ়িয়ারোউ","tip":"","say":"zero","q":"zero"},{"w":"lazy","ipa":"/ˈleɪzi/","bn":"লেইজ়ি","tip":"","say":"lazy","q":"lazy"},{"w":"busy","ipa":"/ˈbɪzi/","bn":"বিজ়ি","tip":"","say":"busy","q":"busy"},{"w":"reason","ipa":"/ˈriːzn/","bn":"রীজ়ন্‌","tip":"","say":"reason","q":"reason"},{"w":"music","ipa":"/ˈmjuːzɪk/","bn":"মিউজ়িক্‌","tip":"","say":"music","q":"music"},{"w":"analyse","ipa":"/ˈænəlaɪz/","bn":"অ্যানালাইজ়্‌","tip":"","say":"analyse","q":"analyse"},{"w":"dozen","ipa":"/ˈdʌzn/","bn":"ডাজ়ন্‌","tip":"","say":"dozen","q":"dozen"}]},{"t":"h3","h":"3. /s/ vs <span class=\"ipa\">/ʃ/<\/span> (স vs শ)"},{"t":"p","h":"In many Bengali dialects, স and শ are pronounced the same (often as শ). English treats them as <b>different sounds<\/b> that change meaning."},{"t":"box","k":"rule","h":"<b>/s/<\/b> — tongue tip near the top teeth, lips spread (smile), air hisses: \"sss\". <b><span class=\"ipa\">/ʃ/<\/span><\/b> — tongue pulled back, lips pushed forward (rounded): \"shhh\" (like telling someone to be quiet)."},{"t":"pr","rows":[{"w":"see / she","ipa":"/siː/ /ʃiː/","bn":"সী / শী","tip":"","say":"see, she","q":"see"},{"w":"sip / ship","ipa":"/sɪp/ /ʃɪp/","bn":"সিপ্‌ / শিপ্‌","tip":"","say":"sip, ship","q":"sip"},{"w":"save / shave","ipa":"/seɪv/ /ʃeɪv/","bn":"সেইভ্‌ / শেইভ্‌","tip":"","say":"save, shave","q":"save"},{"w":"sort / short","ipa":"/sɔːt/ /ʃɔːt/","bn":"সোর্ট্‌ / শোর্ট্‌","tip":"","say":"sort, short","q":"sort"},{"w":"same / shame","ipa":"/seɪm/ /ʃeɪm/","bn":"সেইম্‌ / শেইম্‌","tip":"","say":"same, shame","q":"same"},{"w":"sign / shine","ipa":"/saɪn/ /ʃaɪn/","bn":"সাইন্‌ / শাইন্‌","tip":"","say":"sign, shine","q":"sign"},{"w":"system","ipa":"/ˈsɪstəm/","bn":"সিস্টাম্‌","tip":"both /s/","say":"system","q":"system"},{"w":"session","ipa":"/ˈseʃn/","bn":"সেশন্‌","tip":"/s/ then <span class=\"ipa\">/ʃ/<\/span>","say":"session","q":"session"}]},{"t":"h3","h":"4. <span class=\"ipa\">/θ/<\/span> and <span class=\"ipa\">/ð/<\/span> (the \"th\" sounds)"},{"t":"p","h":"Bengali থ and দ are made with the tongue behind the teeth. English \"th\" needs the <b>tongue between the teeth<\/b>."},{"t":"box","k":"rule","h":"Put the tip of your tongue lightly <b>between your teeth<\/b> (you can see it in a mirror). <b><span class=\"ipa\">/θ/<\/span><\/b> = blow air, no voice (think, three, method). <b><span class=\"ipa\">/ð/<\/span><\/b> = same position with voice (this, the, mother)."},{"t":"pr","rows":[{"w":"think / sink / tink","ipa":"/θɪŋk/ /sɪŋk/","bn":"থিংক্‌ / সিংক্‌","tip":"tongue out!","say":"think, sink, tink","q":"think"},{"w":"three / tree","ipa":"/θriː/ /triː/","bn":"থ্রী / ট্রী","tip":"","say":"three, tree","q":"three"},{"w":"thank / tank","ipa":"/θæŋk/ /tæŋk/","bn":"থ্যাংক্‌ / ট্যাংক্‌","tip":"","say":"thank, tank","q":"thank"},{"w":"method","ipa":"/ˈmeθəd/","bn":"মেথাড্‌","tip":"","say":"method","q":"method"},{"w":"theory / theoretical","ipa":"/ˈθɪəri/ /ˌθɪəˈretɪkl/","bn":"থিয়ারি / থিয়ারেটিকাল্‌","tip":"","say":"theory, theoretical","q":"theory"},{"w":"the / this / that","ipa":"/ðə/ /ðɪs/ /ðæt/","bn":"দা / দিস্‌ / দ্যাট্‌","tip":"voiced","say":"the, this, that","q":"the"},{"w":"weather / whether","ipa":"/ˈweðə/","bn":"ওয়েদা(র্‌)","tip":"same sound!","say":"weather, whether","q":"weather"},{"w":"breathe / breath","ipa":"/briːð/ /breθ/","bn":"ব্রীদ্‌ / ব্রেথ্‌","tip":"","say":"breathe, breath","q":"breathe"}]},{"t":"box","k":"tip","h":"In fast speech, \"the\" is almost always weak: <span class=\"ipa\">/ðə/<\/span> before consonants (the lab), <span class=\"ipa\">/ði/<\/span> before vowels (the end). Don't stress it."},{"t":"h3","h":"5. /f/ vs /ph/"},{"t":"p","h":"Bengali ফ is often pronounced as aspirated \"ph\" (প + হ). English /f/ is made with <b>teeth on lip<\/b>, like /v/ but without voice."},{"t":"pr","rows":[{"w":"fine / pine","ipa":"/faɪn/ /paɪn/","bn":"ফাইন্‌ / পাইন্‌","tip":"teeth on lower lip","say":"fine, pine","q":"fine"},{"w":"coffee","ipa":"/ˈkɒfi/","bn":"কফি","tip":"","say":"coffee","q":"coffee"},{"w":"phone","ipa":"/fəʊn/","bn":"ফোউন্‌","tip":"\"ph\" spelling = /f/","say":"phone","q":"phone"},{"w":"feedback","ipa":"/ˈfiːdbæk/","bn":"ফীড্‌ব্যাক্‌","tip":"","say":"feedback","q":"feedback"}]},{"t":"h3","h":"6. Adding a vowel before s + consonant (the \"iskul\" problem)"},{"t":"p","h":"Bengali doesn't allow words to start with s + consonant, so many speakers add a vowel: \"iskul\", \"istation\", \"ispeak\". English needs the cluster directly."},{"t":"box","k":"rule","h":"Start with a long \"sss\" and slide straight into the next consonant: \"ssss-kool\" → \"school\". Don't open your mouth before the s."},{"t":"pr","rows":[{"w":"school","ipa":"/skuːl/","bn":"স্কূল্‌","tip":"not ইস্কুল","say":"school","q":"school"},{"w":"station","ipa":"/ˈsteɪʃn/","bn":"স্টেইশন্‌","tip":"not ইস্টেশন","say":"station","q":"station"},{"w":"student","ipa":"/ˈstjuːdnt/","bn":"স্টিউডেন্ট্‌","tip":"","say":"student","q":"student"},{"w":"speak / special","ipa":"/spiːk/ /ˈspeʃl/","bn":"স্পীক্‌ / স্পেশাল্‌","tip":"","say":"speak, special","q":"speak"},{"w":"study / stress","ipa":"/ˈstʌdi/ /stres/","bn":"স্টাডি / স্ট্রেস্‌","tip":"","say":"study, stress","q":"study"},{"w":"screen / script","ipa":"/skriːn/ /skrɪpt/","bn":"স্ক্রীন্‌ / স্ক্রিপ্ট্‌","tip":"","say":"screen, script","q":"screen"},{"w":"smart / small","ipa":"/smɑːt/ /smɔːl/","bn":"স্মার্ট্‌ / স্মল্‌","tip":"","say":"smart, small","q":"smart"},{"w":"slide / sleep","ipa":"/slaɪd/ /sliːp/","bn":"স্লাইড্‌ / স্লীপ্‌","tip":"","say":"slide, sleep","q":"slide"}]},{"t":"h3","h":"7. Vowel length and the schwa <span class=\"ipa\">/ə/<\/span>"},{"t":"p","h":"English has <b>short and long vowels<\/b> that change meaning (ship/sheep, full/fool), and an unstressed vowel <span class=\"ipa\">/ə/<\/span> (schwa) that appears in almost every long word. Bengali speakers often pronounce every vowel fully, which makes speech sound \"flat\" and syllable-timed."},{"t":"box","k":"rule","h":"In multi-syllable words, only the <b>stressed syllable<\/b> has a full vowel. The others are reduced to <span class=\"ipa\">/ə/<\/span> or <span class=\"ipa\">/ɪ/<\/span>: <i>com-PU-ter<\/i> <span class=\"ipa\">/kəmˈpjuːtə/<\/span>, <i>a-BOUT<\/i> <span class=\"ipa\">/əˈbaʊt/<\/span>, <i>PRO-blem<\/i> <span class=\"ipa\">/ˈprɒbləm/<\/span>, <i>pho-TOG-ra-pher<\/i> <span class=\"ipa\">/fəˈtɒɡrəfə/<\/span>."},{"t":"pr","rows":[{"w":"about","ipa":"/əˈbaʊt/","bn":"আবাউট্‌","tip":"first a = <span class=\"ipa\">/ə/<\/span>","say":"about","q":"about"},{"w":"computer","ipa":"/kəmˈpjuːtə/","bn":"কাম্‌পিউটা(র্‌)","tip":"","say":"computer","q":"computer"},{"w":"banana","ipa":"/bəˈnɑːnə/","bn":"বানানা","tip":"1st and 3rd a = <span class=\"ipa\">/ə/<\/span>","say":"banana","q":"banana"},{"w":"problem","ipa":"/ˈprɒbləm/","bn":"প্রব্‌লাম্‌","tip":"","say":"problem","q":"problem"},{"w":"support","ipa":"/səˈpɔːt/","bn":"সাপোর্ট্‌","tip":"","say":"support","q":"support"},{"w":"today","ipa":"/təˈdeɪ/","bn":"টাডেই","tip":"","say":"today","q":"today"},{"w":"police","ipa":"/pəˈliːs/","bn":"পালীস্‌","tip":"","say":"police","q":"police"},{"w":"second","ipa":"/ˈsekənd/","bn":"সেকান্ড্‌","tip":"","say":"second","q":"second"}]},{"t":"h2","h":"Ending Sounds: Don't Drop Them"},{"t":"p","h":"Bengali speakers sometimes drop final consonants, especially in clusters (-sts, -ksts, -nds, -lt). Final sounds carry grammar: plural -s, past -ed, third-person -s."},{"t":"tr","rows":[{"n":2786,"bn":"সে প্রতিদিন হাঁটে।","en":"He walks every day.","note":"<span class=\"ipa\">/wɔːks/<\/span> — say the /s/","say":"He walks every day."},{"n":2787,"bn":"সে গতকাল হেঁটেছিল।","en":"He walked yesterday.","note":"<span class=\"ipa\">/wɔːkt/<\/span> — say the /t/","say":"He walked yesterday."},{"n":2788,"bn":"আমি পরীক্ষাগুলো শেষ করেছি।","en":"I've finished the tests.","note":"/tests/ — hard cluster, slow down","say":"I've finished the tests."},{"n":2789,"bn":"সে আমার টেক্সটের উত্তর দেয় না।","en":"She doesn't reply to my texts.","note":"/teksts/","say":"She doesn't reply to my texts."},{"n":2790,"bn":"এই মাসগুলো ব্যস্ত ছিল।","en":"These months have been busy.","note":"<span class=\"ipa\">/mʌnθs/<\/span>","say":"These months have been busy."},{"n":2791,"bn":"আমি তাদের হাত ধরলাম।","en":"I held their hands.","note":"<span class=\"ipa\">/hændz/<\/span>","say":"I held their hands."},{"n":2792,"bn":"এটা পুরোপুরি আমার দোষ।","en":"It was entirely my fault.","note":"<span class=\"ipa\">/fɔːlt/<\/span>","say":"It was entirely my fault."}]},{"t":"h2","h":"Mouth Warm-up (2 minutes before speaking practice)"},{"t":"ul","items":["<b>Lip trills<\/b> — blow air through relaxed lips (\"brrrr\") for 10 seconds.","<b>Tongue circles<\/b> — run your tongue around your teeth, 5 times each direction.","<b>Big vowels<\/b> — say \"ee – ah – oo\" slowly, exaggerating lip shape: wide smile, open, round.","<b>Minimal pairs<\/b> — 5 quick pairs: very/wary, see/she, think/sink, zoo/Jew, ship/sheep.","<b>Yawn and sigh<\/b> — relaxes the throat and lowers your pitch."]}]},{"id":41,"title":"Stress, Rhythm, Intonation, and Connected Speech","blocks":[{"t":"h2","h":"Word Stress"},{"t":"p","h":"Every English word of two or more syllables has one <b>stressed<\/b> syllable: <b>louder, longer, higher<\/b>. Wrong stress makes a word hard to recognise even if the sounds are right."},{"t":"tb","head":["Pattern","Rule of thumb","Examples"],"rows":[["2-syllable nouns &amp; adjectives","stress the 1st syllable","<b>TA<\/b>ble, <b>STU<\/b>dent, <b>HAP<\/b>py, <b>PAR<\/b>ent"],["2-syllable verbs","often stress the 2nd","be<b>GIN<\/b>, de<b>CIDE<\/b>, re<b>LAX<\/b>, ex<b>PLAIN<\/b>"],["-tion, -sion, -ic, -ical, -ity, -ian","stress just BEFORE the ending","infor<b>MA<\/b>tion, eco<b>NOM<\/b>ic, uni<b>VER<\/b>sity, mu<b>SI<\/b>cian"],["-ate, -ise/-ize, -graphy, -logy","stress 3rd from the end","<b>COM<\/b>municate, <b>OR<\/b>ganise, pho<b>TOG<\/b>raphy, tech<b>NOL<\/b>ogy"],["compound nouns","stress the 1st part","<b>LAP<\/b>top, <b>KEY<\/b>board, <b>BUS<\/b> stop, <b>POW<\/b>er supply"],["phrasal verbs","stress the particle","turn <b>ON<\/b>, give <b>UP<\/b>, find <b>OUT<\/b>"],["-ee, -eer, -ese, -ique","stress the ending","employ<b>EE<\/b>, engi<b>NEER<\/b>, Japa<b>NESE<\/b>, tech<b>NIQUE<\/b>"]]},{"t":"h2","h":"Sentence Stress: Content Words vs Function Words"},{"t":"p","h":"English is <b>stress-timed<\/b>: stressed syllables come at roughly regular intervals, and unstressed words are squeezed in between. Bengali is closer to syllable-timed, so Bengali speakers give equal weight to every word. That sounds robotic and makes the important words harder to hear."},{"t":"box","k":"rule","h":"STRESS content words (nouns, main verbs, adjectives, adverbs, negatives, question words): <b>I've FINished the rePORT<\/b>.<br>REDUCE function words (a, the, to, of, and, for, can, have, was, at, from): <span class=\"ipa\">/ə/<\/span> <span class=\"ipa\">/ðə/<\/span> <span class=\"ipa\">/tə/<\/span> <span class=\"ipa\">/əv/<\/span> <span class=\"ipa\">/ən/<\/span> <span class=\"ipa\">/fə/<\/span> <span class=\"ipa\">/kən/<\/span> <span class=\"ipa\">/həv/<\/span> <span class=\"ipa\">/wəz/<\/span>"},{"t":"tb","head":["Written","Natural spoken (weak forms)"],"rows":[["I want to go to the lab.","I <b>WANT<\/b> tə <b>GO<\/b> tə thə <b>LAB<\/b>."],["What do you want to do?","<b>WHAT<\/b> d'yə <b>WANT<\/b> tə <b>DO<\/b>? → \"Whaddaya wanna do?\" (informal)"],["A cup of tea and a piece of cake","ə <b>CUP<\/b> ə <b>TEA<\/b> ən ə <b>PIECE<\/b> ə <b>CAKE<\/b>"],["I can swim, but I can't dance.","I kən <b>SWIM<\/b>, but I <b>CAN'T DANCE<\/b>. (\"can\" weak, \"can't\" strong)"],["I was there for an hour.","I wəz <b>THERE<\/b> fər ən <b>HOUR<\/b>."],["She has been working since two.","She's bin <b>WORK<\/b>ing since <b>TWO<\/b>."]]},{"t":"h2","h":"Contrastive Stress (changes meaning)"},{"t":"tb","head":["Sentence","Meaning"],"rows":[["<b>I<\/b> didn't say he stole the money.","Someone else said it."],["I <b>didn't<\/b> say he stole the money.","I deny saying it."],["I didn't <b>say<\/b> he stole the money.","I implied it, but didn't say it."],["I didn't say <b>he<\/b> stole the money.","Someone else stole it."],["I didn't say he <b>stole<\/b> the money.","He borrowed it, maybe."],["I didn't say he stole the <b>money<\/b>.","He stole something else."]]},{"t":"box","k":"try","h":"Read the six sentences aloud and make the meaning clear only with stress. Then answer this with contrastive stress: \"Did you submit the paper on Monday?\" → \"No, I submitted it on <b>TUES<\/b>day.\" / \"No, I submitted the <b>SLIDES<\/b> on Monday.\""},{"t":"h2","h":"Intonation: The Music of English"},{"t":"tb","head":["Pattern","When","Example"],"rows":[["Falling ↘","statements, wh- questions, commands, sure tag questions","I'm from Bangladesh.↘ Where do you live?↘ It's cold, isn't it?↘"],["Rising ↗","yes/no questions, surprise, checking, unsure tag questions","Are you ready?↗ Really?↗ You're coming, aren't you?↗"],["Fall-rise ↘↗","politeness, hesitation, \"there's more\", contrast","Well,↘↗ I'm not sure… The food was good,↘↗ but…"],["List","rise on each item, fall on the last","I need eggs↗, milk↗, and bread.↘"]]},{"t":"box","k":"warn","h":"A flat, monotone voice sounds bored or nervous. Bengali also uses rising tone for many statements; in English, a rising statement sounds like a question or like you are unsure. <b>End statements with a fall<\/b> to sound confident."},{"t":"h2","h":"Connected Speech: How Natives Link Words"},{"t":"p","h":"Natives don't speak word by word; they link words into smooth phrases. Understanding this helps your listening; using it helps your fluency."},{"t":"tb","head":["Feature","What happens","Examples"],"rows":[["Linking (consonant → vowel)","final consonant joins the next vowel","turn‿off → \"tur-noff\"; an‿apple → \"a-napple\"; pick‿it‿up → \"pi-ki-tup\""],["Linking /r/","r is pronounced before a vowel (UK)","far‿away, after‿all, more‿and more"],["Intrusive /w/, /j/","a glide appears between vowels","go‿(w)out, do‿(w)it, I‿(j)am, the‿(j)end"],["Elision","/t/ or /d/ disappears between consonants","next day → \"nex day\"; last week → \"las week\"; I don't know → \"I dunno\""],["Assimilation","sounds change to fit neighbours","ten boys → \"tem boys\"; good girl → \"goog girl\"; did you → \"didju\"; would you → \"wouldju\"; don't you → \"doncha\""],["Contractions","always use them in speech","I am → I'm; I have → I've; will not → won't; would have → would've (\"woulda\")"]]},{"t":"tr","rows":[{"n":2793,"bn":"এটা বন্ধ করো।","en":"Turn it off.","note":"\"tur-ni-toff\"","say":"Turn it off."},{"n":2794,"bn":"এটা তুলে নাও।","en":"Pick it up.","note":"\"pi-ki-tup\"","say":"Pick it up."},{"n":2795,"bn":"আমি জানি না।","en":"I don't know.","note":"\"I dunno\" (casual)","say":"I don't know."},{"n":2796,"bn":"তুমি কি খেয়েছ?","en":"Did you eat?","note":"\"Didja eat?\" (casual)","say":"Did you eat?"},{"n":2797,"bn":"তুমি কি আসবে?","en":"Would you like to come?","note":"\"Wouldja like tə come?\"","say":"Would you like to come?"},{"n":2798,"bn":"আমি যেতে চাই।","en":"I want to go.","note":"\"I wanna go.\" (casual)","say":"I want to go."},{"n":2799,"bn":"আমাকে যেতে হবে।","en":"I have to go. / I've got to go.","note":"\"I hafta go.\" / \"I gotta go.\" (casual)","say":"I have to go.. I've got to go."},{"n":2800,"bn":"পরের সপ্তাহে","en":"next week","note":"\"nex week\"","say":"next week"},{"n":2801,"bn":"এক কাপ চা","en":"a cup of tea","note":"\"ə cuppə tea\"","say":"a cup of tea"}]},{"t":"box","k":"note","h":"Use the casual forms (wanna, gonna, gotta) in conversation, not in presentations or formal IELTS answers. But you must <b>recognise<\/b> them when you listen."}]},{"id":42,"title":"Pauses, Breathing, and Chunking","blocks":[{"t":"p","h":"You said <b>pauses<\/b> are one of your weak points. There are two kinds of pauses: <b>good pauses<\/b> (planned, at the end of a thought group, for emphasis) and <b>bad pauses<\/b> (in the middle of a phrase while searching for a word or grammar). Examiners penalise bad pauses, not good ones. The goal is to move your pauses to the right places."},{"t":"h2","h":"Thought Groups (Chunking)"},{"t":"p","h":"A <b>thought group<\/b> is a short phrase that expresses one idea, usually 3–7 words. Natives pause briefly <b>between<\/b> thought groups, never inside them."},{"t":"box","k":"rule","h":"Pause after: a subject phrase that's long · an introductory phrase (In my opinion, / …) · a clause (When I came here, / …) · each list item · before connectors (…, / but… or …, / so…) · after a sentence.<br>Never pause between: article + noun (the / lab ✗) · verb + object (I need / money ✗) · preposition + noun (in / the morning ✗)"},{"t":"tb","head":["Bad pauses (inside phrases)","Good pauses (between thought groups)"],"rows":[["I have been / working on / this project for / two years.","I've been working on this project / for two years."],["When I / came here / I didn't / know anyone.","When I came here, / I didn't know anyone."],["My main / research is about / side-channel / attacks.","My main research / is about side-channel attacks."]]},{"t":"box","k":"try","h":"Mark these sentences with / for pauses, then read them aloud slowly, then at normal speed:<br>\"When I first started my PhD / I had no idea / how much reading it would involve. / In the first semester alone / I must have read / about fifty papers. / Looking back, / it was exhausting, / but it gave me / a really strong foundation.\""},{"t":"h2","h":"Pause for Emphasis"},{"t":"p","h":"A short silence <b>before<\/b> an important word makes it stand out. Use this in presentations and Part 2 answers."},{"t":"box","k":"note","h":"\"And the result was… / <b>ninety-eight percent<\/b> accuracy.\" / \"The one thing I learned was this: / <b>never give up<\/b>.\""},{"t":"h2","h":"Breathing for Speaking"},{"t":"p","h":"Many nervous speakers breathe high in the chest, run out of air mid-sentence, then pause in the wrong place to gasp. Breathing from the diaphragm gives you longer, steadier phrases."},{"t":"ul","items":["<b>Belly breathing:<\/b> put one hand on your chest, one on your stomach. Breathe in through your nose for 4 counts — only the stomach hand should move. Breathe out slowly for 6 counts.","<b>Breathe at the thought-group boundary:<\/b> take a quick, silent breath at each / mark. Don't wait until you are out of air.","<b>Counting exercise:<\/b> take a full breath and count out loud \"one, two, three…\" at a steady pace. Note your number. Practise daily — aim to reach 25–30 with a clear voice.","<b>Hissing exercise:<\/b> breathe in, then release air with a steady \"sssss\" for as long as possible. Aim for 20+ seconds. This trains breath control.","<b>Box breathing before speaking (for nerves):<\/b> inhale 4 – hold 4 – exhale 4 – hold 4. Repeat 3 times before a presentation or the IELTS test."]},{"t":"h2","h":"Replace Bad Pauses with Smart Fillers"},{"t":"p","h":"When you need time <b>inside<\/b> a sentence, don't freeze — use a short phrase that sounds like thinking and keeps the rhythm (see the chapter on fillers): <i>\"…which is, how can I put it, quite unusual…\"<\/i>, <i>\"…the main thing is…\"<\/i>, <i>\"…let's say, about fifty people…\"<\/i>"},{"t":"h2","h":"Speed Control"},{"t":"ul","items":["Nervous speakers speed up. Slow down <b>slightly<\/b> — clarity beats speed.","Slow down for: numbers, names, technical terms, your main point.","Speed up slightly for: examples, background details, connectors.","If you notice you're rushing, finish your sentence, <b>pause, breathe<\/b>, and continue a little slower. Nobody will notice a pause; everyone notices rushing."]}]},{"id":43,"title":"Fluency Training Methods","blocks":[{"t":"h2","h":"Shadowing (the most powerful technique)"},{"t":"p","h":"Shadowing means listening to a native speaker and repeating <b>at the same time<\/b> (or with a half-second delay), copying their rhythm, stress, linking, and intonation."},{"t":"ul","items":["<b>Step 1:<\/b> Choose 1–2 minutes of clear audio with a transcript (TED talk, podcast, IELTS sample answer, a lecture in your field).","<b>Step 2:<\/b> Listen once while reading the transcript. Mark stressed words and pauses.","<b>Step 3:<\/b> Read the transcript aloud along with the audio (<i>read-along<\/i>).","<b>Step 4:<\/b> Shadow without the transcript — just copy what you hear, a half second behind.","<b>Step 5:<\/b> Record yourself shadowing and compare with the original.","<b>Do it daily for 5–10 minutes.<\/b> Use the same audio for 3–5 days until it feels natural, then change."]},{"t":"h2","h":"Other Fluency Drills"},{"t":"tb","head":["Drill","How","Why"],"rows":[["4-3-2","Talk about the same topic for 4 min, then 3 min, then 2 min","Each repetition gets faster and smoother; trains fluency under time pressure"],["Describe what you see","While walking or cooking, describe everything aloud in English","Builds automatic vocabulary retrieval"],["Think in English","Narrate your thoughts silently in English for 10 minutes a day","Reduces translation delay"],["Mirror talk","Speak to a mirror for 2 minutes, watch your mouth and face","Improves sound formation and confidence"],["Explain-to-a-child","Explain your research in simple words, as if to a 10-year-old","Trains paraphrasing and clarity"],["Random topic roulette","Pick a random word (e.g., \"umbrella\") and speak 1 minute about it","Trains idea generation without jumping (use a frame!)"],["Translation sprint","Read 10 Bengali sentences from Part A, translate aloud in 2 seconds each","Builds speed with correct grammar"],["Repeat and expand","Say a short sentence, then expand it 3 times: \"I cook.\" → \"I cook dinner.\" → \"I cook dinner with my wife.\" → \"I usually cook dinner with my wife on weekdays.\"","Builds complex sentences step by step"],["Record a voice diary","Every night, record 2 minutes about your day","Daily habit; track progress over months"],["Conversation exchange","Talk with a native speaker or a language partner weekly","Real interaction, listening, reacting"]]},{"t":"h2","h":"Confidence and Mindset"},{"t":"ul","items":["<b>Fluency first, accuracy second (in practice).<\/b> When practising, keep speaking even if you make mistakes. Correct afterwards from the recording.","<b>Mistakes are data, not failure.<\/b> Every mistake you notice is one you can fix.","<b>Prepare \"personal stories.\"<\/b> Have 8–10 short stories ready (a challenge, a success, a trip, a person, a decision, a mistake) — they fit almost any Part 2 question.","<b>Smile.<\/b> It relaxes your face and changes your tone — people sound friendlier when they smile.","<b>Accept your accent.<\/b> An accent is fine; unclear sounds are the problem. Aim to be clear, not native."]}]},{"id":44,"title":"Tongue Twisters: 52 Complex Drills by Target Sound","blocks":[{"t":"p","h":"Tongue twisters train your mouth muscles to move quickly and precisely between difficult sounds. They are grouped by the sounds that are hardest for Bengali speakers."},{"t":"box","k":"rule","h":"How to practise: (1) Say it <b>very slowly<\/b>, every sound perfect. (2) Say it 3 times at normal speed. (3) Say it 3 times fast. (4) If you stumble, slow down again. Speed is the <b>last<\/b> step, never the first. Record the fast version once a week."},{"t":"h2","h":"Level 1 — Warm-up (one or two target sounds)"},{"t":"tw","rows":[{"n":1,"t":"Red lorry, yellow lorry, red lorry, yellow lorry.","tgt":"/r/ vs /l/","say":"Red lorry, yellow lorry, red lorry, yellow lorry."},{"n":2,"t":"Toy boat, toy boat, toy boat.","tgt":"<span class=\"ipa\">/ɔɪ/<\/span> vs <span class=\"ipa\">/əʊ/<\/span>","say":"Toy boat, toy boat, toy boat."},{"n":3,"t":"Fred fed Ted bread, and Ted fed Fred bread.","tgt":"/f/, /d/","say":"Fred fed Ted bread, and Ted fed Fred bread."},{"n":4,"t":"A proper copper coffee pot.","tgt":"/p/, /k/, /f/","say":"A proper copper coffee pot."},{"n":5,"t":"Six slippery snails slid slowly seaward.","tgt":"s + cluster (no \"i-\")","say":"Six slippery snails slid slowly seaward."},{"n":6,"t":"Good blood, bad blood.","tgt":"<span class=\"ipa\">/ʊ/<\/span> vs <span class=\"ipa\">/ʌ/<\/span> vs <span class=\"ipa\">/æ/<\/span>","say":"Good blood, bad blood."},{"n":7,"t":"Kitty caught the kitten in the kitchen.","tgt":"/k/, <span class=\"ipa\">/tʃ/<\/span>","say":"Kitty caught the kitten in the kitchen."},{"n":8,"t":"Unique New York, unique New York, you know you need unique New York.","tgt":"/j/, /n/","say":"Unique New York, unique New York, you know you need unique New York."}]},{"t":"h2","h":"Level 2 — The /v/, /w/, /b/ Group"},{"t":"tw","rows":[{"n":9,"t":"Vincent vowed vengeance very vehemently.","tgt":"/v/","say":"Vincent vowed vengeance very vehemently."},{"n":10,"t":"Willy's real rear wheel.","tgt":"/w/, /r/, /l/","say":"Willy's real rear wheel."},{"n":11,"t":"Which witch wished which wicked wish?","tgt":"/w/, <span class=\"ipa\">/ɪ/<\/span>, <span class=\"ipa\">/ʃ/<\/span>","say":"Which witch wished which wicked wish?"},{"n":12,"t":"Very well, very well, very well — whether the weather is warm or whether the weather is wet, we'll weather the weather, whatever the weather, whether we like it or not.","tgt":"/v/, /w/, <span class=\"ipa\">/ð/<\/span>","say":"Very well, very well, very well — whether the weather is warm or whether the weather is wet, we'll weather the weather, whatever the weather, whether we like it or not."},{"n":13,"t":"Vivian's violet vase was very valuable, but Wendy's white one was worth more.","tgt":"/v/ vs /w/","say":"Vivian's violet vase was very valuable, but Wendy's white one was worth more."},{"n":14,"t":"Brave Bob's busy brother bought bubbly, but Victor viewed it with worry.","tgt":"/b/, /v/, /w/","say":"Brave Bob's busy brother bought bubbly, but Victor viewed it with worry."}]},{"t":"h2","h":"Level 3 — The /s/, <span class=\"ipa\">/ʃ/<\/span>, /z/ Group"},{"t":"tw","rows":[{"n":15,"t":"She sells seashells by the seashore, and the shells she sells are surely seashells.","tgt":"/s/ vs <span class=\"ipa\">/ʃ/<\/span>","say":"She sells seashells by the seashore, and the shells she sells are surely seashells."},{"n":16,"t":"The sixth sick sheikh's sixth sheep's sick.","tgt":"/s/, <span class=\"ipa\">/ʃ/<\/span>, /ks/, <span class=\"ipa\">/θ/<\/span> — one of the hardest in English","say":"The sixth sick sheikh's sixth sheep's sick."},{"n":17,"t":"Selfish shellfish, selfish shellfish, selfish shellfish.","tgt":"/s/ vs <span class=\"ipa\">/ʃ/<\/span>","say":"Selfish shellfish, selfish shellfish, selfish shellfish."},{"n":18,"t":"Sheena leads, Sheila needs.","tgt":"<span class=\"ipa\">/ʃ/<\/span>, <span class=\"ipa\">/iː/<\/span>","say":"Sheena leads, Sheila needs."},{"n":19,"t":"Stupid superstition, stupid superstition.","tgt":"/s/, /st/, <span class=\"ipa\">/ʃ/<\/span>","say":"Stupid superstition, stupid superstition."},{"n":20,"t":"Fuzzy Wuzzy was a bear; Fuzzy Wuzzy had no hair; Fuzzy Wuzzy wasn't fuzzy, was he?","tgt":"/z/","say":"Fuzzy Wuzzy was a bear; Fuzzy Wuzzy had no hair; Fuzzy Wuzzy wasn't fuzzy, was he?"},{"n":21,"t":"Zany Zara's zebra zigzagged through the zoo zone.","tgt":"/z/ (not জ)","say":"Zany Zara's zebra zigzagged through the zoo zone."},{"n":22,"t":"Several serious scientists systematically studied six sensitive sensors.","tgt":"/s/, /st/, /ns/, /z/","say":"Several serious scientists systematically studied six sensitive sensors."}]},{"t":"h2","h":"Level 4 — The \"th\" Group (<span class=\"ipa\">/θ/<\/span> and <span class=\"ipa\">/ð/<\/span>)"},{"t":"tw","rows":[{"n":23,"t":"I thought a thought, but the thought I thought wasn't the thought I thought I thought.","tgt":"<span class=\"ipa\">/θ/<\/span>, <span class=\"ipa\">/ɔː/<\/span>","say":"I thought a thought, but the thought I thought wasn't the thought I thought I thought."},{"n":24,"t":"Thirty-three thousand thoughtful thinkers thought that thirty-three thinking machines were thinking things through.","tgt":"<span class=\"ipa\">/θ/<\/span>","say":"Thirty-three thousand thoughtful thinkers thought that thirty-three thinking machines were thinking things through."},{"n":25,"t":"Three free throws, three free throws, three free throws.","tgt":"<span class=\"ipa\">/θr/<\/span> vs /fr/","say":"Three free throws, three free throws, three free throws."},{"n":26,"t":"The thirty-three thieves thought that they thrilled the throne throughout Thursday.","tgt":"<span class=\"ipa\">/θ/<\/span>, <span class=\"ipa\">/ð/<\/span>","say":"The thirty-three thieves thought that they thrilled the throne throughout Thursday."},{"n":27,"t":"This, that, these, those — they were there, then they weren't.","tgt":"<span class=\"ipa\">/ð/<\/span>","say":"This, that, these, those — they were there, then they weren't."},{"n":28,"t":"The seething sea ceaseth, and thus the seething sea sufficeth us.","tgt":"/s/ vs <span class=\"ipa\">/ð/<\/span> vs <span class=\"ipa\">/θ/<\/span>","say":"The seething sea ceaseth, and thus the seething sea sufficeth us."},{"n":29,"t":"Both brothers breathe the breath of the weather together.","tgt":"<span class=\"ipa\">/θ/<\/span> vs <span class=\"ipa\">/ð/<\/span>, /br/","say":"Both brothers breathe the breath of the weather together."}]},{"t":"h2","h":"Level 5 — Clusters and Endings"},{"t":"tw","rows":[{"n":30,"t":"Irish wristwatch, Swiss wristwatch.","tgt":"<span class=\"ipa\">/rɪst/<\/span>, /sw/, <span class=\"ipa\">/tʃ/<\/span>","say":"Irish wristwatch, Swiss wristwatch."},{"n":31,"t":"Specific Pacific, specific Pacific.","tgt":"/sp/, /s/ vs /p/","say":"Specific Pacific, specific Pacific."},{"n":32,"t":"The tests' texts' contexts consist of mixed sixth-sense subtexts.","tgt":"/sts/, /ksts/, <span class=\"ipa\">/ksθ/<\/span>","say":"The tests' texts' contexts consist of mixed sixth-sense subtexts."},{"n":33,"t":"Mixed biscuits, mixed biscuits, mixed biscuits.","tgt":"/kst/, /sk/","say":"Mixed biscuits, mixed biscuits, mixed biscuits."},{"n":34,"t":"She thrusts her fists against the posts and still insists she sees the ghosts.","tgt":"/sts/, /sts/","say":"She thrusts her fists against the posts and still insists she sees the ghosts."},{"n":35,"t":"Six sticky skeletons stacked six stiff sticks.","tgt":"/sk/, /st/, /ks/","say":"Six sticky skeletons stacked six stiff sticks."},{"n":36,"t":"Brisk brave brigadiers brandished broad bright blades.","tgt":"/br/, /bl/","say":"Brisk brave brigadiers brandished broad bright blades."}]},{"t":"h2","h":"Level 6 — Vowels and Stress"},{"t":"tw","rows":[{"n":37,"t":"Betty Botter bought some butter, but she said the butter's bitter.","tgt":"<span class=\"ipa\">/ʌ/<\/span>, <span class=\"ipa\">/ɪ/<\/span>, /t/","say":"Betty Botter bought some butter, but she said the butter's bitter."},{"n":38,"t":"How much wood would a woodchuck chuck if a woodchuck could chuck wood?","tgt":"<span class=\"ipa\">/ʊ/<\/span>, /w/, <span class=\"ipa\">/tʃ/<\/span>","say":"How much wood would a woodchuck chuck if a woodchuck could chuck wood?"},{"n":39,"t":"Can you can a can as a canner can can a can?","tgt":"<span class=\"ipa\">/æ/<\/span>, weak <span class=\"ipa\">/ə/<\/span>","say":"Can you can a can as a canner can can a can?"},{"n":40,"t":"I saw a kitten eating chicken in the kitchen.","tgt":"<span class=\"ipa\">/ɪ/<\/span> vs <span class=\"ipa\">/iː/<\/span>","say":"I saw a kitten eating chicken in the kitchen."},{"n":41,"t":"Eleven benevolent elephants elegantly elevated eleven elevators.","tgt":"stress patterns","say":"Eleven benevolent elephants elegantly elevated eleven elevators."},{"n":42,"t":"Lesser leather never weathered wetter weather better.","tgt":"/e/, <span class=\"ipa\">/ə/<\/span>, <span class=\"ipa\">/ð/<\/span>","say":"Lesser leather never weathered wetter weather better."},{"n":43,"t":"A big black bug bit a big black bear, made the big black bear bleed blood.","tgt":"/b/, /bl/, <span class=\"ipa\">/ɪ/<\/span> vs <span class=\"ipa\">/iː/<\/span>","say":"A big black bug bit a big black bear, made the big black bear bleed blood."},{"n":44,"t":"Truly rural, truly rural, truly rural.","tgt":"/r/, /l/, <span class=\"ipa\">/ʊə/<\/span> (very hard)","say":"Truly rural, truly rural, truly rural."}]},{"t":"h2","h":"Level 7 — Your Academic Life (original twisters)"},{"t":"tw","rows":[{"n":45,"t":"Rupok's robust research reveals remarkably reliable results regarding real-world side-channel signals.","tgt":"/r/, /s/, <span class=\"ipa\">/ʃ/<\/span>, stress","say":"Rupok's robust research reveals remarkably reliable results regarding real-world side-channel signals."},{"n":46,"t":"The statistician's statistical statements stated that the statistics were statistically significant.","tgt":"/st/, stress shift","say":"The statistician's statistical statements stated that the statistics were statistically significant."},{"n":47,"t":"The professor's powerful processor processed the power traces precisely.","tgt":"/pr/, /s/","say":"The professor's powerful processor processed the power traces precisely."},{"n":48,"t":"Seven sensors sensed several subtle signals, so the system successfully separated the secret.","tgt":"/s/, /sn/, <span class=\"ipa\">/ʃ/<\/span>","say":"Seven sensors sensed several subtle signals, so the system successfully separated the secret."},{"n":49,"t":"The thesis's theoretical method thoroughly threatened three prior theories.","tgt":"<span class=\"ipa\">/θ/<\/span>, stress","say":"The thesis's theoretical method thoroughly threatened three prior theories."},{"n":50,"t":"Very vigilant vulnerability researchers verify which wireless widgets were weakly protected.","tgt":"/v/ vs /w/","say":"Very vigilant vulnerability researchers verify which wireless widgets were weakly protected."},{"n":51,"t":"Whether the weather would wreck the workshop was worth wondering about while we waited.","tgt":"/w/, <span class=\"ipa\">/ð/<\/span>, <span class=\"ipa\">/ɜː/<\/span>","say":"Whether the weather would wreck the workshop was worth wondering about while we waited."},{"n":52,"t":"Peter's peer reviewer politely pointed out that the plots' points were poorly placed.","tgt":"/p/, /pl/, /ts/","say":"Peter's peer reviewer politely pointed out that the plots' points were poorly placed."}]},{"t":"box","k":"tip","h":"Make your own twister from the words you mispronounce most. If you struggle with \"development\" and \"determine\", write: \"Developers determine development deadlines diligently.\" Your own sentences target your own weaknesses."}]},{"id":45,"title":"More Tricks for Speaking English Well","blocks":[{"t":"h2","h":"Ten Quick Wins Before Any Important Conversation"},{"t":"ul","items":["<b>Prepare your first sentence.<\/b> Knowing how you'll start removes the worst nervousness.","<b>Know your key words.<\/b> Before a meeting or talk, say the 5–10 technical words aloud three times each.","<b>Breathe low and slow<\/b> for 30 seconds before you start.","<b>Speak 10% slower<\/b> than feels natural.","<b>Finish statements with a falling tone<\/b> — it sounds confident.","<b>Use contractions<\/b> (I'm, I've, it's, don't) — it sounds natural and helps rhythm.","<b>Pause at commas and full stops<\/b>, not in the middle of phrases.","<b>Paraphrase instead of freezing<\/b> when a word disappears.","<b>Ask for clarification<\/b> confidently: \"Sorry, could you rephrase that?\" is a strength, not a weakness.","<b>Smile when appropriate<\/b> — it warms your voice."]},{"t":"h2","h":"IELTS Speaking Test-Day Tips"},{"t":"ul","items":["<b>Part 1 (4–5 min, personal questions):<\/b> answer in 2–4 sentences: direct answer + reason + small example. Don't give one-word answers; don't give speeches.","<b>Part 2 (1 min prep, 1–2 min talk):<\/b> use the minute to write <b>keywords<\/b> in a frame (STAR or Three Points). Cover every bullet. Keep talking until the examiner stops you — add a reflection at the end (\"Looking back, I think…\").","<b>Part 3 (4–5 min, abstract discussion):<\/b> use PREP, hedging, and examples beyond yourself (\"In my country…\", \"Many young people…\"). Compare past and present, give two sides.","<b>If you didn't understand:<\/b> \"Sorry, could you repeat the question?\" (no penalty). \"Do you mean…?\" is fine.","<b>If you make a mistake:<\/b> correct it quickly and move on — \"I go… I mean, I went there last year.\" Self-correction is fine; long stops are not.","<b>Don't memorise full answers.<\/b> Examiners notice and lower the score. Memorise <b>phrases and frames<\/b>, not paragraphs.","<b>Show range on purpose:<\/b> in every part, try to include one perfect tense, one conditional, one passive, one relative clause, and two or three collocations."]},{"t":"h2","h":"Learning Resources (free or low cost)"},{"t":"ul","items":["<b>Dictionaries with audio:<\/b> Cambridge Dictionary and Oxford Learner's Dictionaries — check both IPA and audio for any new word.","<b>Pronunciation by sound:<\/b> YouGlish (hear any word pronounced in thousands of real YouTube clips).","<b>Shadowing material:<\/b> TED / TEDx talks (with transcripts), podcasts such as BBC's <i>6 Minute English<\/i>, and recorded talks from security conferences in your field.","<b>IELTS practice:<\/b> official IELTS sample questions and band descriptors from the IELTS partner websites.","<b>People:<\/b> your university's writing/speaking centre, international student conversation groups, Toastmasters."]},{"t":"box","k":"note","h":"Websites and programs change over time — search for the current version of these resources."}]},{"id":46,"title":"Your 30-Day Speaking Plan","blocks":[{"t":"p","h":"This plan uses the whole handbook. Each day takes about 40–60 minutes. Tick each day when done. Record your <b>Day 1<\/b> and <b>Day 30<\/b> answers to the same question and compare."},{"t":"h2","h":"Week 1 — Foundations and Diagnosis"},{"t":"tb","head":["Day","Grammar &amp; translation (15 min)","Pronunciation &amp; fluency (15 min)","Speaking task (10–15 min)"],"rows":[["1","Read \"How to Use\"; take baseline","Mouth warm-up; vowel chart","<b>Baseline recording:<\/b> explain your research (Scenario 2)"],["2","Singular/plural + uncountables","/s/ vs <span class=\"ipa\">/ʃ/<\/span> minimal pairs","Scenario 1 (introduce yourself)"],["3","Articles","/v/ /w/ /b/ drills","Scenario 37 (catch up with a friend)"],["4","Subject–verb agreement","/z/ vs <span class=\"ipa\">/dʒ/<\/span>; twisters 1–4","Scenario 4 (typical week)"],["5","Present simple vs continuous","-s and -ed endings","Scenario 58 (plan the week with your wife)"],["6","Verbs: be/have/do, do vs make","\"th\" sounds; twisters level 4","Scenario 42 (restaurant)"],["7","Review dotted sentences","Shadowing 5 min","Re-record Day 1 topic; fill the error log"]],"plan":true},{"t":"h2","h":"Week 2 — Perfect Tenses and Connectors (your main weaknesses)"},{"t":"tb","head":["Day","Grammar &amp; translation","Pronunciation &amp; fluency","Speaking task"],"rows":[["8","Present perfect uses 1–2","Word stress (-tion, -ic, -ity)","Scenario 9 (progress update — present perfect)"],["9","Present perfect uses 3–4 (for/since)","Stress-shift words","Scenario 8 (challenge as international student)"],["10","Present perfect continuous","Sentence stress &amp; weak forms","Scenario 37 again — use \"I've been -ing\""],["11","Perfect deep dive: decision tree + contrast pairs","Thought groups &amp; pauses","Frame practice: Past → Present → Future (Scenario 54)"],["12","Connectors: adding, contrast, reason","Breathing exercises","Connector Challenge (any topic)"],["13","Connectors: result, example, sequence, summary","Shadowing 10 min","Scenario 53 (explain a recipe — sequence)"],["14","Review week 2 + self-test corrections","Twisters level 5","Cue card 72 (helping someone — STAR)"]],"plan":true},{"t":"h2","h" log<\/b> as the main material.","Change the shadowing material every week.","Keep recording one scenario every day — it takes only 5 minutes and is the habit that matters most.","Every month, re-score yourself with the rubric and write down your estimated band for each criterion."]},{"t":"box","k":"key","h":"<b>Consistency beats intensity.<\/b> Twenty minutes every day for three months will change your speaking far more than five hours once a week. You already think clearly in Bengali — this handbook is your bridge. Keep crossing it every day."}]}]}],"plan":[{"d":1,"g":"Read \"How to Use\"; take baseline","p":"Mouth warm-up; vowel chart","s":"Baseline recording: explain your research (Scenario 2)"},{"d":2,"g":"Singular/plural + uncountables","p":"/s/ vs /ʃ/ minimal pairs","s":"Scenario 1 (introduce yourself)"},{"d":3,"g":"Articles","p":"/v/ /w/ /b/ drills","s":"Scenario 37 (catch up with a friend)"},{"d":4,"g":"Subject–verb agreement","p":"/z/ vs /dʒ/; twisters 1–4","s":"Scenario 4 (typical week)"},{"d":5,"g":"Present simple vs continuous","p":"-s and -ed endings","s":"Scenario 58 (plan the week with your wife)"},{"d":6,"g":"Verbs: be/have/do, do vs make","p":"\"th\" sounds; twisters level 4","s":"Scenario 42 (restaurant)"},{"d":7,"g":"Review dotted sentences","p":"Shadowing 5 min","s":"Re-record Day 1 topic; fill the error log"},{"d":8,"g":"Present perfect uses 1–2","p":"Word stress (-tion, -ic, -ity)","s":"Scenario 9 (progress update — present perfect)"},{"d":9,"g":"Present perfect uses 3–4 (for/since)","p":"Stress-shift words","s":"Scenario 8 (challenge as international student)"},{"d":10,"g":"Present perfect continuous","p":"Sentence stress & weak forms","s":"Scenario 37 again — use \"I've been -ing\""},{"d":11,"g":"Perfect deep dive: decision tree + contrast pairs","p":"Thought groups & pauses","s":"Frame practice: Past → Present → Future (Scenario 54)"},{"d":12,"g":"Connectors: adding, contrast, reason","p":"Breathing exercises","s":"Connector Challenge (any topic)"},{"d":13,"g":"Connectors: result, example, sequence, summary","p":"Shadowing 10 min","s":"Scenario 53 (explain a recipe — sequence)"},{"d":14,"g":"Review week 2 + self-test corrections","p":"Twisters level 5","s":"Cue card 72 (helping someone — STAR)"},{"d":15,"g":"Past simple, past continuous","p":"Intonation patterns","s":"Cue card 52 (memorable trip)"},{"d":16,"g":"Past perfect (+ continuous)","p":"Connected speech & linking","s":"Scenario 5 (paper rejection — STAR)"},{"d":17,"g":"Future forms + future perfect","p":"Shadowing","s":"Scenario 7 (career plans)"},{"d":18,"g":"Modals & modal perfects","p":"Contrastive stress","s":"Scenario 11 (disagree politely with advisor)"},{"d":19,"g":"Passive voice","p":"Clusters (iskul problem)","s":"Scenario 27 (explain a graph — passive)"},{"d":20,"g":"Conditionals + wish","p":"4-3-2 drill","s":"Part 3: \"If you could change one thing…\""},{"d":21,"g":"Review + error log analysis","p":"Twisters level 6","s":"Scenario 59 (apologise to your wife)"},{"d":22,"g":"Gerunds & infinitives","p":"Pause for emphasis","s":"Scenario 17 (first day as TA)"},{"d":23,"g":"Prepositions","p":"Shadowing a conference talk","s":"Scenario 18 (explain a concept in office hours)"},{"d":24,"g":"Phrasal verbs","p":"Twisters level 7","s":"Scenario 24 (feedback on a student's paper)"},{"d":25,"g":"Narration / reported speech","p":"Speed control","s":"Report your last advisor meeting"},{"d":26,"g":"Relative clauses + inversion","p":"4-3-2 drill","s":"Scenario 26 + 30 (open & close a presentation)"},{"d":27,"g":"Everyday expressions + idioms","p":"Mispronounced words list","s":"Scenario 28 (difficult question)"},{"d":28,"g":"Banglish mistakes chapter","p":"Minimal pairs review","s":"Two random Part 3 questions (PREP)"},{"d":29,"g":"Mixed perfect drill (all)","p":"Full warm-up + twisters","s":"Mock IELTS: Parts 1, 2, 3 (record all)"},{"d":30,"g":"Review your notebook","p":"Shadowing","s":"Final recording: same topic as Day 1 — compare!"}],"trTotal":28 /* ---------- icons ---------- */
const IC = {
  spk: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>',
  ok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>',
  dot: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5" fill="currentColor"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>'
};

/* ---------- index the content ---------- */
const CH = {}; const TR = []; const TRBYN = {}; const SCEN = [];
DATA.parts.forEach((p, pi) => p.chapters.forEach(c => {
  c.part = pi; CH[c.id] = c; c.trs = [];
  c.blocks.forEach(b => {
    if (b.t === 'tr') b.rows.forEach(r => { r.ch = c.id; TR.push(r); TRBYN[r.n] = r; c.trs.push(r.n); });
    if (b.t === 'scen') { b.ch = c.id; SCEN.push(b); }
  });
}));
const SCORE_ITEMS = ["Answered the question in the first sentence","Followed a frame (no jumping)","Used 5+ different connectors","Used at least one present perfect correctly","No missing -s (plurals, he/she verbs)","Articles (a/an/the) mostly correct","Used a collocation or idiom naturally","Fewer than 3 \"umm/aaa\" fillers","Paused between phrases, not inside them","Hard sounds clear (v, w, z, th, s/sh)","Word stress right on long words","Ended with a summary sentence"];

/* ---------- state ---------- */
const LS = 'speakdesk-v1';
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
function blank() { return { v: 1, start: today(), days: {}, tr: {}, tw: {}, sc: {}, plan: {}, errors: [], set: { cover: true, rate: 0.95, voice: '' }, updated: 0 }; }
let S = blank();
try { const raw = localStorage.getItem(LS); if (raw) S = Object.assign(blank(), JSON.parse(raw)); } catch (e) {}
function day(d = today()) { return S.days[d] || (S.days[d] = { sec: 0, tr: 0, tw: 0, sc: 0 }); }

let dbRef = null, saving = false, dirty = false, saveTimer = null;
function save() {
  S.updated = Date.now();
  try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {}
  dirty = true; clearTimeout(saveTimer); saveTimer = setTimeout(flushRemote, 1500);
}
async function flushRemote() {
  if (!dbRef || saving || !dirty) return;
  saving = true; dirty = false;
  try { await dbRef.set(JSON.parse(JSON.stringify(S))); setSync('Progress saved to your account.'); }
  catch (e) { if (e && e.code === 'unavailable') dirty = true; setSync('Saved in this browser; account sync paused.'); }
  saving = false; if (dirty) saveTimer = setTimeout(flushRemote, 2000);
}
function setSync(t) { const el = document.getElementById('syncNote'); if (el) el.textContent = t; }
(async () => {
  if (!window.claude || !claude.use) return;
  try {
    const [user, db] = await Promise.all([claude.use('user'), claude.use('db')]);
    if (!user || !db) return;
    const id = await user.id(); if (!id) return;
    dbRef = db.doc('data/users/' + id + '/progress');
    const snap = await dbRef.get();
    if (snap.exists) {
      const remote = snap.data();
      if ((remote.updated || 0) > (S.updated || 0)) { S = Object.assign(blank(), JSON.parse(JSON.stringify(remote))); try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} route(); }
      else if ((S.updated || 0) > (remote.updated || 0)) { dirty = true; flushRemote(); }
      setSync('Progress synced with your account.');
    } else if (S.updated) { dirty = true; flushRemote(); }
    else setSync('Progress will sync to your account.');
  } catch (e) { setSync('Progress is saved in this browser.'); }
})();

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 1800); }
function planDay() { const s = new Date(S.start + 'T00:00:00'), n = new Date(today() + 'T00:00:00'); return Math.min(30, Math.max(1, Math.round((n - s) / 864e5) + 1)); }
function streak() { let n = 0; const d = new Date(); if (!active(fmt(d))) d.setDate(d.getDate() - 1); while (active(fmt(d))) { n++; d.setDate(d.getDate() - 1); } return n; }
function fmt(d) { return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function active(k) { const x = S.days[k]; return x && (x.sec >= 60 || x.tr || x.tw || x.sc); }
function chPct(c) { if (!c.trs.length) return null; let k = 0; c.trs.forEach(n => { if (S.tr[n] === 1) k++; }); return Math.round(100 * k / c.trs.length); }

/* ---------- speech ---------- */
const synth = window.speechSynthesis;
let voices = [];
function loadVoices() {
  if (!synth) return;
  voices = synth.getVoices().filter(v => /^en(-|_|$)/i.test(v.lang));
  const sel = $('#voiceSel');
  if (!voices.length) { sel.innerHTML = '<option>Default English voice</option>'; return; }
  const pref = ['Google US English', 'Samantha', 'Microsoft Aria', 'Microsoft Jenny', 'Alex', 'Google UK English Female', 'Daniel'];
  voices.sort((a, b) => { const ia = pref.findIndex(p => a.name.includes(p)), ib = pref.findIndex(p => b.name.includes(p)); return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.lang.localeCompare(b.lang); });
  sel.innerHTML = voices.map(v => `<option value="${esc(v.name)}">${esc(v.name)} (${esc(v.lang)})</option>`).join('');
  if (S.set.voice && voices.some(v => v.name === S.set.voice)) sel.value = S.set.voice;
}
if (synth) { loadVoices(); synth.onvoiceschanged = loadVoices; }
let curBtn = null;
function speak(text, rate, btn) {
  if (!synth) { toast('Your browser has no speech voice. Try Chrome, Edge or Safari.'); return; }
  synth.cancel();
  if (curBtn) curBtn.classList.remove('playing');
  if (curBtn === btn && btn && btn.dataset.playing) { delete btn.dataset.playing; curBtn = null; return; }
  const u = new SpeechSynthesisUtterance(text);
  const v = voices.find(x => x.name === ($('#voiceSel').value || S.set.voice)); if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'en-US';
  u.rate = (rate || 1) * (S.set.rate || 0.95);
  if (btn) { btn.classList.add('playing'); btn.dataset.playing = '1'; curBtn = btn; }
  u.onend = u.onerror = () => { if (btn) { btn.classList.remove('playing'); delete btn.dataset.playing; } if (curBtn === btn) curBtn = null; };
  synth.speak(u);
}
$('#voiceSel').addEventListener('change', e => { S.set.voice = e.target.value; save(); speak('Hello Rupok. This is how I sound.', 1); });
$('#rateIn').value = S.set.rate; $('#rateOut').textContent = (+S.set.rate).toFixed(2) + '×';
$('#rateIn').addEventListener('input', e => { S.set.rate = +e.target.value; $('#rateOut').textContent = S.set.rate.toFixed(2) + '×'; save(); });
const spkBtn = (say, label, rate) => `<button class="ib" data-act="say" data-say="${esc(say)}" ${rate ? `data-rate="${rate}"` : ''} aria-label="${esc(label)}">${IC.spk}</button>`;
const slowBtn = say => `<button class="ib slow" data-act="say" data-say="${esc(say)}" data-rate="0.6" aria-label="Play slowly">0.6×</button>`;

/* ---------- practice timer ---------- */
let ptRun = null;
function ptShow() { const m = Math.floor(day().sec / 60); $('#pt').textContent = m + ' min today'; }
$('#ptBtn').addEventListener('click', () => {
  if (ptRun) { clearInterval(ptRun); ptRun = null; $('#ptBtn').textContent = 'Start practice timer'; $('#ptBtn').classList.remove('primary'); save(); toast('Practice time saved'); return; }
  $('#ptBtn').textContent = 'Stop timer'; $('#ptBtn').classList.add('primary');
  ptRun = setInterval(() => { day().sec += 5; ptShow(); if (day().sec % 60 === 0) save(); }, 5000);
});

/* ---------- navigation ---------- */
function buildToc() {
  const toc = $('#toc');
  toc.innerHTML = '<div class="navlabel">Handbook</div>' + DATA.parts.map((p, pi) => `
    <details class="part" data-part="${pi}"><summary>${esc(p.title)}</summary><div class="chlist">
    ${p.chapters.map(c => { const pc = chPct(c); return `<a class="nav" href="#ch-${c.id}" data-view="ch-${c.id}">${esc(c.title)}${pc === null ? '' : `<span class="pct">${pc}%</span>`}</a>`; }).join('')}
    </div></details>`).join('');
}
function markNav(view) {
  document.querySelectorAll('.nav').forEach(a => { if (a.dataset.view === view) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  const m = /^ch-(\d+)$/.exec(view);
  if (m) { const d = document.querySelector(`details.part[data-part="${CH[m[1]].part}"]`); if (d) d.open = true; }
}
$('#menuBtn').addEventListener('click', () => $('#spine').classList.toggle('open'));
document.addEventListener('click', e => { if (e.target.closest('.spine a')) $('#spine').classList.remove('open'); });
window.addEventListener('hashchange', route);

function route() {
  const h = (location.hash || '#today').slice(1);
  if (synth) synth.cancel();
  stopAllClocks();
  const m = /^ch-(\d+)$/.exec(h);
  if (m && CH[m[1]]) viewChapter(CH[m[1]]);
  else if (h === 'drill') viewDrill();
  else if (h === 'tracker') viewTracker();
  else if (h === 'videos') viewVideos();
  else if (h === 'coach') viewCoach();
  else viewToday();

/* ---------- AI coach ---------- */
const COACH_CONTEXT = `You are a friendly, precise English speaking coach. The learner is a Bengali-speaking computer science PhD student and teaching assistant in the United States. IELTS Speaking 6.0 now, target 7.0+. Known weak points: connectors, jumping between ideas, pronunciation, pauses, tenses (especially present perfect and past perfect), and singular/plural. The text may come from phone dictation: ignore punctuation and obvious dictation slips.`;
const COACH_FORMAT = `Reply in plain text using exactly these sections, short and practical:
**Better version** — rewrite the answer as natural spoken English, keeping the learner's ideas and length.
**Mistakes** — up to 8 bullets, each: "what was said → better", then [category] and a very short reason. Add a short Bengali hint in brackets when it helps.
**Structure** — one or two sentences: did the answer follow one line of thought or jump? Which frame (PREP, STAR, Past→Present→Future, Three points) would fit?
**Connectors to add** — 3 to 5 connectors that would fit this answer, each in a short example from the answer.
**Estimated band** — Fluency & coherence, Vocabulary, Grammar (pronunciation can't be judged from text), one line each.
**Tomorrow's drill** — one concrete 5-minute exercise.
Use "-" for bullets and **bold** only for the section labels.`;
let sampleFn; const sampleReady = (async () => { if (!window.claude || !claude.use) return null; try { sampleFn = await claude.use('sample'); } catch (e) { sampleFn = null; } return sampleFn; })();
function mdLite(t) { return esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'); }
const AIERR = { not_granted: 'The coach needs your permission to use Claude. Allow it when asked, or reload the page to be asked again.', sampling_disabled: 'Claude is not available for this account.', rate_limited: 'Too many requests right now. Wait a minute and try again.', session_expired: 'Please sign in to Claude again.', refused: 'The coach could not answer this text. Try rephrasing it.', prompt_too_large: 'That text is too long. Paste one answer at a time.' };
async function askCoach(prompt, out, stopBtn, runBtn) {
  const fn = await sampleReady;
  if (!fn) { out.textContent = 'The AI coach works when this page is open in Claude. Your progress and everything else still work here.'; return; }
  const ctl = new AbortController();
  out.innerHTML = 'Thinking…'; if (stopBtn) { stopBtn.hidden = false; stopBtn.onclick = () => ctl.abort(); } if (runBtn) runBtn.disabled = true;
  try {
    const r = await fn(prompt, { signal: ctl.signal, cache: false, onText: ({ text }) => { out.innerHTML = mdLite(text); } });
    if (r.truncated) out.innerHTML += '<br><br><i>The answer was cut short. Paste a shorter text for full feedback.</i>';
  } catch (e) {
    if (e.code === 'cancelled') out.innerHTML = e.text ? mdLite(e.text) : '';
    else out.innerHTML = (e.text ? mdLite(e.text) + '<br><br>' : '') + esc(AIERR[e.code] || 'The coach could not reply just now. Try again in a moment.');
  } finally { if (stopBtn) stopBtn.hidden = true; if (runBtn) runBtn.disabled = false; }
}

    save(); toast(`Saved: ${got}/12`); const h = sec.querySelector('.scen-h'); let d = h.querySelector('.done'); if (!d) { d = document.createElement('span'); d.className = 'done'; h.append(d); } d.textContent = `Practised ${st.runs}× · best ${st.best}/12`;

  }
});

/* ---------- drill ---------- */
let drillSrc = 'mix', drillDeck = [], drillI = 0, drillShown = false, drillStats = { ok: 0, again: 0 };
function buildDeck() {
  let pool;

  else if (drillSrc === 'new') pool = TR.filter(r => !S.tr[r.n]);
  else if (drillSrc.startsWith('ch:')) pool = TR.filter(r => r.ch === +drillSrc.slice(3));
  else { const ag = TR.filter(r => S.tr[r.n] === 2), nw = TR.filter(r => !S.tr[r.n]); pool = shuffle(ag).slice(0, 4).concat(shuffle(nw)); }

}
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function drawCard() {
  const host = $('#cardHost'); if (!host) return;
  if (!drillDeck.length) { host.innerHTML = `<div class="card"><p>No sentences here yet. Choose another source above.</p></div>`; return; }
  if (drillI >= drillDeck.length) {
    host.innerHTML = `<div class="card"><span class="eyebrow">Round finished</span><p class="q" style="font-family:var(--f-display)">${drillStats.ok} right · ${drillStats.again} to practise again</p><div class="row"><button class="btn primary" id="again10">Next 10 cards</button><a class="btn" href="#today">Back to today</a></div></div>`;
    $('#again10').onclick = () => { buildDeck(); drawCard(); }; return;
  }
  const r = drillDeck[drillI];
  host.innerHTML = `<div class="card"><div class="meta"><span>Card ${drillI + 1} of ${drillDeck.length}</span><span>${esc(CH[r.ch].title)}</span><span>#${r.n}</span></div>
    <div class="q">${r.bn}</div><div class="a" id="cardA" ${drillShown ? '' : 'hidden'}>${r.en}${r.note ? `<div class="hint" style="color:var(--gold);font-style:italic;margin-top:6px">${r.note}</div>` : ''}</div>
    <div class="row">${drillShown ? `${spkBtn(r.say, 'Play English')}${slowBtn(r.say)}<button class="btn primary" id="cOk">${IC.ok} I got it</button><button class="btn" id="cAg" style="color:var(--mark)">${IC.dot} Practise again</button>` : `<button class="btn primary" id="cShow">Show answer</button>`}</div></div>`;
  if (drillShown) { $('#cOk').onclick = () => grade(1); $('#cAg').onclick = () => grade(2); }
  else $('#cShow').onclick = showAns;
}
function showAns() { drillShown = true; drawCard(); const r = drillDeck[drillI]; speak(r.say, 1, null); }
function grade(v) { const r = drillDeck[drillI]; if (!S.tr[r.n]) day().tr++; S.tr[r.n] = v; v === 1 ? drillStats.ok++ : drillStats.again++; save(); refreshPct(r.ch); drillI++; drillShown = false; drawCard(); }
document.addEventListener('keydown', e => {
  if (location.hash !== '#drill' || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  const r = drillDeck[drillI]; if (!r) return;
  if (e.code === 'Space') { e.preventDefault(); if (!drillShown) showAns(); }
  else if (e.key === 'p' || e.key === 'P') speak(r.say, 1, null);
  else if (drillShown && e.key === '1') grade(1);
  else if (drillShown && e.key === '2') grade(2);
});

/* ---------- tracker ---------- */
function viewTracker() {
  $('#crumb').textContent = 'Progress tracker';
  const pd = planDay();
  const days = []; const d0 = new Date(); for (let i = 20; i >= 0; i--) { const d = new Date(d0); d.setDate(d0.getDate() - i); days.push(d); }
  const mins = days.map(d => Math.round(((S.days[fmt(d)] || {}).sec || 0) / 60));
  const maxM = Math.max(30, ...mins); const top = Math.ceil(maxM / 15) * 15;
  const W = 640, H = 200, L = 34, B = 26, bw = (W - L - 8) / days.length;
  const y = v => H - B - (v / top) * (H - B - 12);
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Minutes practised in the last 21 days">`;
  for (let t = 0; t <= top; t += 15) svg += `<line x1="${L}" x2="${W - 4}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(t) + 4}" font-size="11" text-anchor="end" fill="var(--ink-2)">${t}</text>`;
  days.forEach((d, i) => { const x = L + 4 + i * bw; const v = mins[i]; svg += `<rect x="${x.toFixed(1)}" y="${y(v).toFixed(1)}" width="${(bw - 4).toFixed(1)}" height="${(H - B - y(v)).toFixed(1)}" rx="3" fill="${fmt(d) === today() ? 'var(--gold)' : 'var(--accent)'}"><title>${fmt(d)}: ${v} min</title></rect>`; if (i % 3 === 0 || i === days.length - 1) svg += `<text x="${(x + (bw - 4) / 2).toFixed(1)}" y="${H - 8}" font-size="10.5" text-anchor="middle" fill="var(--ink-2)">${d.getMonth() + 1}/${d.getDate()}</text>`; });
  svg += '</svg>';
  const errTypes = ['tense', '-s / plural', 'article', 'preposition', 'connector', 'pronunciation', 'word choice', 'other'];
  const scDone = SCEN.filter(s => S.sc[s.num] && S.sc[s.num].runs);
  $('#sheet').className = 'sheet';
  $('#sheet').innerHTML = `<header class="chhead"><span class="eyebrow">Progress tracker</span><h1 class="title">Your practice record</h1></header>
  <div class="stats">
    <div class="stat"><b>${streak()}</b><span>day streak</span></div>
    <div class="stat"><b>${Object.keys(S.plan).length}/30</b><span>plan days done</span></div>
    <div class="stat"><b>${Object.values(S.tr).filter(v => v === 1).length}</b><span>sentences right</span></div>
    <div class="stat"><b>${Object.values(S.tw).reduce((a, b) => a + b, 0)}</b><span>tongue twisters said</span></div>
    <div class="stat"><b>${scDone.length}/${SCEN.length}</b><span>scenarios practised</span></div>
  </div>
  <section class="panel"><span class="eyebrow">Last 21 days</span><h2>Minutes practised</h2><div class="chart">${svg}</div>
    <div class="row"><label for="addMin">Add minutes for today</label><input type="number" id="addMin" min="1" max="240" value="10" style="width:90px"><button class="btn" id="addMinBtn">Add</button><span class="hint">Use this if you practised away from the page.</span></div></section>
  <section class="panel"><div class="row" style="justify-content:space-between"><div><span class="eyebrow">30-day plan</span><h2>Day ${pd} today</h2></div>
    <div class="row"><label for="startD">Plan started on</label><input type="date" id="startD" value="${S.start}"></div></div>
    <div class="plan">${DATA.plan.map(p => `<label class="pday ${p.d === pd ? 'cur' : ''} ${S.plan[p.d] ? 'dn' : ''}" for="pl-${p.d}"><input type="checkbox" class="plantick" id="pl-${p.d}" data-act="plan" data-d="${p.d}" ${S.plan[p.d] ? 'checked' : ''}><b>${p.d}</b><span>${esc(p.s)}<br><span class="hint">${esc(p.g)} · ${esc(p.p)}</span></span></label>`).join('')}</div></section>
  <section class="panel"><span class="eyebrow">Error log</span><h2>Mistakes I keep making</h2>
    <p class="hint">Write down errors from your recordings. After two weeks, your top patterns will be obvious.</p>
    <form class="errform" id="errForm"><input type="text" id="errSaid" placeholder="What I said" aria-label="What I said"><input type="text" id="errRight" placeholder="Correct version" aria-label="Correct version"><select id="errType" aria-label="Type">${errTypes.map(t => `<option>${t}</option>`).join('')}</select><button class="btn primary" type="submit">Add</button></form>
    <div class="errs" id="errList"></div><div id="errSum" class="row"></div></section>
  <section class="panel"><span class="eyebrow">Scenarios</span><h2>Best scores</h2>
    ${scDone.length ? `<div class="tbl"><table><thead><tr><th>#</th><th>Scenario</th><th>Times</th><th>Best</th><th>Last</th></tr></thead><tbody>${scDone.map(s => { const st = S.sc[s.num]; return `<tr><td>${s.num}</td><td><a href="#ch-${s.ch}">${esc(s.title)}</a></td><td>${st.runs}</td><td>${st.best}/12</td><td>${st.last || ''}</td></tr>`; }).join('')}</tbody></table></div>` : '<p class="hint">Save a scored attempt in any scenario and it will show here.</p>'}</section>`;
  $('#addMinBtn').onclick = () => { const v = Math.max(1, Math.min(240, +$('#addMin').value || 0)); day().sec += v * 60; save(); toast(v + ' minutes added'); viewTracker(); };
  $('#startD').onchange = e => { if (e.target.value) { S.start = e.target.value; save(); viewTracker(); } };
  $('#errForm').onsubmit = e => { e.preventDefault(); const s = $('#errSaid').value.trim(), r = $('#errRight').value.trim(); if (!s || !r) { toast('Fill in both boxes'); return; } S.errors.unshift({ d: today(), s, r, t: $('#errType').value }); save(); $('#errSaid').value = ''; $('#errRight').value = ''; drawErrs(); };
  drawErrs();
}
function drawErrs() {
  const L = $('#errList'); if (!L) return;
  L.innerHTML = S.errors.length ? S.errors.map((x, i) => `<div class="err"><span class="hint">${esc(x.d)}</span><span class="s">${esc(x.s)}</span><span class="c">${esc(x.r)}</span><span class="tag">${esc(x.t)}</span><button class="ib" data-del="${i}" aria-label="Delete">${IC.x}</button></div>`).join('') : '<p class="hint">No entries yet. Example: "I am here since two years" → "I\'ve been here for two years" (tense).</p>';
  const cnt = {}; S.errors.forEach(x => cnt[x.t] = (cnt[x.t] || 0) + 1);
  $('#errSum').innerHTML = Object.entries(cnt).sort((a, b) => b[1] - a[1]).map(([t, n]) => `<span class="tag">${esc(t)} · ${n}</span>`).join('');
  L.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { const x = S.errors.splice(+b.dataset.del, 1)[0]; save(); drawErrs(); toast('Deleted "' + x.s.slice(0, 30) + '"'); });
}

/* ---------- coach ---------- */
const QUESTIONS = ['Describe a challenge you faced in your first year abroad.', 'Explain your research to someone who is not in computer science.', 'Do you prefer studying alone or in a group? Why?', 'How has technology changed the way people communicate?', 'Describe a teacher who influenced you.', 'What would you change about your PhD life if you could?', 'Should university education be free for everyone?', 'Describe a meal you cooked recently.', 'Talk about how you share household work at home.', 'What are the pros and cons of living in a small city?'];
function viewCoach() {
  $('#crumb').textContent = 'AI speaking coach';
  $('#sheet').className = 'sheet';
  const q = QUESTIONS[new Date().getDate() % QUESTIONS.length];
  $('#sheet').innerHTML = `<header class="chhead"><span class="eyebrow">AI speaking coach</span><h1 class="title">Speak for one minute, then get feedback.</h1>
    <p class="hint">Record yourself on your phone with dictation turned on, or just type what you said. The coach knows your weak points: tenses, connectors, jumping between ideas, singular/plural. It can't hear pronunciation.</p></header>
  <section class="panel"><span class="eyebrow">Question</span>
    <div class="row"><input type="text" id="cq" value="${esc(q)}" style="flex:1;min-width:0" aria-label="Question">${spkBtn(q, 'Read the question aloud')}<button class="btn" id="newQ">Give me a new question</button></div>
    <label for="cAns" class="hint">Your answer</label><textarea id="cAns" placeholder="Paste or type what you said…" style="min-height:160px"></textarea>
    <div class="row"><button class="btn primary" id="cGo">Check my answer</button><button class="btn" id="cStop" hidden>Stop</button></div>
    <div class="aiout" id="cOut" aria-live="polite"></div></section>
  <section class="panel"><span class="eyebrow">Ask about grammar</span><h2>Explain it in my words</h2>
    <div class="row"><input type="text" id="gq" placeholder="e.g. When do I use 'have been' and when 'had been'?" style="flex:1;min-width:0" aria-label="Grammar question"><button class="btn primary" id="gGo">Explain</button><button class="btn" id="gStop" hidden>Stop</button></div>
    <div class="aiout" id="gOut" aria-live="polite"></div></section>`;
  $('#cq').addEventListener('input', () => { const b = $('#cq').nextElementSibling; b.dataset.say = $('#cq').value; });
  $('#newQ').onclick = async () => {
    const out = $('#cOut');
    const fn = await sampleReady;
    if (!fn) { const nq = QUESTIONS[Math.floor(Math.random() * QUESTIONS.length)]; $('#cq').value = nq; $('#cq').nextElementSibling.dataset.say = nq; return; }
    $('#newQ').disabled = true;
    try { const r = await fn(`${COACH_CONTEXT}\n\nWrite ONE new IELTS-style speaking question for this learner, about PhD life, teaching, home life with his wife, cooking, travel, technology or society. Reply with only the question, one sentence.`, { modelTier: 'quick', cache: false });
      const nq = r.text.trim().replace(/^"|"$/g, ''); $('#cq').value = nq; $('#cq').nextElementSibling.dataset.say = nq; }
    catch (e) { out.textContent = AIERR[e.code] || 'Could not get a new question. Try again in a moment.'; }
    finally { $('#newQ').disabled = false; }
  };
  $('#cGo').onclick = () => { const t = $('#cAns').value.trim(); if (!t) { $('#cOut').textContent = 'Type or paste your answer first.'; return; } askCoach(`${COACH_CONTEXT}\n\nSpeaking question: "${$('#cq').value}"\n\nThe learner's answer:\n"""${t.slice(0, 6000)}"""\n\n${COACH_FORMAT}`, $('#cOut'), $('#cStop'), $('#cGo')); };
  $('#gGo').onclick = () => { const t = $('#gq').value.trim(); if (!t) return; askCoach(`${COACH_CONTEXT}\n\nThe learner asks: "${t}"\n\nExplain simply in English, with a short Bengali summary line at the end. Give 4 to 6 example sentences from PhD, teaching or daily life, each with its Bengali translation. Show common mistakes Bengali speakers make with this point. Keep it under 250 words. Plain text, "-" for bullets, **bold** for short labels.`, $('#gOut'), $('#gStop'), $('#gGo')); };
}
