<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Rupok's Speaking Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Charis+SIL:wght@400;700&family=Noto+Sans+Bengali:wght@400;600&family=Young+Serif&display=swap">
<style>
/* Layout: a study desk. Navigation spine on the left, one working sheet on the right; the sheet holds a single chapter or tool at a time. */
:root {
  --paper: #f3f5f2;      /* page ground, faint green-grey */
  --sheet: #fbfcfa;      /* working sheet */
  --ink: #18241f;        /* main text */
  --ink-2: #4f5d56;      /* secondary text */
  --line: #d9dfd9;       /* hairlines */
  --spine: #e7ece6;      /* sidebar */
  --accent: #0a6b4b;     /* Bangladesh-flag green */
  --accent-ink: #ffffff;
  --accent-soft: #dcefe6;
  --mark: #c8372d;       /* the red disc: "practise again" */
  --mark-soft: #f8e1de;
  --ok: #1f7a3c;
  --ok-soft: #dff1e3;
  --gold: #a26a00;
  --gold-soft: #fbefd2;
  --ipa: #5a3d8f;
  --shadow: 0 1px 2px rgba(20,40,30,.06), 0 4px 18px rgba(20,40,30,.06);
  --f-display: "Young Serif", Georgia, "Times New Roman", serif;
  --f-body: "Atkinson Hyperlegible", "Noto Sans Bengali", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-bn: "Noto Sans Bengali", "Atkinson Hyperlegible", system-ui, sans-serif;
  --f-ipa: "Charis SIL", "Doulos SIL", "Gentium Plus", "DejaVu Sans", serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0f1512; --sheet: #151d19; --ink: #e5ece8; --ink-2: #a3b1aa; --line: #2a3530; --spine: #121a16;
  --accent: #3fbf8c; --accent-ink: #06130d; --accent-soft: #173a2c; --mark: #f07167; --mark-soft: #3a1d1b;
  --ok: #5ccf86; --ok-soft: #173322; --gold: #e2b14a; --gold-soft: #3a2e14; --ipa: #c4a8f5;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 18px rgba(0,0,0,.3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #0f1512; --sheet: #151d19; --ink: #e5ece8; --ink-2: #a3b1aa; --line: #2a3530; --spine: #121a16;
  --accent: #3fbf8c; --accent-ink: #06130d; --accent-soft: #173a2c; --mark: #f07167; --mark-soft: #3a1d1b;
  --ok: #5ccf86; --ok-soft: #173322; --gold: #e2b14a; --gold-soft: #3a2e14; --ipa: #c4a8f5;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 18px rgba(0,0,0,.3); color-scheme: dark; }

html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font: 16px/1.55 var(--f-body); }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.ipa { font-family: var(--f-ipa); color: var(--ipa); }
.hl { background: var(--gold-soft); padding: 0 .2em; border-radius: 3px; }

/* shell */
.shell { display: grid; grid-template-columns: 290px minmax(0, 1fr); height: 100%; }
.spine { background: var(--spine); border-right: 1px solid var(--line); overflow-y: auto; padding: 18px 14px 40px; display: flex; flex-direction: column; gap: 14px; }
.brand { display: flex; flex-direction: column; gap: 2px; padding: 0 6px; }
.brand b { font-family: var(--f-display); font-weight: 400; font-size: 1.35rem; line-height: 1.15; }
.brand span { font-family: var(--f-bn); font-size: .85rem; color: var(--ink-2); }
.navgroup { display: flex; flex-direction: column; gap: 2px; }
.navlabel { font-size: .72rem; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-2); padding: 8px 8px 4px; }
.nav { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; background: none; border: 0; padding: 7px 8px; border-radius: 7px; cursor: pointer; font-size: .93rem; color: var(--ink); text-decoration: none; }
.nav:hover { background: var(--accent-soft); }
.nav[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }
.nav .pct { margin-left: auto; font-size: .72rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.nav[aria-current="page"] .pct { color: inherit; opacity: .85; }
details.part > summary { list-style: none; cursor: pointer; font-size: .82rem; font-weight: 700; padding: 7px 8px; border-radius: 7px; color: var(--ink-2); display: flex; gap: 6px; align-items: center; }
details.part > summary::-webkit-details-marker { display: none; }
details.part > summary::before { content: "▸"; font-size: .75rem; transition: transform .15s; }
details.part[open] > summary::before { transform: rotate(90deg); }
details.part > summary:hover { background: var(--accent-soft); }
.chlist { display: flex; flex-direction: column; gap: 1px; padding-left: 10px; }
.chlist .nav { font-size: .86rem; padding: 5px 8px; }
.voicebox { margin-top: auto; border-top: 1px solid var(--line); padding: 12px 6px 0; display: flex; flex-direction: column; gap: 8px; font-size: .85rem; }
.voicebox label { display: flex; flex-direction: column; gap: 3px; color: var(--ink-2); }
.voicebox select, .voicebox input[type=range] { width: 100%; }
select, input[type=text], input[type=date], input[type=number], textarea { background: var(--sheet); border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; }
textarea { width: 100%; resize: vertical; min-height: 90px; line-height: 1.5; }

.main { overflow-y: auto; min-width: 0; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; padding: 8px 24px; flex-wrap: wrap; }
.menubtn { display: none; }
.crumb { font-size: .85rem; color: var(--ink-2); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.timer { display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; font-size: .9rem; }
.sheet { max-width: 920px; margin: 0 auto; padding-block: 28px 80px; padding-inline: 24px; display: flex; flex-direction: column; gap: 14px; }

/* buttons */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--sheet); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: .9rem; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn[disabled] { opacity: .5; cursor: default; }
.ib { width: 32px; height: 32px; display: inline-grid; place-items: center; border: 1px solid var(--line); background: var(--sheet); border-radius: 50%; cursor: pointer; color: var(--ink); flex: 0 0 auto; padding: 0; }
.ib:hover { border-color: var(--accent); color: var(--accent); }
.ib svg { width: 16px; height: 16px; }
.ib.slow { width: auto; border-radius: 16px; padding: 0 9px; font-size: .72rem; font-weight: 700; }
.ib.on-ok { background: var(--ok); color: var(--accent-ink); border-color: var(--ok); }
.ib.on-mark { background: var(--mark); color: #fff; border-color: var(--mark); }
.ib.playing { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

/* chapter typography */
.eyebrow { font-size: .75rem; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
h1.title { font-family: var(--f-display); font-weight: 400; font-size: clamp(1.7rem, 3.6vw, 2.4rem); line-height: 1.15; margin: 0; text-wrap: balance; }
.sheet h2 { font-family: var(--f-display); font-weight: 400; font-size: 1.35rem; margin: 18px 0 0; text-wrap: balance; padding-top: 14px; border-top: 1px solid var(--line); }
.sheet h3 { font-size: 1.05rem; margin: 8px 0 0; }
.sheet p { margin: 0; max-width: 70ch; }
.sheet ul { margin: 0; padding-left: 1.2em; max-width: 72ch; display: flex; flex-direction: column; gap: 4px; }
.bnp { font-family: var(--f-bn); }
.chhead { display: flex; flex-direction: column; gap: 6px; }
.chtools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: .9rem; color: var(--ink-2); }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; flex: 1; min-width: 80px; max-width: 240px; }
.bar i { display: block; height: 100%; background: var(--ok); }

/* boxes */
.box { border-radius: 10px; padding: 12px 14px; font-size: .95rem; background: var(--sheet); border: 1px solid var(--line); max-width: 78ch; }
.box .lbl { display: block; font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; margin-bottom: 3px; }
.box.tip .lbl { color: var(--ok); } .box.tip { background: var(--ok-soft); border-color: transparent; }
.box.warn .lbl { color: var(--mark); } .box.warn { background: var(--mark-soft); border-color: transparent; }
.box.key .lbl { color: var(--gold); } .box.key { background: var(--gold-soft); border-color: transparent; }
.box.rule .lbl { color: var(--accent); } .box.rule { background: var(--accent-soft); border-color: transparent; }
.box.try .lbl { color: var(--ipa); }
.box.note .lbl { color: var(--ink-2); }

/* translation rows */
.trs { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--sheet); }
.tr { display: grid; grid-template-columns: 42px minmax(0,1fr) minmax(0,1fr) auto; gap: 12px; padding: 10px 12px; align-items: start; border-top: 1px solid var(--line); }
.tr:first-child { border-top: 0; }
.tr .num { font-size: .72rem; color: var(--ink-2); font-variant-numeric: tabular-nums; padding-top: 4px; text-align: right; }
.tr .bn { font-family: var(--f-bn); font-size: 1.02rem; line-height: 1.6; }
.tr .en { font-size: 1rem; }
.tr .note { font-size: .82rem; color: var(--gold); margin-top: 3px; font-style: italic; }
.tr .acts { display: flex; gap: 6px; }
.tr.s1 { background: color-mix(in srgb, var(--ok-soft) 55%, transparent); }
.tr.s2 { background: color-mix(in srgb, var(--mark-soft) 60%, transparent); }
.cover .tr:not(.open) .en { cursor: pointer; position: relative; }
.cover .tr:not(.open) .en > * { filter: blur(7px); opacity: .5; user-select: none; }
.cover .tr:not(.open) .en::after { content: "Tap to check"; position: absolute; inset: 0; display: grid; place-items: center start; font-size: .8rem; color: var(--ink-2); }

/* generic tables */
.tw-wrap, .tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--sheet); }
table { border-collapse: collapse; width: 100%; font-size: .92rem; }
th { text-align: left; font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); padding: 9px 12px; border-bottom: 1px solid var(--line); background: var(--spine); }
td { padding: 8px 12px; border-top: 1px solid var(--line); vertical-align: top; }
tr:first-child td { border-top: 0; }
td.w { color: var(--mark); } td.r { color: var(--ok); font-weight: 700; } td.y { color: var(--ink-2); font-size: .86rem; }
td .bnc, td.bnc { font-family: var(--f-bn); }
.plantick { width: 18px; height: 18px; accent-color: var(--accent); }

/* pronunciation rows */
.prs { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.pr { background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.pr .top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pr .word { font-weight: 700; font-size: 1.05rem; margin-right: auto; }
.pr .ipa { font-size: 1.05rem; }
.pr .bnw { font-family: var(--f-bn); }
.pr .tip { font-size: .85rem; color: var(--ink-2); }
.pr .links { display: flex; gap: 12px; font-size: .8rem; }

/* twisters */
.tws { display: flex; flex-direction: column; gap: 8px; }
.twr { background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; grid-template-columns: 34px minmax(0,1fr) auto; gap: 12px; align-items: center; }
.twr .n { font-family: var(--f-display); font-size: 1.2rem; color: var(--accent); }
.twr .t { font-size: 1.05rem; }
.twr .tg { display: block; font-size: .8rem; color: var(--ipa); margin-top: 2px; }
.twr .acts { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.count { font-size: .78rem; color: var(--ink-2); font-variant-numeric: tabular-nums; min-width: 4.5em; text-align: right; }

/* scenario panel */
.scen { border: 1px solid var(--line); background: var(--sheet); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; margin-top: 10px; box-shadow: var(--shadow); }
.scen-h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.scen-h .no { font-family: var(--f-display); color: var(--accent); font-size: 1.5rem; }
.scen-h h3 { margin: 0 !important; font-size: 1.15rem; }
.scen-h .done { margin-left: auto; font-size: .78rem; padding: 2px 9px; border-radius: 10px; background: var(--ok-soft); color: var(--ok); font-weight: 700; }
.scen-tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.clock { display: flex; align-items: center; gap: 10px; }
.clock svg { width: 46px; height: 46px; }
.clock .t { font-variant-numeric: tabular-nums; font-size: 1.25rem; font-weight: 700; min-width: 3ch; }
.score { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 6px 14px; font-size: .88rem; }
.score label { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
.score input { accent-color: var(--accent); margin-top: 3px; }
.scoreline { font-size: .85rem; color: var(--ink-2); }
.fold > summary { cursor: pointer; font-weight: 700; font-size: .9rem; color: var(--accent); }
.fold[open] > summary { margin-bottom: 8px; }
.aiout { white-space: pre-wrap; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 12px; font-size: .93rem; max-height: 520px; overflow: auto; }
.aiout:empty { display: none; }
.hint { font-size: .82rem; color: var(--ink-2); }

/* today */
.hero { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 14px; }
.panel { background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.panel h2 { border: 0 !important; padding: 0 !important; margin: 0 !important; font-size: 1.2rem !important; }
.daybig { font-family: var(--f-display); font-size: 3.2rem; line-height: 1; color: var(--accent); }
.tasks { display: flex; flex-direction: column; gap: 8px; }
.task { display: flex; gap: 10px; align-items: flex-start; padding: 10px; border-radius: 10px; border: 1px solid var(--line); }
.task .k { font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); display: block; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.stat { background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.stat b { display: block; font-family: var(--f-display); font-weight: 400; font-size: 1.7rem; font-variant-numeric: tabular-nums; }
.stat span { font-size: .8rem; color: var(--ink-2); }
.week { display: flex; gap: 6px; }
.week i { flex: 1; height: 34px; border-radius: 6px; background: var(--line); display: grid; place-items: center; font-style: normal; font-size: .7rem; color: var(--ink-2); }
.week i.on { background: var(--accent); color: var(--accent-ink); }
.week i.today { outline: 2px solid var(--gold); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* drill card */
.card { background: var(--sheet); border: 1px solid var(--line); border-radius: 18px; padding: clamp(18px, 4vw, 36px); display: flex; flex-direction: column; gap: 18px; box-shadow: var(--shadow); min-height: 320px; }
.card .q { font-family: var(--f-bn); font-size: clamp(1.25rem, 3vw, 1.7rem); line-height: 1.6; }
.card .a { font-size: clamp(1.1rem, 2.6vw, 1.45rem); }
.card .a[hidden] { display: none; }
.card .meta { font-size: .8rem; color: var(--ink-2); display: flex; gap: 12px; flex-wrap: wrap; }
.kbd { font-size: .72rem; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: var(--ink-2); }

/* tracker */
.plan { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 8px; }
.pday { border: 1px solid var(--line); background: var(--sheet); border-radius: 10px; padding: 10px; display: flex; gap: 10px; font-size: .85rem; }
.pday.cur { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
.pday.dn { background: var(--ok-soft); }
.pday b { font-family: var(--f-display); font-weight: 400; font-size: 1.2rem; color: var(--accent); min-width: 1.6em; }
.chart svg { width: 100%; height: auto; display: block; }
.errs { display: flex; flex-direction: column; gap: 6px; }
.err { display: grid; grid-template-columns: 90px minmax(0,1fr) minmax(0,1fr) 110px 34px; gap: 10px; align-items: center; font-size: .88rem; padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--sheet); }
.err .s { color: var(--mark); text-decoration: line-through; text-decoration-thickness: 1px; }
.err .c { color: var(--ok); font-weight: 700; }
.tag { font-size: .72rem; padding: 2px 8px; border-radius: 9px; background: var(--accent-soft); color: var(--accent); justify-self: start; }
.errform { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr) 150px auto; gap: 8px; }

/* videos */
.vids { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.vid { display: flex; flex-direction: column; gap: 6px; padding: 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--sheet); text-decoration: none; color: var(--ink); }
.vid:hover { border-color: var(--accent); }
.vid .cat { font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
.vid b { font-size: 1rem; }
.vid span { font-size: .85rem; color: var(--ink-2); }
.vid .go { margin-top: auto; font-size: .82rem; color: var(--accent); }

.toast { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 8px 16px; border-radius: 20px; font-size: .88rem; z-index: 50; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
.syncnote { font-size: .75rem; color: var(--ink-2); padding: 0 8px; }

@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .spine { position: fixed; inset: 0 auto 0 0; width: min(310px, 86vw); z-index: 20; transform: translateX(-102%); transition: transform .2s; padding-top: calc(18px + env(safe-area-inset-top, 0px)); box-shadow: var(--shadow); }
  .spine.open { transform: none; }
  .menubtn { display: inline-flex; }
  .hero { grid-template-columns: minmax(0, 1fr); }
  .topbar { padding-inline: 16px; }
  .sheet { padding-inline: 16px; }
  .tr { grid-template-columns: minmax(0,1fr) auto; }
  .tr .num { display: none; }
  .tr .en { grid-column: 1 / 2; }
  .tr .acts { grid-row: 1 / 3; grid-column: 2; flex-direction: column; }
  .err { grid-template-columns: minmax(0,1fr) 34px; }
  .err > :nth-child(1), .err > :nth-child(4) { display: none; }
  .err .s, .err .c { grid-column: 1; }
  .err .s { grid-row: 1; } .err .c { grid-row: 2; }
  .err > button { grid-row: 1 / 3; grid-column: 2; }
  .errform { grid-template-columns: minmax(0,1fr); }
  .twr { grid-template-columns: 28px minmax(0,1fr); }
  .twr .acts { grid-column: 1 / -1; justify-content: flex-start; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="shell">
  <nav class="spine" id="spine" aria-label="Handbook">
    <div class="brand"><b>Rupok's Speaking Desk</b><span>অনুবাদের মাধ্যমে ইংরেজি বলা</span></div>
    <div class="navgroup">

      <a class="nav" href="#drill" data-view="drill">Translation drill</a>
      <a class="nav" href="#coach" data-view="coach">AI speaking coach</a>
      <a class="nav" href="#tracker" data-view="tracker">Progress tracker</a>
      <a class="nav" href="#videos" data-view="videos">Videos to watch</a>
    </div>

<script>
const DATA = {"parts":[{"title":"Start Here","sub":"","chapters":[{"id":1,"title":"How to Use This Handbook","blocks":[{"t":"p","h":"This handbook is built around one idea: <b>you already think in Bengali, so use Bengali as the bridge to spoken English.<\/b> Every grammar point comes with many Bengali sentences and their natural English translation. When you can turn a Bengali thought into a correct English sentence in two or three seconds, you can speak."},{"t":"p","h":"It is also built around <b>your weak points<\/b>: connectors, jumping between ideas, pronunciation, pauses, tenses (especially the perfect tenses), and singular/plural. Those chapters are longer and come back again in the drills and scenarios."},{"t":"h2","h":"Your Starting Point: IELTS Speaking 6.0"},{"t":"p","h":"At Band 6 an examiner usually hears this: you speak at length, but with some hesitation and repetition; you use a mix of simple and complex sentences, with errors in the complex ones; vocabulary is enough to discuss topics but not always precise; pronunciation is generally clear, but some sounds and stress patterns cause strain."},{"t":"p","h":"To reach Band 7 you need:"},{"t":"ul","items":["<b>Fluency:<\/b> speak at length without noticeable effort; use connectors <i>flexibly<\/i> (not just \"and\", \"but\", \"so\", \"because\").","<b>Vocabulary:<\/b> some less common words, idioms, and collocations; paraphrase when you don't know a word.","<b>Grammar:<\/b> a range of complex structures used <i>frequently<\/i> with mostly error-free sentences — this is where perfect tenses, conditionals, passives, and relative clauses matter.","<b>Pronunciation:<\/b> clear individual sounds, correct word stress, natural pausing and intonation."]},{"t":"box","k":"key","h":"Band 7 is not about big words. It is about <b>flow + accuracy in complex sentences + precise collocations + clear stress and pauses.<\/b>"},{"t":"h2","h":"The Three-Step Translation Method"},{"t":"p","h":"Use every translation table the same way:"},{"t":"ul","items":["<b>Step 1 — Cover.<\/b> Cover the English column with a paper or your hand.","<b>Step 2 — Say it aloud.<\/b> Read the Bengali sentence and <i>say<\/i> the English out loud. Do not write. Speaking is the skill you are training.","<b>Step 3 — Check and repeat.<\/b> Uncover, compare, then say the correct version <b>three times<\/b>, the last time faster and with natural stress."]},{"t":"p","h":"Mark sentences you got wrong with a small dot in the margin. Next time, only practise the dotted sentences. When a sentence gets three dots, copy it into a \"problem notebook\"."},{"t":"box","k":"tip","h":"Do not translate word by word. Bengali puts the verb at the end (আমি ভাত খাই); English puts the verb after the subject (I eat rice). Think: <b>Who? → Does what? → To what/whom? → Where? → When?<\/b>"},{"t":"h2","h":"The English Sentence Skeleton"},{"t":"tb","head":["Subject","Verb","Object","Place","Time"],"rows":[["I","have finished","the report","in the lab","today."],["My students","are working","on their projects","at home","this week."],["The professor","will review","our paper","in his office","tomorrow."]]},{"t":"p","h":"Bengali order: <b>আমি আজ ল্যাবে রিপোর্টটা শেষ করেছি।<\/b> (Subject – Time – Place – Object – Verb). Re-order every time: S → V → O → Place → Time."},{"t":"h2","h":"How the Book Is Organised"},{"t":"ul","items":["<b>Part A – Grammar through Translation:<\/b> parts of speech, singular/plural, articles, agreement, verbs, modals, all 12 tenses with a deep dive on perfect tenses, voice, gerunds, prepositions, phrasal verbs, sentence types, conditionals, narration, clauses, and a long chapter on connectors.","<b>Part B – Vocabulary and Phrases:<\/b> everyday Bengali expressions in English, idioms, collocations, topic vocabulary for academic life, fillers and hedging.","<b>Part C – Your Mistake Clinic:<\/b> Banglish errors, spelling traps, and commonly mispronounced words (with IPA and Bengali script).","<b>Part D – Real-Life Speaking:<\/b> how to organise a one-minute answer without jumping, then many scenarios from PhD life, TA work, professors, students, batchmates, friends, restaurants, travel, presentations, cooking, and home life with your wife — each with useful phrases and a self-evaluation sheet.","<b>Part E – Pronunciation and Fluency:<\/b> difficult sounds, stress, connected speech, breathing and pauses, shadowing, tongue twisters, and a 30-day plan."]},{"t":"h2","h":"Daily Routine (40 minutes)"},{"t":"tb","head":["Time","Activity","From chapter"],"rows":[["10 min","Translation drill aloud (one table)","Part A"],["5 min","Connectors: build 5 sentences with new linkers","Connectors chapter"],["5 min","Pronunciation: 10 words + 3 tongue twisters","Part C, Part E"],["5 min","Shadowing (copy a native speaker for 2 minutes)","Part E"],["10 min","One scenario: record 1 minute, listen, score","Part D"],["5 min","Fix: rewrite your 3 worst sentences and say them again","Your notebook"]]},{"t":"box","k":"try","h":"Before starting, record yourself for one minute on \"Describe your PhD research to a friend who is not in computer science.\" Keep that file. After 30 days, record the same topic again and compare."},{"t":"h2","h":"Key to the Pronunciation Notes"},{"t":"p","h":"IPA is shown between slashes, e.g. <span class=\"ipa\">/ˈkʌmftəbl/<\/span>. Bengali-script hints give the closest sounds in Bengali (e.g. কাম্‌ফ্‌টাবল্‌). The Bengali hint is only a guide: English has sounds that Bengali doesn't have (like <span class=\"ipa\">/θ/<\/span>, <span class=\"ipa\">/ð/<\/span>, /v/, /z/, <span class=\"ipa\">/æ/<\/span>), so always learn the IPA as well. The stressed syllable is the one after the mark ˈ — say it <b>louder, longer, higher<\/b>."},{"t":"tb","head":["IPA","Example","Closest Bengali hint","Note"],"rows":[["<span class=\"ipa\">/iː/<\/span>","see, need","ঈ (long)","long — hold it"],["<span class=\"ipa\">/ɪ/<\/span>","sit, ship","ই (short)","short, relaxed"],["<span class=\"ipa\">/æ/<\/span>","cat, bad","অ্যা","open mouth wide; not এ"],["<span class=\"ipa\">/ʌ/<\/span>","cup, love","আ (short)","short, central"],["<span class=\"ipa\">/ɑː/<\/span>","car, father","আ (long)","long, open"],["<span class=\"ipa\">/ɒ/<\/span>","hot, lot (UK)","অ","round lips slightly"],["<span class=\"ipa\">/ɔː/<\/span>","law, saw","অ (long)","long, round lips"],["<span class=\"ipa\">/ʊ/<\/span>","book, put","উ (short)","short"],["<span class=\"ipa\">/uː/<\/span>","food, school","ঊ (long)","long"],["<span class=\"ipa\">/ə/<\/span>","about, teacher","weak অ / আ","the most common English sound — always unstressed"],["<span class=\"ipa\">/ɜː/<\/span>","bird, work, research","আর্‌ (no r in UK)","lips neutral, tongue in middle"],["<span class=\"ipa\">/eɪ/<\/span>","day, paper","এই","glide"],["<span class=\"ipa\">/aɪ/<\/span>","my, time","আই","glide"],["<span class=\"ipa\">/ɔɪ/<\/span>","boy","অয়","glide"],["<span class=\"ipa\">/aʊ/<\/span>","now, how","আউ","glide"],["<span class=\"ipa\">/əʊ/<\/span>","go, know","ওউ","not a flat ও"],["<span class=\"ipa\">/θ/<\/span>","think, three","থ (tongue between teeth)","air, no voice — not ট or থ exactly"],["<span class=\"ipa\">/ð/<\/span>","this, mother","দ (tongue between teeth)","voiced — not দ exactly"],["/v/","very, have","ভ (top teeth on lower lip)","NOT ব or ভ (bh)"],["/w/","we, work","ওয় (round lips)","no teeth contact"],["/z/","zoo, is","জ় (buzzing s)","NOT জ"],["<span class=\"ipa\">/ʒ/<\/span>","measure, vision","ঝ়/জ় soft","like z with lips rounded"],["<span class=\"ipa\">/ʃ/<\/span>","she, nation","শ",""],["/s/","see, sun","স","not শ!"],["<span class=\"ipa\">/dʒ/<\/span>","job, judge","জ",""],["<span class=\"ipa\">/tʃ/<\/span>","chair","চ",""],["<span class=\"ipa\">/ŋ/<\/span>","sing, thinking","ঙ (as in রং)","no hard g after it"],["/f/","fine, phone","ফ (top teeth on lower lip)","NOT ph (aspirated প)"]]}]}]},{"title":"Part A","sub":"Grammar Through Translation — every rule with many Bengali → English sentences","chapters":[{"id":2,"title":"Parts of Speech in Action","blocks":[{"t":"p","h":"Grammar names matter less than usage. In this chapter you learn each part of speech by <b>using<\/b> it in sentences you would actually say."},{"t":"h2","h":"Nouns (বিশেষ্য)"},{"t":"p","h":"A noun names a person, place, thing, or idea: <i>student, Tuscaloosa, laptop, patience<\/i>. Nouns can be <b>countable<\/b> (a paper, two papers) or <b>uncountable<\/b> (research, information, advice). Singular/plural gets its own chapter because it is one of your weak points."},{"t":"h3","h":"Abstract nouns you need for speaking"},{"t":"p","h":"Abstract nouns make your speech sound more mature: instead of \"I was very worried\", say \"<b>My biggest worry<\/b> was…\"."},{"t":"tr","rows":[{"n":1,"bn":"আমার সবচেয়ে বড় চিন্তা ছিল ডেডলাইন।","en":"My biggest worry was the deadline.","note":"","say":"My biggest worry was the deadline."},{"n":2,"bn":"ধৈর্য গবেষণার সবচেয়ে জরুরি গুণ।","en":"Patience is the most important quality in research.","note":"","say":"Patience is the most important quality in research."},{"n":3,"bn":"তার আত্মবিশ্বাস দিন দিন বাড়ছে।","en":"His confidence is growing day by day.","note":"","say":"His confidence is growing day by day."},{"n":4,"bn":"আমি তার সততাকে সম্মান করি।","en":"I respect his honesty.","note":"","say":"I respect his honesty."},{"n":5,"bn":"সফলতার পেছনে কঠোর পরিশ্রম আছে।","en":"There is hard work behind success.","note":"","say":"There is hard work behind success."},{"n":6,"bn":"এই সিদ্ধান্তটা নেওয়া সহজ ছিল না।","en":"This decision wasn't easy to make.","note":"\"make a decision\", not \"take a decision\" (British \"take\" is also used, but \"make\" is safer)","say":"This decision wasn't easy to make."},{"n":7,"bn":"তার উপস্থিতি পুরো ক্লাসকে শান্ত করে দিল।","en":"Her presence calmed the whole class.","note":"","say":"Her presence calmed the whole class."},{"n":8,"bn":"আমার কাছে স্বাধীনতার মানে হলো নিজের সিদ্ধান্ত নিজে নেওয়া।","en":"To me, freedom means making my own decisions.","note":"","say":"To me, freedom means making my own decisions."},{"n":9,"bn":"তোমার পরামর্শের জন্য ধন্যবাদ।","en":"Thanks for your advice.","note":"advice = uncountable, no \"advices\"","say":"Thanks for your advice."},{"n":10,"bn":"বন্ধুত্ব টিকিয়ে রাখতে সময় লাগে।","en":"Keeping a friendship alive takes time.","note":"","say":"Keeping a friendship alive takes time."},{"n":11,"bn":"তার জ্ঞানের গভীরতা আমাকে অবাক করে।","en":"The depth of his knowledge amazes me.","note":"","say":"The depth of his knowledge amazes me."},{"n":12,"bn":"এই সমস্যার সমাধান এখনও পাওয়া যায়নি।","en":"A solution to this problem hasn't been found yet.","note":"solution <b>to<\/b>, not \"solution of\"","say":"A solution to this problem hasn't been found yet."},{"n":13,"bn":"আমার উদ্বেগের কারণ হলো ফান্ডিং।","en":"The reason for my anxiety is funding.","note":"","say":"The reason for my anxiety is funding."},{"n":14,"bn":"আমি তার দয়ার কথা কখনো ভুলব না।","en":"I will never forget her kindness.","note":"","say":"I will never forget her kindness."},{"n":15,"bn":"নিয়মিত অনুশীলনই উন্নতির চাবিকাঠি।","en":"Regular practice is the key to improvement.","note":"key <b>to<\/b>","say":"Regular practice is the key to improvement."}]},{"t":"h3","h":"Compound nouns (noun + noun)"},{"t":"p","h":"English often puts two nouns together. The first noun works like an adjective and stays <b>singular<\/b>."},{"t":"tr","rows":[{"n":16,"bn":"এটা একটা পাঁচ পাতার রিপোর্ট।","en":"It's a five-page report.","note":"not \"five-pages report\"","say":"It's a five-page report."},{"n":17,"bn":"আমি একটা তিন বছরের প্রজেক্টে কাজ করছি।","en":"I am working on a three-year project.","note":"","say":"I am working on a three-year project."},{"n":18,"bn":"ল্যাবের দরজা বন্ধ।","en":"The lab door is closed.","note":"","say":"The lab door is closed."},{"n":19,"bn":"আমার পাসওয়ার্ড রিসেট করতে হবে।","en":"I need to reset my password.","note":"","say":"I need to reset my password."},{"n":20,"bn":"গবেষণা প্রস্তাবটা জমা দিয়েছি।","en":"I've submitted the research proposal.","note":"","say":"I've submitted the research proposal."},{"n":21,"bn":"ক্লাসরুমের প্রজেক্টরটা কাজ করছে না।","en":"The classroom projector isn't working.","note":"","say":"The classroom projector isn't working."},{"n":22,"bn":"এটা একটা দশ মিনিটের হাঁটা পথ।","en":"It's a ten-minute walk.","note":"","say":"It's a ten-minute walk."},{"n":23,"bn":"বাসস্টপটা কোথায়?","en":"Where is the bus stop?","note":"","say":"Where is the bus stop?"},{"n":24,"bn":"আমাদের গ্রুপ মিটিং প্রতি সোমবার।","en":"Our group meeting is every Monday.","note":"","say":"Our group meeting is every Monday."},{"n":25,"bn":"আমার একটা বিশ ডলারের নোট আছে।","en":"I have a twenty-dollar bill.","note":"US: bill; UK: note","say":"I have a twenty-dollar bill."}]},{"t":"h2","h":"Pronouns (সর্বনাম)"},{"t":"tb","head":["Subject","Object","Possessive adjective","Possessive pronoun","Reflexive"],"rows":[["I","me","my","mine","myself"],["you","you","your","yours","yourself / yourselves"],["he","him","his","his","himself"],["she","her","her","hers","herself"],["it","it","its","—","itself"],["we","us","our","ours","ourselves"],["they","them","their","theirs","themselves"]]},{"t":"box","k":"warn","h":"Bengali সে = he <b>or<\/b> she. Many Bengali speakers mix <b>he/she<\/b> while speaking (\"My wife… he said\"). Before you speak about a person, decide: man → he/him/his; woman → she/her/her. Practise the table below until it is automatic."},{"t":"tr","rows":[{"n":26,"bn":"আমার স্ত্রী বলল সে আজ রান্না করবে।","en":"My wife said she would cook today.","note":"wife → she (not he)","say":"My wife said she would cook today."},{"n":27,"bn":"আমার সুপারভাইজার বললেন তিনি ব্যস্ত।","en":"My supervisor said she was busy.","note":"if your supervisor is a woman → she","say":"My supervisor said she was busy."},{"n":28,"bn":"আমার ছোট ভাই তার ল্যাপটপ হারিয়ে ফেলেছে।","en":"My younger brother has lost his laptop.","note":"","say":"My younger brother has lost his laptop."},{"n":29,"bn":"আমার বোন তার নিজের ব ctive and adverb (no \"fastly\")","say":"He drives very fast."},{"n":135,"bn":"সে দেরিতে এসেছে।","en":"She came late.","note":"lately = recently, not \"in a late way\"","say":"She came late."},{"n":136,"bn":"আমার শরীরটা ভালো লাগছে না।","en":"I don't feel well.","note":"","say":"I don't feel well."},{"n":137,"bn":"খাবারটা খুব ভালো লাগছে।","en":"The food tastes really good.","note":"after taste/smell/look/feel/sound → adjective","say":"The food tastes really good."},{"n":138,"bn":"তোমার আইডিয়াটা দারুণ শোনাচ্ছে।","en":"Your idea sounds great.","note":"","say":"Your idea sounds great."},{"n":139,"bn":"তোমাকে ক্লান্ত দেখাচ্ছে।","en":"You look tired.","note":"","say":"You look tired."}]},{"t":"h2","h":"Conjunctions and Interjections (quick view)"},{"t":"p","h":"Conjunctions (and, but, or, so, because, although…) are covered in detail in the <b>Connectors<\/b> chapter. Interjections are short emotional words used in conversation:"},{"t":"tr","rows":[{"n":140,"bn":"বাহ! দারুণ!","en":"Wow! That's great!","note":"","say":"Wow! That's great!"},{"n":141,"bn":"উফ, কী গরম!","en":"Ugh, it's so hot!","note":"","say":"Ugh, it's so hot!"},{"n":142,"bn":"আহা, বেচারা!","en":"Oh, poor thing!","note":"","say":"Oh, poor thing!"},{"n":143,"bn":"ইশ! আমি ভুলে গেছি!","en":"Oops! I forgot! / Oh no, I forgot!","note":"","say":"Oops! I forgot!. Oh no, I forgot!"},{"n":144,"bn":"আরে! তুমি এখানে?","en":"Hey! What are you doing here?","note":"","say":"Hey! What are you doing here?"},{"n":145,"bn":"হুম, ভেবে দেখি।","en":"Hmm, let me think.","note":"","say":"Hmm, let me think."},{"n":146,"bn":"আচ্ছা, বুঝেছি।","en":"Oh, I see. / Got it.","note":"","say":"Oh, I see.. Got it."},{"n":147,"bn":"ছি!","en":"Yuck! / Gross!","note":"","say":"Yuck!. Gross!"},{"n":148,"bn":"যাক বাবা!","en":"Phew! / What a relief!","note":"","say":"Phew!. What a relief!"},{"n":149,"bn":"হায় হায়!","en":"Oh my God! / Oh dear!","note":"","say":"Oh my God!. Oh dear!"}]}]},{"id":3,"title":"Singular, Plural, Countable and Uncountable","blocks":[{"t":"p","h":"This is one of your weak points. In Bengali, we often don't mark plural clearly (তিনটা বই, অনেক ছাত্র — \"বই\" and \"ছাত্র\" don't change). In English, <b>the noun must change<\/b>: three book<b>s<\/b>, many student<b>s<\/b>. When you speak fast, the final <b>-s<\/b> is the first thing that disappears. Train your ear and mouth to say it."},{"t":"h2","h":"Regular Plurals and Pronunciation of -s"},{"t":"tb","head":["Rule","Singular","Plural"],"rows":[["most nouns + s","paper, student","papers, students"],["-s, -sh, -ch, -x, -z + es","class, dish, match, box","classes, dishes, matches, boxes"],["consonant + y → ies","city, study, policy","cities, studies, policies"],["vowel + y → + s","day, key, survey","days, keys, surveys"],["-f / -fe → ves (many)","life, wife, knife, half, shelf","lives, wives, knives, halves, shelves"],["-f → s (some)","roof, chief, belief, proof","roofs, chiefs, beliefs, proofs"],["-o → es (some)","tomato, potato, hero","tomatoes, potatoes, heroes"],["-o → s (some)","photo, piano, video, radio","photos, pianos, videos, radios"]]},{"t":"p","h":"The plural ending has <b>three sounds<\/b>:"},{"t":"tb","head":["Sound","After","Examples"],"rows":[["/s/","voiceless sounds: p, t, k, f, θ","<b>cups, students, books, laughs, months<\/b>"],["/z/","voiced sounds and vowels","<b>papers, jobs, days, files, problems, friends<\/b>"],["<span class=\"ipa\">/ɪz/<\/span> (extra syllable)","s, z, ʃ, tʃ, dʒ, ʒ sounds","<b>classes, buses, dishes, matches, languages, pages<\/b>"]]},{"t":"box","k":"tip","h":"Most Bengali speakers say every plural as /s/. Say \"papers\" as <span class=\"ipa\">/ˈpeɪpəz/<\/span> — <b>buzz<\/b> at the end. And \"classes\" has <b>two<\/b> syllables, \"pages\" has two, \"languages\" has three: <span class=\"ipa\">/ˈlæŋɡwɪdʒɪz/<\/span>."},{"t":"h2","h":"Irregular Plurals"},{"t":"tb","head":["Singular","Plural","Singular","Plural"],"rows":[["man","men","woman","women <span class=\"ipa\">/ˈwɪmɪn/<\/span>"],["child","children","person","people"],["foot","feet","tooth","teeth"],["mouse","mice","goose","geese"],["criterion","criteria","phenomenon","phenomena"],["datum","data","medium","media"],["analysis","analyses","hypothesis","hypotheses"],["thesis","theses","basis","bases"],["crisis","crises","appendix","appendices"],["index","indices / indexes","matrix","matrices"],["vertex","vertices","axis","axes"],["sheep","sheep","fish","fish (fishes = kinds)"],["series","series","species","species"],["aircraft","aircraft","means","means"]]},{"t":"box","k":"note","h":"In computer science, \"data\" is usually treated as uncountable and singular: \"The data <b>is<\/b> noisy.\" In formal science writing, some people say \"The data <b>are<\/b> noisy.\" Both are accepted; in speaking, \"is\" is more natural."},{"t":"h2","h":"Uncountable Nouns — No Plural, No \"a/an\""},{"t":"p","h":"These nouns <b>never<\/b> take -s and never take \"a/an\". They use a singular verb."},{"t":"tb","head":["Group","Uncountable nouns"],"rows":[["Academic","research, information, knowledge, evidence, feedback, progress, work, homework, advice, equipment, software, hardware, data, literature, training"],["Daily life","furniture, luggage, baggage, money, traffic, weather, news, rice, bread, water, milk, food (general), hair (on head), fruit (general)"],["Abstract","help, fun, patience, happiness, luck, behaviour, permission, transportation, accommodation, scenery, vocabulary, machinery"]]},{"t":"p","h":"To count them, use <b>a piece of / an item of / a unit of<\/b>:"},{"t":"tr","rows":[{"n":150,"bn":"আমি তোমাকে একটা পরামর্শ দিই।","en":"Let me give you a piece of advice. / Let me give you some advice.","note":"NOT \"an advice\"","say":"Let me give you a piece of advice.. Let me give you some advice."},{"n":151,"bn":"আমার একটা খবর আছে।","en":"I have some news. / I have a piece of news.","note":"NOT \"a news\"; news + is","say":"I have some news.. I have a piece of news."},{"n":152,"bn":"খবরটা ভালো।","en":"The news is good.","note":"NOT \"news are\"","say":"The news is good."},{"n":153,"bn":"আমি অনেক তথ্য পেয়েছি।","en":"I got a lot of information.","note":"NOT \"informations\"","say":"I got a lot of information."},{"n":154,"bn":"আমার গবেষণা ভালোই এগোচ্ছে।","en":"My research is progressing well.","note":"NOT \"my researches\"","say":"My research is progressing well."},{"n":155,"bn":"আমি অনেক ভালো ফিডব্যাক পেয়েছি।","en":"I've received a lot of good feedback.","note":"NOT \"feedbacks\"","say":"I've received a lot of good feedback."},{"n":156,"bn":"আমার কাছে বেশি টাকা নেই।","en":"I don't have much money.","note":"","say":"I don't have much money."},{"n":157,"bn":"ঘরে অনেক আসবাবপত্র আছে।","en":"There is a lot of furniture in the room.","note":"NOT \"furnitures\", \"are\"","say":"There is a lot of furniture in the room."},{"n":158,"bn":"আমার লাগেজ হারিয়ে গেছে।","en":"My luggage has been lost. / My luggage is lost.","note":"","say":"My luggage has been lost.. My luggage is lost."},{"n":159,"bn":"আমার দুটো ব্যাগ আছে।","en":"I have two bags.","note":"bag is countable","say":"I have two bags."},{"n":160,"bn":"আজ রাস্তায় অনেক ট্রাফিক।","en":"There's a lot of traffic on the road today.","note":"","say":"There's a lot of traffic on the road today."},{"n":161,"bn":"তার চুল খুব লম্বা।","en":"Her hair is very long.","note":"NOT \"hairs are\" (hairs = individual strands)","say":"Her hair is very long."},{"n":162,"bn":"আমার স্যুপে দুটো চুল!","en":"There are two hairs in my soup!","note":"","say":"There are two hairs in my soup!"},{"n":163,"bn":"তোমার সাহায্যের জন্য ধন্যবাদ।","en":"Thanks for your help.","note":"","say":"Thanks for your help."},{"n":164,"bn":"আমি অনেক কাজ করেছি আজ।","en":"I've done a lot of work today.","note":"work = uncountable","say":"I've done a lot of work today."},{"n":165,"bn":"আমি দুটো চাকরির আবেদন করেছি।","en":"I've applied for two jobs.","note":"job = countable","say":"I've applied for two jobs."},{"n":166,"bn":"আমার অনেক হোমওয়ার্ক আছে।","en":"I have a lot of homework.","note":"NOT \"homeworks\"","say":"I have a lot of homework."},{"n":167,"bn":"ল্যাবে নতুন যন্ত্রপাতি এসেছে।","en":"New equipment has arrived in the lab.","note":"NOT \"equipments\"","say":"New equipment has arrived in the lab."},{"n":168,"bn":"ভ্রমণটা খুব মজার ছিল।","en":"The trip was a lot of fun.","note":"","say":"The trip was a lot of fun."},{"n":169,"bn":"তুমি কি আমাকে দু'টুকরো রুটি দিতে পারবে?","en":"Could you give me two slices of bread?","note":"","say":"Could you give me two slices of bread?"},{"n":170,"bn":"এক গ্লাস পানি দেবেন?","en":"Could I have a glass of water?","note":"","say":"Could I have a glass of water?"},{"n":171,"bn":"আমি এক কাপ চা খাব।","en":"I'll have a cup of tea.","note":"","say":"I'll have a cup of tea."},{"n":172,"bn":"আমাদের এখনও অনেক অগ্রগতি করা বাকি।","en":"We still have a lot of progress to make.","note":"NOT \"progresses\"","say":"We still have a lot of progress to make."},{"n":173,"bn":"এই বিষয়ে প্রচুর প্রমাণ আছে।","en":"There is plenty of evidence on this.","note":"NOT \"evidences\"","say":"There is plenty of evidence on this."},{"n":174,"bn":"তার শব্দভাণ্ডার অনেক সমৃদ্ধ।","en":"His vocabulary is very rich.","note":"NOT \"vocabularies\"","say":"His vocabulary is very rich."},{"n":175,"bn":"এই সফটওয়্যারটা ফ্রি।","en":"This software is free.","note":"NOT \"softwares\"","say":"This software is free."},{"n":176,"bn":"আমি নতুন থাকার জায়গা খুঁজছি।","en":"I'm looking for new accommodation.","note":"NOT \"accommodations\" (UK); US sometimes uses plural","say":"I'm looking for new accommodation."}]},{"t":"h2","h":"much / many, few / little, a lot of"},{"t":"tb","head":["With countable plural","With uncountable","With both"],"rows":[["many students","much time","a lot of / lots of"],["a few papers (= some)","a little money (= some)","some / any"],["few friends (= almost none)","little hope (= almost none)","plenty of"],["fewer mistakes","less noise","more / most"],["a number of reasons","an amount of energy","no"]]},{"t":"tr","rows":[{"n":1 "","say":"I usually go to bed at eleven."},{"n":279,"bn":"বাচ্চারা স্কুলে গেছে।","en":"The kids have gone to school.","note":"","say":"The kids have gone to school."},{"n":280,"bn":"আমি তাকে দেখতে স্কুলে গিয়েছিলাম।","en":"I went to the school to see him.","note":"visiting the building → \"the\"","say":"I went to the school to see him."},{"n":281,"bn":"সে হাসপাতালে ভর্তি।","en":"He is in hospital. (UK) / He is in the hospital. (US)","note":"","say":"He is in hospital.. He is in the hospital."},{"n":282,"bn":"আমি বাংলাদেশ থেকে এসেছি।","en":"I'm from Bangladesh.","note":"","say":"I'm from Bangladesh."},{"n":283,"bn":"আমি কম্পিউটার সায়েন্সে পিএইচডি করছি।","en":"I'm doing a PhD in computer science.","note":"","say":"I'm doing a PhD in computer science."},{"n":284,"bn":"প্রকৃতি আমাকে শান্তি দেয়।","en":"Nature gives me peace.","note":"","say":"Nature gives me peace."},{"n":285,"bn":"আমি সাধারণত কফির চেয়ে চা পছন্দ করি।","en":"I generally prefer tea to coffee.","note":"","say":"I generally prefer tea to coffee."},{"n":286,"bn":"টাকা সব কিছু না।","en":"Money isn't everything.","note":"","say":"Money isn't everything."},{"n":287,"bn":"আমি প্রতি সোমবার ক্লাস নিই।","en":"I teach classes every Monday.","note":"","say":"I teach classes every Monday."},{"n":288,"bn":"তার ক্যান্সার হয়েছে।","en":"He has cancer.","note":"most illnesses: no article (but \"a cold\", \"a headache\", \"the flu\")","say":"He has cancer."},{"n":289,"bn":"আমার মাথাব্যথা করছে।","en":"I have a headache.","note":"","say":"I have a headache."},{"n":290,"bn":"আমার ঠান্ডা লেগেছে।","en":"I have a cold.","note":"","say":"I have a cold."}]},{"t":"h2","h":"Article Mistakes Bengali Speakers Make"},{"t":"mx","rows":[["I am PhD student.","I am <b>a<\/b> PhD student.","singular countable needs an article"],["He is a honest man.","He is <b>an<\/b> honest man.","silent h → vowel sound"],["She is an university teacher.","She is <b>a<\/b> university teacher.","<span class=\"ipa\">/juː/<\/span> = consonant sound"],["I wen iend of mine lives in New York."},{"n":304,"bn":"দলের প্রত্যেক সদস্য উপস্থিত।","en":"Every member of the team is present.","note":"","say":"Every member of the team is present."},{"n":305,"bn":"আমার বাবা-মা ঢাকায় থাকেন।","en":"My parents live in Dhaka.","note":"","say":"My parents live in Dhaka."},{"n":306,"bn":"সে আর আমি একই ক্লাসে পড়ি।","en":"He and I are in the same class.","note":"A and B → plural","say":"He and I are in the same class."},{"n":307,"bn":"রুটি আর ডাল আমার প্রিয় নাস্তা।","en":"Bread and lentils are my favourite breakfast. / Bread and dal is my favourite breakfast.","note":"one combined dish → singular is possible","say":"Bread and lentils are my favourite breakfast.. Bread and dal is my favourite breakfast."},{"n":308,"bn":"হয় তুমি নয় সে দায়ী।","en":"Either you or he is responsible.","note":"either/neither…or/nor → verb agrees with the nearer subject","say":"Either you or he is responsible."},{"n":309,"bn":"আমার মা বা আমার বোনেরা কেউ জানে না।","en":"Neither my mother nor my sisters know.","note":"","say":"Neither my mother nor my sisters know."},{"n":310,"bn":"আমার বোনেরা বা আমার মা কেউ জানেন না।","en":"Neither my sisters nor my mother knows.","note":"","say":"Neither my sisters nor my mother knows."},{"n":311,"bn":"প্রফেসর এবং তার ছাত্ররা আসছেন।","en":"The professor, along with his students, is coming.","note":"\"along with / as well as / together with\" doesn't change the subject","say":"The professor, along with his students, is coming."},{"n":312,"bn":"ডেটা সংগ্রহ করা সময়সাপেক্ষ।","en":"Collecting data is time-consuming.","note":"-ing subject → singular","say":"Collecting data is time-consuming."},{"n":313,"bn":"ভালো রেফারেন্স পাওয়া সহজ না।","en":"Finding good references isn't easy.","note":"","say":"Finding good references isn't easy."},{"n":314,"bn":"টেবিলের উপর অনেকগুলো বই আছে।","en":"There are a lot of books on the table.","note":"","say":"There are a lot of books on the table."},{"n":315,"bn":"টেবিলের উপর একটা বই আর দুটো কলম আছে।",  Verbs (be, seem, look, feel, sound, become, get, stay)"},{"t":"p","h":"Linking verbs are followed by an <b>adjective<\/b>, not an adverb."},{"t":"tr","rows":[{"n":379,"bn":"তোমাকে খুশি দেখাচ্ছে।","en":"You look happy.","note":"","say":"You look happy."},{"n":380,"bn":"ব্যাপারটা জটিল মনে হচ্ছে।","en":"It seems complicated.","note":"","say":"It seems complicated."},{"n":381,"bn":"খাবারটার গন্ধ দারুণ।","en":"The food smells amazing.","note":"","say":"The food smells amazing."},{"n":382,"bn":"তোমার কণ্ঠ ক্লান্ত শোনাচ্ছে।","en":"You sound tired.","note":"","say":"You sound tired."},{"n":383,"bn":"আমার ঘুম পাচ্ছে।","en":"I'm getting sleepy.","note":"","say":"I'm getting sleepy."},{"n":384,"bn":"আবহাওয়া ঠান্ডা হয়ে যাচ্ছে।","en":"The weather is getting cold.","note":"","say":"The weather is getting cold."},{"n":385,"bn":"সে বিখ্যাত হয়ে গেছে।","en":"She has become famous.","note":"","say":"She has become famous."},{"n":386,"bn":"শান্ত থাকো।","en":"Stay calm.","note":"","say":"Stay calm."},{"n":387,"bn":"দুধটা নষ্ট হয়ে গেছে।","en":"The milk has gone bad.","note":"","say":"The milk has gone bad."},{"n":388,"bn":"সে রাগে লাল হয়ে গেল।","en":"He turned red with anger.","note":"","say":"He turned red with anger."},{"n":389,"bn":"তার স্বপ্ন সত্যি হয়েছে।","en":"Her dream has come true.","note":"","say":"Her dream has come true."},{"n":390,"bn":"আমি অসুস্থ বোধ করছি।","en":"I feel sick.","note":"","say":"I feel sick."}]},{"t":"h2","h":"Transitive and Intransitive Verbs"},{"t":"p","h":"<b>Transitive<\/b> verbs need an object (<i>discuss something, explain something, reach somewhere<\/i>). <b>Intransitive<\/b> verbs don't (<i>arrive, happen, sleep, go<\/i>). Bengali speakers often add a wrong preposition to transitive verbs."},{"t":"mx","rows":[["discuss about the problem","discuss the problem","discuss = transitive (but \"talk about\")"],["explain me the idea","explain the idea <b>to me<\/b>","explain + thing + to + person"],["reach to the airport","reach the airport / arrive <b>at<\/b> the airport","reach = no preposition"],["enter into the room","enter the room","enter = no preposition"],["emphasise on this point","emphasise this point / put emphasis <b>on<\/b> this point",""],["request for help","request help / make a request <b>for<\/b> help",""],["attend to the meeting","attend the meeting","\"attend to\" = deal with something"],["answer to the question","answer the question / reply <b>to<\/b> the email",""],["return back","return / go back","\"back\" is already in \"return\""],["contact with him","contact him",""],["mention about it","mention it",""],["order for food","order food",""],["approach to the professor","approach the professor",""],["I am agree","I agree","agree is a verb, not an adjective"],["It is happened.","It happened. / It has happened.","happen is intransitive → no passive"],["The accident was occurred.","The accident occurred.","occur is intransitive"],["He was died.","He died. / He is dead.",""]],"say":["discuss the problem","explain the idea to me","reach the airport. arrive at the airport","enter the room","emphasise this point. put emphasis on this point","request help. make a request for help","attend the meeting","answer the question. reply to the email","return. go back","contact him","mention it","order food","approach the professor","I agree","It happened.. It has happened.","The accident occurred.","He died.. He is dead."]},{"t":"h2","h":"Stative vs Dynamic Verbs"},{"t":"p","h":"<b>Stative<\/b> verbs describe states, not actions. They are <b>not<\/b> normally used in continuous (-ing) forms."},{"t":"tb","head":["Group","Stative verbs (usually no -ing)"],"rows":[["Mind","know, believe, understand, remember, forget, mean, realise, suppose, doubt"],["Feeling","like, love, hate, prefer, want, need, wish"],["Possession","have (= own), own, belong, possess, contain, include"],["Senses","see, hear, smell, taste (= has a taste), seem, appear, sound"],["Other","cost, weigh, matter, depend, consist, deserve, fit"]]},{"t":"mx","rows":[["I am knowing him.","I know him.","stative"],["I am understanding now.","I understand now.","stative"],["I am having a car.","I have a car.","have = possess (but \"I'm having lunch\" is fine — action)"],["This is belonging to me.","This belongs to me.",""],["I am wanting to go.","I want to go.",""],["It is depending on the data.","It depends on the data.",""],["I'm loving it.","I love it.","(the advertising slogan is informal)"]],"say":["I know him.","I understand now.","I have a car.","This belongs to me.","I want to go.","It depends on the data.","I love it."]},{"t":"box","k":"note","h":"Some verbs change meaning: \"I <b>think<\/b> it's good\" (opinion — stative) vs \"I'm <b>thinking<\/b> about my research\" (process — dynamic). \"She <b>has<\/b> a car\" vs \"She <b>is having<\/b> dinner\". \"It <b>tastes<\/b> sweet\" vs \"He <b>is tasting<\/b> the soup\"."},{"t":"h2","h":"Causative Verbs: have / get / make / let / help"},{"t":"tb","head":["Structure","Meaning","Example"],"rows":[["make + person + V1","force","My boss <b>made me redo<\/b> the slides."],["let + person + V1","allow","My advisor <b>let me take<\/b> a week off."],["have + person + V1","ask a professional","I <b>had the technician fix<\/b> my laptop."],["get + person + to + V1","persuade","I <b>got my friend to proofread<\/b> my paper."],["have/get + thing + V3","service done for you","I <b>had my laptop fixed<\/b>. I <b>got my hair cut<\/b>."],["help + person + (to) V1","assist","She <b>helped me (to) prepare<\/b> the talk."]]},{"t":"tr","rows":[{"n":391,"bn":"আমি চুল কাটিয়েছি।","en":"I got my hair cut. / I had my hair cut.","note":"NOT \"I cut my hair\" (that means you cut it yourself)","say":"I got my hair cut.. I had my hair cut."},{"n":392,"bn":"আমি গাড়িটা সার্ভিসিং করিয়েছি।","en":"I had my car serviced.","note":"","say":"I had my car serviced."},{"n":393,"bn":"আমাকে পেপারটা প্রুফরিড করাতে হবে।","en":"I need to get my paper proofread.","note":"","say":"I need to get my paper proofread."},{"n":394,"bn":"আমার প্রফেসর আমাকে স্লাইডগুলো আবার বানাতে বাধ্য করলেন।","en":"My professor made me redo the slides.","note":"","say":"My professor made me redo the slides."},{"n":395,"bn":"আমার মা আমাকে রাতে বাইরে যেতে দিতেন না।","en":"My mother didn't let me go out at night.","note":"","say":"My mother didn't let me go out at night."},{"n":396,"bn":"আমি ছাত্রদের দিয়ে প্রজেক্ট রিপোর্ট জমা দেওয়ালাম।","en":"I had the students submit their project reports.","note":"","say":"I had the students submit their project reports."},{"n":397,"bn":"আমি আমার বন্ধুকে দিয়ে কোডটা চেক করিয়েছি।","en":"I got my friend to check the code.","note":"","say":"I got my friend to check the code."},{"n":398,"bn":"সে আমাকে বাসা খুঁজতে সাহায্য করেছে।","en":"She helped me find an apartment.","note":"","say":"She helped me find an apartment."},{"n":399,"bn":"আমাকে একটু ভাবতে দাও।","en":"Let me think for a moment.","note":"","say":"Let me think for a moment."},{"n":400,"bn":"আমাকে পরিচয় করিয়ে দিতে দিন।","en":"Let me introduce myself.","note":"","say":"Let me introduce myself."},{"n":401,"bn":"সিনেমাটা আমাকে কাঁদিয়েছে।","en":"The movie made me cry.","note":"","say":"The movie made me cry."},{"n":402,"bn":"আমি বাসার ইন্টারনেট ঠিক করাব।","en":"I'll get the home internet fixed.","note":"","say":"I'll get the home internet fixed."},{"n":403,"bn":"আমি দাঁত পরিষ্কার করাতে ডেন্টিস্টের কাছে গিয়েছিলাম।","en":"I went to the dentist to have my teeth cleaned.","note":"","say":"I went to the dentist to have my teeth cleaned."},{"n":404,"bn":"আমার ফোনের স্ক্রিন বদলাতে হবে।","en":"I need to have my phone screen replaced.","note":"","say":"I need to have my phone screen replaced."},{"n":405,"bn":"আমাকে সারারাত অপেক্ষা করতে বাধ্য করো না।","en":"Don't make me wait all night.","note":"","say":"Don't make me wait all night."}]}]},{"id":7,"title":"Modal Verbs","blocks":[{"t":"p","h":"Modals add meaning: ability, permission, advice, obligation, possibility. Rule: <b>modal + base verb<\/b> (no -s, no to, no -ed): <i>She can swim.<\/i> (NOT \"She can swims\" / \"She can to swim\".)"},{"t":"h2","h":"Overview"},{"t":"tb","head":["Modal","Main meanings","Example"],"rows":[["can","ability, permission, possibility","I can code in Python. Can I come in?"],["could","past ability, polite request, possibility","Could you help me? It could rain."],["may","formal permission, possibility (50%)","May I ask a question? It may be late."],["might","weaker possibility (30%)","I might go to the conference."],["must","strong obligation (from me), certainty","I must finish this today. He must be tired."],["have to","obligation (from rules/others)","I have to submit by Friday."],["should / ought to","advice, expectation","You should rest. It should arrive tomorrow."],["would","polite request, imagination, past habit","Would you like tea? I would travel more."],["will","future, willingness, promise","I'll help you."],["shall","offers/suggestions (I/we)","Shall we start?"],["need (to)","necessity","You need to sign this. You needn't come."],["used to","past habit (no longer)","I used to live in Dhaka."],["would rather / had better","preference / strong advice","I'd rather stay home. You'd better hurry."]]},{"t":"h2","h":"Ability: can, could, be able to"},{"t":"tr","rows":[{"n":406,"bn":"আমি তিনটা প্রোগ্রামিং ভাষা জানি।","en":"I can code in three programming languages.","note":"","say":"I can code in three programming languages."},{"n":407,"bn":"আমি সাঁতার কাটতে পারি না।","en":"I can't swim.","note":"","say":"I can't swim."},{"n":408,"bn":"ছোটবেলায় আমি খুব জোরে দৌড়াতে পারতাম।","en":"When I was a child, I could run very fast.","note":"","say":"When I was a child, I could run very fast."},{"n":409,"bn":"শেষ পর্যন্ত আমি ভিসা পেতে সক্ষম হয়েছিলাম।","en":"In the end, I was able to get the visa.","note":"single past success → was able to (not could)","say":"In the end, I was able to get the visa."},{"n":410,"bn":"আগামী বছরের মধ্যে আমি সাবলীলভাবে ইংরেজি বলতে পারব।","en":"I'll be able to speak English fluently by next year.","note":"future ability → will be able to","say":"I'll be able to speak English fluently by next year."},{"n":411,"bn":"আমি গতকাল ঘুমাতে পারিনি।","en":"I couldn't sleep last night.","note":"","say":"I couldn't sleep last night."},{"n":412,"bn":"আমি এখনও এটা বিশ্বাস করতে পারছি না।","en":"I still can't believe it.","note":"","say":"I still can't believe it."},{"n":413,"bn":"আমি তোমার কথা শুনতে পাচ্ছি না।","en":"I can't hear you.","note":"","say":"I can't hear you."},{"n":414,"bn":"আমি পুরো জিনিসটা বুঝতে পেরেছি।","en":"I've been able to understand the whole thing.","note":"","say":"I've been able to understand the whole thing."},{"n":415,"bn":"সে কি গাড়ি চালাতে পারে?","en":"Can she drive?","note":"","say":"Can she drive?"}]},{"t":"h2","h":"Permission and Requests"},{"t":"tr","rows":[{"n":416,"bn":"আমি কি ভেতরে আসতে পারি?","en":"May I come in? / Can I come in?","note":"","say":"May I come in?. Can I come in?"},{"n":417,"bn":"আমি কি আপনার কলমটা ধার নিতে পারি?","en":"Could I borrow your pen?","note":"","say":"Could I borrow your pen?"},{"n":418,"bn":"তুমি কি জানালাটা খুলে দেবে?","en":"Could you open the window, please?","note":"","say":"Could you open the window, please?"},{"n":419,"bn":"আপনি কি আরেকবার বলবেন?","en":"Could you say that again, please? / Sorry, could you repeat that?","note":"","say":"Could you say that again, please?. Sorry, could you repeat that?"},{"n":420,"bn":"আপনি কি একটু আস্তে বলবেন?","en":"Would you mind speaking a bit more slowly?","note":"","say":"Would you mind speaking a bit more slowly?"},{"n":421,"bn":"তুমি কিছু মনে না করলে আমি জানালাটা খুলি?","en":"Do you mind if I open the window?","note":"","say":"Do you mind if I open the window?"},{"n":422,"bn":"আপনি কি আমাকে একটা সুপারিশপত্র লিখে দিতে পারবেন?","en":"Would you be able to write me a recommendation letter?","note":"","say":"Would you be able to write me a recommendation letter?"},{"n":423,"bn":"আমি কি একটা প্রশ্ন করতে পারি?","en":"May I ask a question? / Can I ask you something?","note":"","say":"May I ask a question?. Can I ask you something?"},{"n":424,"bn":"ক্লাসে ফোন ব্যবহার করা যাবে না।","en":"You can't use phones in class. / Phones are not allowed in class.","note":"","say":"You can't use phones in class.. Phones are not allowed in class."},{"n":425,"bn":"তুমি চাইলে আগে চলে যেতে পারো।","en":"You can leave early if you want.","note":"","say":"You can leave early if you want."},{"n":426,"bn":"আমাকে কি আজকে একটু আগে যেতে দেবেন?","en":"Would it be okay if I left a bit early today?","note":"","say":"Would it be okay if I left a bit early today?"},{"n":427,"bn":"আপনার কি কয়েক মিনিট সময় হবে?","en":"Do you have a few minutes? / Could I have a few minutes of your time?","note":"","say":"Do you have a few minutes?. Could I have a few minutes of your time?"}]},{"t":"box","k":"tip","h":"Politeness ladder (low → high): <i>Can you…? → Could you…? → Would you…? → Would you mind + -ing…? → I was wondering if you could…<\/i> With professors, use the top of the ladder: \"<b>I was wondering if you could<\/b> take a look at my draft.\""},{"t":"h2","h":"Obligation and Necessity: must, have to, need to, don't have to, mustn't"},{"t":"tr","rows":[{"n":428,"bn":"আমাকে শুক্রবারের মধ্যে রিপোর্ট জমা দিতে হবে।","en":"I have to submit the report by Friday.","note":"","say":"I have to submit the report by Friday."},{"n":429,"bn":"আমাকে আজ রাতের মধ্যে এটা শেষ করতেই হবে।","en":"I must finish this by tonight.","note":"personal, strong feeling","say":"I must finish this by tonight."},{"n":430,"bn":"তোমার এখানে ধূমপান করা যাবে না।","en":"You mustn't smoke here.","note":"mustn't = prohibited","say":"You mustn't smoke here."},{"n":431,"bn":"তোমাকে আসতে হবে না।","en":"You don't have to come. / You needn't come.","note":"= not necessary (but you can)","say":"You don't have to come.. You needn't come."},{"n":432,"bn":"গতকাল আমাকে অনেকক্ষণ অপেক্ষা করতে হয়েছিল।","en":"I had to wait for a long time yesterday.","note":"past of must/have to = had to","say":"I had to wait for a long time yesterday."},{"n":433,"bn":"আমাকে কি ফর্মটা পূরণ করতে হবে?","en":"Do I have to fill in the form? / Do I need to fill out the form?","note":"","say":"Do I have to fill in the form?. Do I need to fill out the form?"},{"n":434,"bn":"তোমার আরো বিশ্রাম নেওয়া দরকার।","en":"You need to get more rest.","note":"","say":"You need to get more rest."},{"n":435,"bn":"আমাকে আগামী সপ্তাহে প্রেজেন্টেশন দিতে হবে।","en":"I'll have to give a presentation next week.","note":"","say":"I'll have to give a presentation next week."},{"n":436,"bn":"আমার ভিসা রিনিউ করতে হবে।","en":"I need to renew my visa.","note":"","say":"I need to renew my visa."},{"n":437,"bn":"ছাত্রদের অবশ্যই ক্লাসে উপস্থিত থাকতে হবে।","en":"Students must attend class.","note":"","say":"Students must attend class."},{"n":438,"bn":"তোমার আর চিন্তা করার দরকার নেই।","en":"You don't need to worry anymore.","note":"","say":"You don't need to worry anymore."},{"n":439,"bn":"আমাকে দুইবার ভাবতে হয়নি।","en":"I didn't have to think twice.","note":"","say":"I didn't have to think twice."}]},{"t":"box","k":"warn","h":"<b>mustn't ≠ don't have to.<\/b> \"You mustn't tell her\" = it's forbidden. \"You don't have to tell her\" = it's your choice."},{"t":"h2","h":"Advice: should, ought to, had better"},{"t":"tr","rows":[{"n":440,"bn":"তোমার ডাক্তার দেখানো উচিত।","en":"You should see a doctor.","note":"","say":"You should see a doctor."},{"n":441,"bn":"তোমার এত রাত জাগা উচিত না।","en":"You shouldn't stay up so late.","note":"","say":"You shouldn't stay up so late."},{"n":442,"bn":"আমার কি প্রফেসরকে ইমেইল করা উচিত?","en":"Should I email the professor?","note":"","say":"Should I email the professor?"},{"n":443,"bn":"তোমার আগে থেকে বুকিং দেওয়া উচিত।","en":"You ought to book in advance.","note":"","say":"You ought to book in advance."},{"n":444,"bn":"তাড়াতাড়ি করো, না হলে ট্রেন মিস করবে।","en":"You'd better hurry, or you'll miss the train.","note":"","say":"You'd better hurry, or you'll miss the train." ed<\/b> · <b>Have<\/b> you <b>finished<\/b>?<br>Short forms in speech: I've, you've, we've, they've, he's, she's, it's"},{"t":"h2","h":"The Core Idea"},{"t":"p","h":"The present perfect connects <b>the past to now<\/b>. Something happened at an <b>unspecified time<\/b> before now, and it matters <b>now<\/b>. Bengali <b>করেছি / খেয়েছে<\/b>-type endings usually map here: আমি খেয়েছি = I've eaten (so I'm not hungry now)."},{"t":"p","h":"Five uses:"},{"t":"p","h":"1. <b>Life experience (ever/never)<\/b> — no specific time: <i>I've been to Canada.<\/i>"},{"t":"p","h":"2. <b>Recent action with a present result<\/b> — <i>I've lost my keys<\/i> (I can't get in now)."},{"t":"p","h":"3. <b>Unfinished time period<\/b> — <i>I've written two emails today / this week<\/i> (today isn't over)."},{"t":"p","h":"4. <b>Situation that started in the past and continues (for/since)<\/b> — <i>I've lived here for two years.<\/i>"},{"t":"p","h":"5. <b>News and announcements<\/b> — <i>The paper has been accepted!<\/i>"},{"t":"p","h":"Signal words: <i>ever, never, just, already, yet, so far, recently, lately, up to now, until now, today, this week, for, since, how long, many times, before<\/i>."},{"t":"box","k":"warn","h":"<b>Never use the present perfect with a finished time word<\/b>: <s>I have finished it yesterday.<\/s> → I <b>finished<\/b> it yesterday. Finished time = <i>yesterday, last week, in 2022, two days ago, when I was a child, at 5 p.m.<\/i>"},{"t":"h2","h":"Use 1 — Life Experience"},{"t":"tr","rows":[{"n":587,"bn":"আমি কখনো প্যারিসে যাইনি।","en":"I've never been to Paris.","note":"","say":"I've never been to Paris."},{"n":588,"bn":"তুমি কি কখনো সুশি খেয়েছ?","en":"Have you ever eaten sushi? / Have you ever had sushi?","note":"","say":"Have you ever eaten sushi?. Have you ever had sushi?"},{"n":589,"bn":"আমি তিনবার কানাডা গিয়েছি।","en":"I've been to Canada three times.","note":"","say":"I've been to Canada three times."},{"n":590,"bn":"আমি এর আগে কখনো এত সুন্দর জায়গা দেখিনি।","en":"I've never seen such a beautiful place before.","note":"","say":"I've never seen such a beautiful place before."},{"n":591,"bn":"সে অনেক দেশ ঘুরেছে।","en":"She has travelled to many countries.","note":"","say":"She has travelled to many countries."},{"n":592,"bn":"আমি কখনো স্কাইডাইভিং করিনি।","en":"I've never been skydiving.","note":"","say":"I've never been skydiving."},{"n":593,"bn":"তুমি কি কখনো কোনো আন্তর্জাতিক কনফারেন্সে পেপার উপস্থাপন করেছ?","en":"Have you ever presented a paper at an international conference?","note":"","say":"Have you ever presented a paper at an international conference?"},{"n":594,"bn":"হ্যাঁ, আমি দুবার করেছি।","en":"Yes, I have — twice.","note":"","say":"Yes, I have — twice."},{"n":595,"bn":"আমি জীবনে কখনো এত নার্ভাস হইনি।","en":"I've never been so nervous in my life.","note":"","say":"I've never been so nervous in my life."},{"n":596,"bn":"এটা আমার দেখা সবচেয়ে ভালো সিনেমা।","en":"It's the best movie I've ever seen.","note":"","say":"It's the best movie I've ever seen."},{"n":597,"bn":"এটা সবচেয়ে কঠিন পরীক্ষা যা আমি দিয়েছি।","en":"It's the hardest exam I've ever taken.","note":"","say":"It's the hardest exam I've ever taken."},{"n":598,"bn":"আমি কখনো গাড়ি চালাইনি।","en":"I've never driven a car.","note":"","say":"I've never driven a car."},{"n":599,"bn":"তুমি কি কখনো বরফ পড়তে দেখেছ?","en":"Have you ever seen snow fall?","note":"","say":"Have you ever seen snow fall?"},{"n":600,"bn":"আমি অনেকবার এই ভুলটা করেছি।","en":"I've made this mistake many times.","note":"","say":"I've made this mistake many times."},{"n":601,"bn":"আমি আগে কখনো ওকে দেখিনি।","en":"I've never met him before.","note":"","say":"I've never met him before."},{"n":602,"bn":"সে কখনো বিমানে চড়েনি।","en":"She has never been on a plane.","note":"","say":"She has never been on a plane."},{"n":603,"bn":"আমার জীবনে আমি অনেক ভালো শিক্ষক পেয়েছি।","en":"I've had many good teachers in my life.","note":"","say":"I've had many good teachers in my life."},{"n":604,"bn":"তুমি কি কখনো টিএ হিসেবে কাজ করেছ?","en":"Have you ever worked as a TA?","note":"","say":"Have you ever worked as a TA?"},{"n":605,"bn":"আমি কখনো এরকম কিছু শুনিনি।","en":"I've never heard anything like that.","note":"","say":"I've never heard anything like that."},{"n":606,"bn":"আমি একবার নায়াগ্রা জলপ্রপাত দেখেছি।","en":"I've seen Niagara Falls once.","note":"","say":"I've seen Niagara Falls once."}]},{"t":"box","k":"note","h":"<b>been vs gone<\/b>: \"She <b>has been<\/b> to Dhaka\" = she went and came back. \"She <b>has gone<\/b> to Dhaka\" = she is there now (not here)."},{"t":"h2","h":"Use 2 — Recent Action, Present Result (just, already, yet)"},{"t":"box","k":"rule","h":"<b>just<\/b> = a very short time ago (between have and V3): I've <b>just<\/b> finished.<br><b>already<\/b> = earlier than expected (between have and V3, or at the end): I've <b>already<\/b> eaten.<br><b>yet<\/b> = in negatives and questions, at the END: I haven't finished <b>yet<\/b>. Have you finished <b>yet<\/b>?<br><b>still<\/b> = in negatives, before haven't: I <b>still<\/b> haven't heard back."},{"t":"tr","rows":[{"n":607,"bn":"আমি এইমাত্র খেয়েছি।","en":"I've just eaten.","note":"","say":"I've just eaten."},{"n":608,"bn":"সে এইমাত্র বের হয়ে গেছে।","en":"She's just left.","note":"","say":"She's just left."},{"n":609,"bn":"আমি এইমাত্র তোমার ইমেইল পেলাম।","en":"I've just got your email. / I just got your email. (US)","note":"","say":"I've just got your email.. I just got your email."},{"n":610,"bn":"আমি আমার চাবি হারিয়ে ফেলেছি।","en":"I've lost my keys.","note":"","say":"I've lost my keys."},{"n":611,"bn":"কেউ আমার সাইকেল চুরি করে নিয়ে গেছে।","en":"Someone has stolen my bike.","note":"","say":"Someone has stolen my bike."},{"n":612,"bn":"আমি ইতিমধ্যে রিপোর্টটা জমা দিয়ে দিয়েছি।","en":"I've already submitted the report.","note":"","say":"I've already submitted the report."},{"n":613,"bn":"আমি তাকে ইতিমধ্যে জানিয়ে দিয়েছি।","en":"I've already told her.","note":"","say":"I've already told her."},{"n":614,"bn":"তুমি কি খেয়েছ?","en":"Have you eaten yet? / Have you had dinner?","note":"","say":"Have you eaten yet?. Have you had dinner?"},{"n":615,"bn":"না, এখনও খাইনি।","en":"No, I haven't eaten yet.","note":"","say":"No, I haven't eaten yet."},{"n":616,"bn":"আমি এখনও সিদ্ধান্ত নিইনি।","en":"I haven't decided yet.","note":"","say":"I haven't decided yet."},{"n":617,"bn":"রিভিউয়াররা এখনও উত্তর দেয়নি।","en":"The reviewers haven't replied yet.","note":"","say":"The reviewers haven't replied yet."},{"n":618,"bn":"আমি এখনও প্রফেসরের উত্তর পাইনি।","en":"I still haven't heard back from my professor.","note":"","say":"I still haven't heard back from my professor."},{"n":619,"bn":"সে ওজন কমিয়েছে।","en":"He has lost weight.","note":"","say":"He has lost weight."},{"n":620,"bn":"তুমি চুল কেটেছ!","en":"You've had a haircut! / You've cut your hair!","note":"","say":"You've had a haircut!. You've cut your hair!"},{"n":621,"bn":"বৃষ্টি থেমে গেছে।","en":"The rain has stopped.","note":"","say":"The rain has stopped."},{"n":622,"bn":"আমি ভুলে গেছি তার নাম।","en":"I've forgotten his name.","note":"","say":"I've forgotten his name."},{"n":623,"bn":"দাম অনেক বেড়ে গেছে।","en":"Prices have gone up a lot.","note":"","say":"Prices have gone up a lot."},{"n":624,"bn":"আমার ফোনের চার্জ শেষ হয়ে গেছে।","en":"My phone has died. / My phone battery has run out.","note":"","say":"My phone has died.. My phone battery has run out."},{"n":625,"bn":"আমি পাসওয়ার্ড ভুলে গেছি।","en":"I've forgotten my password.","note":"","say":"I've forgotten my password."},{"n":626,"bn":"তারা তাদের অ্যাপয়েন্টমেন্ট বাতিল করেছে।","en":"They've cancelled their appointment.","note":"","say":"They've cancelled their appointment."},{"n":627,"bn":"পেপারটা অ্যাকসেপ্ট হয়েছে!","en":"The paper has been accepted!","note":"","say":"The paper has been accepted!"},{"n":628,"bn":"আমি মাত্র ঘুম থেকে উঠলাম।","en":"I've just woken up.","note":"","say":"I've just woken up."},{"n":629,"bn":"আমি এখনও ডিনার রান্না করা শুরুই করিনি।","en":"I haven't even started cooking dinner yet.","note":"","say":"I haven't even started cooking dinner yet."},{"n":630,"bn":"তুমি কি তোমার অ্যাসাইনমেন্ট শেষ করেছ?","en":"Have you finished your assignment yet?","note":"","say":"Have you finished your assignment yet?"},{"n":631,"bn":"হ্যাঁ, এইমাত্র শেষ করলাম।","en":"Yes, I've just finished it.","note":"","say":"Yes, I've just finished it."},{"n":632,"bn":"ক্লাস ইতিমধ্যে শুরু হয়ে গেছে।","en":"The class has already started.","note":"","say":"The class has already started."},{"n":633,"bn":"ট্রেনটা কি ছেড়ে দিয়েছে?","en":"Has the train left yet?","note":"","say":"Has the train left yet?"},{"n":634,"bn":"সে তার মত বদলেছে।","en":"He has changed his mind.","note":"","say":"He has changed his mind."},{"n":635,"bn":"আমি আমার মানিব্যাগ বাসায় রেখে এসেছি।","en":"I've left my wallet at home.","note":"","say":"I've left my wallet at home."},{"n":636,"bn":"আমি কফিতে চিনি দিতে ভুলে গেছি।","en":"I've forgotten to put sugar in the coffee.","note":"","say":"I've forgotten to put sugar in the coffee."}]},{"t":"h2","h":"Use 3 — Unfinished Time Period (today, this week, so far)"},{"t":"tr","rows":[{"n":637,"bn":"আজ আমি চার কাপ কফি খেয়েছি।","en":"I've had four cups of coffee today.","note":"today isn't finished","say":"I've had four cups of coffee today."},{"n":638,"bn":"এই সপ্তাহে আমি তিনটা মিটিং করেছি।","en":"I've had three meetings this week.","note":"","say":"I've had three meetings this week."},{"n":639,"bn":"এই সেমিস্টারে আমি দুটো পেপার জমা দিয়েছি।","en":"I've submitted two papers this semester.","note":"","say":"I've submitted two papers this semester."},{"n":640,"bn":"এ বছর আমরা অনেক কিছু শিখেছি।","en":"We've learned a lot this year.","note":"","say":"We've learned a lot this year."},{"n":641,"bn":"এখন পর্যন্ত সবকিছু ভালোই চলছে।","en":"So far, everything has gone well.","note":"","say":"So far, everything has gone well."},{"n":642,"bn":"এখন পর্যন্ত আমি পঞ্চাশটা খাতা দেখেছি।","en":"So far, I've graded fifty papers. / I've marked fifty scripts so far.","note":"","say":"So far, I've graded fifty papers.. I've marked fifty scripts so far."},{"n":643,"bn":"আজ সকালে আমি কিছু খাইনি।","en":"I haven't eaten anything this morning.","note":"if it's still morning","say":"I haven't eaten anything this morning."},{"n":644,"bn":"আজ সকালে আমি কিছু খাইনি। (এখন রাত)","en":"I didn't eat anything this morning.","note":"if the morning is over → past simple","say":"I didn't eat anything this morning."},{"n":645,"bn":"ইদানীং আমি ঠিকমতো ঘুমাতে পারছি না।","en":"I haven't been sleeping well lately.","note":"","say":"I haven't been sleeping well lately."},{"n":646,"bn":"সম্প্রতি অনেক কিছু বদলে গেছে।","en":"A lot has changed recently.","note":"","say":"A lot has changed recently."},{"n":647,"bn":"এ মাসে বৃষ্টি হয়নি।","en":"It hasn't rained this month.","note":"","say":"It hasn't rained this month."},{"n":648,"bn":"আমি আজ এখনও বাসায় ফোন করিনি।","en":"I haven't called home today.","note":"","say":"I haven't called home today."}]},{"t":"h2","h":"Use 4 — Started in the Past, Continues Now (for / since)"},{"t":"box","k":"rule","h":"<b>for<\/b> + a length of time: for two years, for ten minutes, for ages, for a long time<br><b>since<\/b> + a starting point: since 2023, since Monday, since I came here, since last summer<br>How long <b>have you<\/b> … ? (NOT \"How long are you…?\" / NOT \"Since when are you…?\")"},{"t":"tr","rows":[{"n":649,"bn":"আমি দুই বছর ধরে এখানে আছি।","en":"I've been here for two years.","note":"","say":"I've been here for two years."},{"n":650,"bn":"আমি ২০২৪ সাল থেকে আমেরিকায় আছি।","en":"I've been in the US since 2024.","note":"","say":"I've been in the US since 2024."},{"n":651,"bn":"আমি তাকে দশ বছর ধরে চিনি।","en":"I've known him for ten years.","note":"NOT \"I know him for ten years\"","say":"I've known him for ten years."},{"n":652,"bn":"আমরা পাঁচ বছর ধরে বিবাহিত।","en":"We've been married for five years.","note":"","say":"We've been married for five years."},{"n":653,"bn":"তুমি কতদিন
